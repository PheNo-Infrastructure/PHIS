# GitHub Actions Workflow for OpenSILEX Testing
#
# Copy this file to: .github/workflows/tier3-tests.yml
#
# Runs comprehensive testing suite on:
# - Every push to main/production branches
# - Daily at 2 AM (scheduled)
# - Manual trigger via GitHub UI
#
# Requires GitHub Secrets:
# - OPENSILEX_API_URL: http://YOUR_SERVER/sandbox/rest
# - OPENSILEX_ADMIN_PASSWORD: Your admin password
# - SSH_PRIVATE_KEY: SSH key for server access (for database tests)

name: OpenSILEX Tier 3 Testing

on:
  push:
    branches:
      - main
      - master
      - production
      - docker-compose-official
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  tier2-api-tests:
    name: Tier 2 - API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements.txt

      - name: Run Tier 2 API tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
          OPENSILEX_TEST_PREFIX: 'ci_test_'
          OPENSILEX_CLEANUP_TEST_DATA: 'true'
        run: |
          cd tools/testing/tier2/api-tests
          python -m pytest \
            --html=report.html \
            --self-contained-html \
            -v \
            --tb=short \
            --maxfail=5

      - name: Upload API test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: tier2-api-test-report
          path: tools/testing/tier2/api-tests/report.html
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            // Parse test results and comment on PR
            // (Implementation depends on your needs)

  tier3-performance:
    name: Tier 3 - Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tier2-api-tests  # Run after API tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Tier 3 dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Run performance benchmarks
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/performance-tests
          python -m pytest test_api_benchmarks.py \
            -v \
            --tb=short

      - name: Archive performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-benchmarks
          path: tools/testing/tier3/performance-tests/*.csv
          retention-days: 90

  tier3-security:
    name: Tier 3 - Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tier2-api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Tier 3 dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Run authorization tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/security-tests
          python -m pytest test_authorization.py \
            -v \
            --tb=short

      - name: Run JWT security tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/security-tests
          python -m pytest test_jwt_security.py \
            -v \
            --tb=short

      - name: Upload security test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: tools/testing/tier3/security-tests/.pytest_cache
          retention-days: 30

  tier3-database-integrity:
    name: Tier 3 - Database Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tier2-api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Set up SSH key for server access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.OPENSILEX_SERVER }} >> ~/.ssh/known_hosts

      - name: Run MongoDB integrity checks
        env:
          OPENSILEX_SERVER: ${{ secrets.OPENSILEX_SERVER }}
          OPENSILEX_DEPLOY_DIR: '~/opensilex-docker-compose'
        run: |
          cd tools/testing/tier3/database-tests
          bash test-mongodb-integrity.sh

      - name: Run RDF4J integrity checks
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/database-tests
          bash test-rdf4j-integrity.sh

      - name: Run cross-database consistency tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/database-tests
          python -m pytest test_cross_db_consistency.py \
            -v \
            --tb=short

      - name: Upload integrity test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: database-integrity-results
          path: tools/testing/tier3/database-tests/*.log
          retention-days: 30

  test-summary:
    name: Test Summary & Notifications
    runs-on: ubuntu-latest
    needs: [tier2-api-tests, tier3-performance, tier3-security, tier3-database-integrity]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "All testing stages completed"
          echo "Review artifacts for detailed results"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            // Send notification on failure
            // (Customize based on your notification preferences)
            console.log('Tests failed - notification would be sent here');

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled Test Failure - ${new Date().toISOString().split('T')[0]}`,
              body: `The scheduled Tier 3 test run failed. Please investigate.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['testing', 'automated']
            });

# Optional: Performance trend tracking
# Could add a job that compares current performance to baseline
# and fails if degradation exceeds threshold
