# OpenSILEX Docker Configuration
# This file will be mounted into the container at /app/config/opensilex.yml

ontologies:
  baseURI: "http://localhost:8666/"
  baseURIAlias: "docker"
  sparql:
    config:
      serverURI: "http://graphdb:7200"
      repository: "opensilex"
      maxConnections: 10
      connectionTimeout: 30000
      readTimeout: 60000
      queryTimeout: 120000

big-data:
  mongodb:
    implementation: org.opensilex.nosql.mongodb.MongoDBService
    config:
      host: "mongodb"
      port: 27017
      database: "opensilex"

file-system:
  fs:
    config:
      defaultFS: "local"
      connections:
        local:
          implementation: org.opensilex.fs.local.LocalFileSystemConnection
          config:
            basePath: "/app/data/files"
