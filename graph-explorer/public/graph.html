<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph</title>
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
  :root { --bg:#fff; --ink:#264030; --muted:#5d6b5b; --line:#dfe6d3; --card:#fff; --surface:#F2F5DE; --accent:#3d8526; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 "Public Sans", system-ui, sans-serif; color:var(--ink); background:var(--bg); display:grid; grid-template-columns:1fr 300px; height:100vh; }
  #graph { position:relative; min-width:0; }
  :root.embed body { grid-template-columns:1fr; } :root.embed #side { display:none; } /* in the portal this panel lives in its Selection pane */
  #side { background:var(--surface); border-left:1px solid var(--line); padding:14px; overflow:auto; }
  h1 { font-size:15px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:12px; }
  #legend { margin:10px 0; display:flex; flex-wrap:wrap; gap:4px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; font-size:12px; border-radius:99px; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip[aria-pressed="false"] { opacity:.45; text-decoration:line-through; }
  .chip.static { cursor:default; border-color:transparent; background:none; }
  button, .chk { font:inherit; padding:5px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; }
  .chk { display:inline-flex; gap:6px; align-items:center; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  ul { padding-left:16px; margin:6px 0; } li a { color:var(--accent); cursor:pointer; }
  #bar { position:absolute; left:10px; top:10px; display:flex; gap:6px; z-index:2; }
  .banner { background:var(--card); border:1px solid var(--accent); border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  #crumbs { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:99px; padding:5px 14px; font-size:13px; display:flex; gap:8px; align-items:center; }
  #crumbs[hidden] { display:none; }
  #crumbs button { border:0; background:none; padding:0; color:var(--accent); cursor:pointer; font:inherit; }
  #terr { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  #links { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  #halo { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; filter:blur(7px); }
  #marquee { position:absolute; display:none; border:1px solid var(--accent); background:rgba(61,133,38,.16); pointer-events:none; z-index:3; }
  .verdict { border-radius:6px; padding:6px 10px; margin:8px 0; font-size:13px; }
  .verdict.ok { background:rgba(61,133,38,.14); border:1px solid var(--accent); }
  .verdict.no { background:rgba(211,51,51,.12); border:1px solid #d33; }
  .verdict.later { background:rgba(208,138,46,.14); border:1px solid #d08a2e; }
  button[disabled] { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="graph"><canvas id="terr"></canvas><canvas id="halo"></canvas><canvas id="links"></canvas><div id="crumbs" hidden></div><div id="marquee"></div><div id="bar"><label class="chk"><input type="checkbox" id="compact" checked> Compact</label><label class="chk"><input type="checkbox" id="live"> ForceAtlas</label><button id="reset">Reset layout</button><button id="fit">Fit</button></div></div>
<aside id="side"><h1>Graph</h1><div id="stats" class="muted">Loading...</div><div id="legend"></div><div id="sel"></div></aside>
<script src="vendor/graphology.umd.min.js"></script>
<script src="vendor/graphology-library.min.js"></script>
<script src="vendor/sigma.min.js"></script>
<script>
// Nodes and the painted regions around them are the brand greens (Forest, Leaf dark, Leaf light, between Leaf light and Straw, Straw dark), told apart by lightness and,
// on the discs, by the icon inside.
const COLORS = { fold:"#a8c79b", organization:"#264030", facility:"#3d8526", experiment:"#87cf82", site:"#b5dd92", project:"#e3eba1", device:"#8b9788", person:"#6aa86a", group:"#5d7a68", factor:"#c3cf8a", species:"#9fc07a" };
// Minimal line icons (24 x 24), drawn over the discs in the style of the PheNo icon set.
const ICON_PATHS = {
  organization: "M5 21V5l7-2 7 2v16M3 21h18M9 9h2M13 9h2M9 13h2M13 13h2M10 21v-4h4v4",
  facility: "M4 11l8-6 8 6v9H4zM12 20v-6M12 15c-2.5 0-3.5-1.5-3.5-3.5 2.5 0 3.5 1.5 3.5 3.5zM12 15c2.5 0 3.5-1.5 3.5-3.5-2.5 0-3.5 1.5-3.5 3.5z",
  site: "M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11zM12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z",
  project: "M3 7h7l2 2h9v10H3z",
  experiment: "M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8",
  device: "M7 7h10v10H7zM10 10h4v4h-4zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4",
  fold: "M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",
  person: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-8 8-8s8 3.6 8 8",
  group: "M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 11a2.5 2.5 0 1 0 0-5M17 14.2c2.4.4 4 2.4 4 5.8",
  factor: "M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4",
  species: "M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19c3-5 6-8 10-10",
};
const NAMES = { fold:"Folded group", organization:"Organization", facility:"Facility", site:"Site", project:"Project", experiment:"Experiment", device:"Device", person:"Person", group:"Group", factor:"Factor", species:"Species" };
const FILTERS = ["organization", "site", "project", "experiment", "facility", "device", "person", "group", "factor", "species"]; // a folded group follows its facilities
const HINT = document.documentElement.classList.contains("embed") ? '' : '<p class="muted">Click a node to see what it is linked to; Ctrl+click adds or removes nodes, and dragging a box on empty space selects everything inside it. Right-drag moves the view. A grey group opens when you click it or something linked to it, and folds when you click anything unrelated; Ctrl or Shift keeps it open. Double-click opens a page. Drag a node and the graph follows; ForceAtlas (top left) keeps the layout running when on, and leaves things where you put them when off. Click a type above to hide it.</p>';
const embedded = document.documentElement.classList.contains("embed");
const e = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// Same packing the portal's share link uses, so "Open page" lands on the node's page.
async function pack(obj) {
  const bytes = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
  return btoa(Array.from(bytes, b => String.fromCharCode(b)).join("")).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function openInPortal(n) {
  const item = { id:n.id, type:n.kind, label:n.label };
  const st = { view:"browse", path:[item], sel:[], anchor:null, tab:{}, plants:{}, vf:{}, grid:{ stats:false, sharedY:false, overlay:false, norm:false, hidden:[] }, day:null, ui:null };
  const url = new URL(`./#browse&s=${await pack(st)}`, location.href);
  if (embedded) { parent.postMessage({ kind: "open", item }, location.origin); return; } // the portal opens it and keeps the selection
  location.href = url;
}

(async () => {
  document.getElementById("sel").innerHTML = HINT;
  const params = new URLSearchParams(location.search);
  const { ADJACENT } = await import("./adjacency.js"); // the portal's own rules for which types link
  const data = await (await fetch("api/graph")).json();
  const inst = await (await fetch("api/instance")).json().catch(() => ({ test: false }));
  const { Graph } = graphology, FA2 = graphologyLibrary.layoutForceAtlas2;
  const g = new Graph({ type:"undirected" });
  // Small graphs keep a compact layout (gravity 1, repulsion 6); as a graph grows it spreads (gravity .1, repulsion 80) so its clusters separate instead of forming a hairball.
  const settingsFor = gr => { const t = Math.min(1, Math.max(0, (gr.order - 60) / 240)); return { ...FA2.inferSettings(gr), gravity: 1 - .9 * t, scalingRatio: 6 + 74 * t, slowDown:4, barnesHutOptimize: gr.order > 500 }; };
  const kindOf = id => g.getNodeAttribute(id, "kind");
  const hasPage = k => k !== "fold" && k !== "species"; // a folded group and a species have no resource page to open
  const filterKind = a => a.kind === "fold" ? "facility" : a.kind;
  // Size follows the number of links on a log scale, relative to the most linked node of this graph: the biggest hub is always the largest (22), a node with one link the smallest (about 8),
  // whatever the data looks like. The log keeps one huge hub from shrinking everything else to the same size.
  let maxDeg = 1;
  const setMaxDeg = () => { maxDeg = 1; g.forEachNode(id => { maxDeg = Math.max(maxDeg, g.degree(id)); }); };
  const styleOf = (id) => {
    const a = g.getNodeAttributes(id), deg = g.degree(id);
    const orphan = deg === 0;
    return { orphan, color: COLORS[a.kind], size: a.kind === "fold" ? 10 + Math.sqrt(a.count) * 2 : 4 + 18 * Math.log1p(deg) / Math.log1p(maxDeg) };
  };
  data.nodes.forEach(({ type, ...n }) => g.addNode(n.id, { ...n, kind:type, x:Math.random(), y:Math.random() }));
  data.edges.forEach(ed => g.hasEdge(ed.source, ed.target) || g.addEdge(ed.source, ed.target));

  // Nothing is grouped by type: facilities, devices and everything else are ordinary nodes. Structure comes from the clusters below, found from the links.
  const folds = new Map(), memberFold = new Map(), open = new Set(); // ponytail: the old collapsed-node code further down is dead (nothing folds any more); remove it in its own change
  setMaxDeg();
  g.forEachNode(id => g.mergeNodeAttributes(id, styleOf(id)));
  FA2.assign(g, { iterations:200, settings: settingsFor(g) });

  // ---- what is shown: type filters and an optional neighbourhood (everything within N links of one node; the walk stops at the members of an opened group) ----
  const hiddenKinds = new Set();
  // ---- clusters: Louvain groups the graph. On a big graph a cluster is painted (named after its biggest organisation) until you zoom in far enough to read its nodes. ----
  const TERR = ["#87cf82", "#b5dd92", "#e3eba1", "#9fc07a", "#6aa86a"];
  const PLURAL = { facility:"facilities", organization:"organizations", species:"species", scientific_object:"objects", experiment:"experiments", device:"devices", person:"people", project:"projects", site:"sites", group:"groups", factor:"factors", fold:"facilities and devices" };
  const CLOSED_R = .27, OPEN_R = .25; // how far a cluster's nodes paint, as a share of BLOB: small, so a cluster's area follows its own outline
  // A cluster shows its nodes once it nearly fills the view and they have room (average gap between neighbours in px), and is painted again when it shrinks below the lower share.
  // It depends on the zoom and on how many nodes the cluster holds, not on the size of the whole graph, so it adapts to any amount of data.
  // (rewritten: a cluster must nearly fill the view, and its nodes must also have room)
  const SHOW_FRAC = .28, HIDE_FRAC = .2; // a cluster's radius as a share of the shorter side of the view
  const MIN_GAP = 30; // and its neighbours at least this far apart on screen, so a crowded cluster needs more zoom than a sparse one
  const MIN_CLUSTERED = 500, MIN_CLUSTER = 8, TYPE_MIN = 12, TYPE_SHARE = .2; // below MIN_CLUSTERED the graph is plain, except for a type with at least TYPE_MIN nodes and TYPE_SHARE of the graph: it becomes a category area of its own // ponytail: below this many nodes a graph is readable as it is; 500 is a guess, tune on real data
  const collapsed = new Set(), clusterOf = new Map(), // collapsed: the clusters painted right now, not drawn as nodes
    clusterHex = new Map(TERR.map((hex, i) => ["cc:" + i, hex])); // clusterHex: paint layer key -> colour; clusters share a few colour layers (the painter blends only so many) // collapsed: cluster keys (the id of its biggest organisation); clusterOf: node id -> cluster key
  let clusters = [], clusterKey = "", clustersSeen = false;
  const compactBox = document.getElementById("compact");
  // After the first clustering the groups stay as they are, or what is collapsed and open would jump: a node that appears (a group opening) joins the cluster most of its neighbours are in, a gone one leaves.
  function keepClusters() {
    const byKey = new Map(clusters.map(c => [c.key, c]));
    for (const c of clusters) c.members = c.members.filter(id => g.hasNode(id));
    for (const id of [...clusterOf.keys()]) if (!g.hasNode(id)) clusterOf.delete(id);
    g.forEachNode(id => {
      if (clusterOf.has(id)) return;
      const votes = new Map(); g.forEachNeighbor(id, n => { const k = clusterOf.get(n); if (k) votes.set(k, (votes.get(k) || 0) + 1); });
      const best = [...votes].sort((a, b) => b[1] - a[1])[0];
      if (best) { clusterOf.set(id, best[0]); byKey.get(best[0]).members.push(id); }
    });
  }
  function findClusters() {
    const key = g.order + ":" + g.size;
    if (key === clusterKey) return;
    clusterKey = key;
    if (g.order < MIN_CLUSTERED) { clusters = []; clusterOf.clear(); return; } // a small graph stays plain
    if (clusters.length) return keepClusters();
    clusterOf.clear();
    let seed = 7; const rng = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; // the same graph always clusters the same way
    const comm = graphologyLibrary.communitiesLouvain(g, { rng }), by = new Map();
    g.forEachNode(id => { const c = comm[id]; if (!by.has(c)) by.set(c, []); by.get(c).push(id); });
    clusters = [...by.values()].filter(m => m.length >= MIN_CLUSTER).map(members => {
      const n = {}; let top = null;
      for (const id of members) {
        const a = g.getNodeAttributes(id); n[a.kind] = (n[a.kind] || 0) + (a.kind === "fold" ? a.count : 1);
        if (a.kind === "organization" && (!top || g.degree(id) > g.degree(top))) top = id;
      }
      top ??= members.reduce((b, id) => g.degree(id) > g.degree(b) ? id : b);
      const parts = Object.entries(n).filter(([k]) => PLURAL[k]).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, v]) => `${v} ${PLURAL[k]}`);
      const name = String(g.getNodeAttribute(top, "label"));
      const size = Object.values(n).reduce((t, v) => t + v, 0);
      return { key: top, members, size, name: name.length > 28 ? name.slice(0, 27) + "..." : name, parts };
    });
    clusters.forEach(c => c.members.forEach(id => clusterOf.set(id, c.key)));
    const byKey = new Map(clusters.map(c => [c.key, c]));
    g.forEachNode(id => { // a node left out (its group was too small) joins the cluster most of its neighbours are in
      if (clusterOf.has(id)) return;
      const votes = new Map(); g.forEachNeighbor(id, n => { const k = clusterOf.get(n); if (k) votes.set(k, (votes.get(k) || 0) + 1); });
      const best = [...votes].sort((a, b) => b[1] - a[1])[0]; if (best) { clusterOf.set(id, best[0]); byKey.get(best[0]).members.push(id); }
    });
    if (!clustersSeen) { clustersSeen = true; clusters.forEach(c => collapsed.add(c.key)); } // only the first time: a cluster that appears later does not hide what you are looking at
    stats();
  }
  let focus = null, focusSet = null, selected = null, lit = null;
  let cur = null; // inside the portal: the resource open in Browse; lit and unfolded like a selection, but not part of it (nothing is linked to it by being open)
  const sel = new Set();           // selected node ids; a folded group stands for all its members
  let canLink = new Set(), litSel = new Set(), misfit = new Set(), visCount = 0, tintIds = new Set(); // tintIds: the selection and what it links to directly; the members of an opened group are not tinted
  // Faded, not grey: an unrelated node keeps its own colour (a red orphan stays reddish) so it can still be found and added to the selection.
  const bg = dark => dark ? [22, 27, 20] : [255, 255, 255];
  const fade = (hex, isDark, keep = .4) => { if (hex.length === 4) hex = "#" + [...hex.slice(1)].map(ch => ch + ch).join(""); const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), b = bg(isDark); return "#" + c.map((v, i) => Math.round(v * keep + b[i] * (1 - keep)).toString(16).padStart(2, "0")).join(""); };
  // In a focus view an opened group's hub steps aside when the focused node links straight to the facilities it uses.
  const hubHidden = f => focus && open.has(f) && f !== focus.id && folds.get(f).members.some(m => g.hasEdge(focus.id, m.id));
  function computeFocus() {
    if (focus && !g.hasNode(focus.id)) focus = null;
    if (!focus) { focusSet = null; return; }
    focusSet = new Set([focus.id]);
    let frontier = [focus.id];
    for (let h = 0; h < focus.hops; h++) { // the walk stops at the members of an opened group
      const next = [];
      for (const id of frontier) if (!memberFold.has(id)) g.forEachNeighbor(id, nb => { if (!focusSet.has(nb)) { focusSet.add(nb); next.push(nb); } });
      frontier = next;
    }
    for (const f of [...focusSet]) if (open.has(f) && !hubHidden(f)) folds.get(f).members.forEach(({ id }) => g.hasNode(id) && focusSet.add(id));
  }
  const inLayout = id => !hiddenKinds.has(filterKind(g.getNodeAttributes(id))) && !(open.has(id) && g.getNodeAttribute(id, "kind") === "fold") && // an opened group has no node of its own: its facilities hang off its parents
    (!focusSet || (focusSet.has(id) && !(g.getNodeAttribute(id, "kind") === "fold" && hubHidden(id))));
  let catView = null; // { key, kind, set, saved } while one category of one cluster is shown on its own
  const hiddenByArea = id => compactBox.checked && collapsed.has(clusterOf.get(id)); // Compact (the box) is the switch for painted areas: off shows every node
  const isVisible = id => catView ? inLayout(id) : (!hiddenByArea(id) || !!lit?.has(id)) && inLayout(id); // what is selected and connected is drawn at any zoom, on top of the paint; // a node in a collapsed cluster is not drawn, but it is still a node: physics, fit and the selection window use inLayout
  const verdictNow = () => ([...sel].every(id => folds.has(id)) && sel.size === 1) ? { kind: "none", why: "Select something else to link this group to." } : linkVerdict(selItems());
  // What a selection lights up: the node, its neighbours, and the members of any opened group among them (they hang off the group, not off the node).
  // The selection as PHIS things: a folded group is every facility and device inside it.
  const lens = () => cur && g.hasNode(cur) && !sel.has(cur) ? [...sel, cur] : [...sel];
  function selItems() {
    const out = [];
    for (const id of sel) {
      if (folds.has(id)) folds.get(id).members.forEach(({ id: mid, attrs }) => out.push({ id: mid, type: attrs.kind, label: attrs.label }));
      else if (g.hasNode(id)) out.push({ id, type: kindOf(id), label: g.getNodeAttribute(id, "label") });
    }
    return out;
  }
  // Can the selection be linked? Same rule as the portal's Link selection: every item needs a partner it can link to.
  const plural = t => (NAMES[t] || t).toLowerCase() + "s";
  // The portal's rule for which types link. A type that lists itself (organization: parent and child; project: related projects) links to its own kind too,
  // which needs a parent-child order, asked for when linking.
  const adjacent = (a, b) => (ADJACENT[a] || []).includes(b) || (ADJACENT[b] || []).includes(a);
  const selfLinkable = t => (ADJACENT[t] || []).includes(t);
  function linkVerdict(items) {
    if (items.length < 2) return { kind: "none", why: items.length ? "Select a second thing to link it to." : "" };
    const types = [...new Set(items.map(v => v.type))];
    if (types.length === 1 && !selfLinkable(types[0])) return { kind: "none", why: `Two ${types[0] === "facility" ? "facilities" : plural(types[0])} can't be linked to each other.` };
    if (types.length === 2 && types.includes("device") && types.includes("facility")) return { kind: "later", why: "Moving devices into a facility needs a date. Do that in Browse for now." };
    const pairOk = (a, b) => adjacent(a, b);
    const bad = items.filter(v => !items.some(w => w !== v && pairOk(v.type, w.type)));
    if (bad.length) return { kind: "none", why: `${bad[0].label} (${NAMES[bad[0].type].toLowerCase()}) can't be linked to anything else selected${bad.length > 1 ? ` (nor ${bad.length - 1} more)` : ""}. Remove ${bad.length > 1 ? "them" : "it"} to link the rest.`, bad: bad.map(v => v.id) };
    return { kind: "link", note: types.length === 1 ? (types[0] === "organization" ? "They link as parent and child; you choose which is which when linking." : "They link as related " + plural(types[0]) + ".") : "" };
  }
  // What a selection lights up: the selected nodes, their neighbours, and the members of any opened group among them (they hang off the group, not off the node).
  function computeLit() {
    for (const id of [...sel]) if (!g.hasNode(id)) sel.delete(id);
    findClusters();
    litSel = new Set(); misfit = new Set(); canLink = new Set();
    visCount = 0; g.forEachNode(id => { if (isVisible(id)) visCount++; });
    const L = lens();
    if (!L.length) { lit = null; tintIds = new Set(); return; }
    lit = new Set(L); litSel = new Set(L);
    for (const id of L) g.forEachNeighbor(id, n => lit.add(n));
    visCount = 0; g.forEachNode(id => { if (isVisible(id)) visCount++; }); // lit is known now: it decides what is drawn inside a painted cluster
    // The members of an opened group are named, not painted (an organization or site would otherwise paint every facility of it), unless something that is not the group's parent
    // (a person, an experiment) is linked to them directly: then they are what that selection is about.
    const parentKind = id => ["organization", "site"].includes(kindOf(id));
    tintIds = new Set([...lit].filter(id => L.includes(id) || !(memberFold.has(id) && open.has(memberFold.get(id))) || L.some(x => g.hasEdge(x, id) && !parentKind(x))));
    for (const f of [...lit]) if (open.has(f)) folds.get(f).members.forEach(({ id }) => g.hasNode(id) && lit.add(id));
    for (const f of L) if (open.has(f)) folds.get(f)?.members.forEach(({ id }) => g.hasNode(id) && litSel.add(id)); // an opened group that is selected: all its members are
    const v = verdictNow();
    (v.bad || []).forEach(id => misfit.add(id));
    // Unlinked nodes the selection could be linked to are shown a little stronger than the rest (device and facility need a date, so they are left out)
    canLink = new Set();
    const types = new Set(selItems().map(i => i.type));
    const pairOk = (a, b) => !(a === "device" && b === "facility" || a === "facility" && b === "device") && adjacent(a, b);
    g.forEachNode((id, a) => { if (!lit.has(id) && isVisible(id) && [...types].some(t => pairOk(t, filterKind(a)))) canLink.add(id); });
  }

  const edgeKey = (a, b) => a < b ? a + " " + b : b + " " + a;
  const fx = { pulses: [], sparks: [], flash: new Set() }; // short-lived effects for a link being made or undone
