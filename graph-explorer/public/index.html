      const where = andList(w.flatMap(x => x.experiments));
      const why = w.every(x => x.only) ? ` — the only experiment ${w.length === 1 ? "it's" : "they're"} in` : "";
      showToast(`${andList(w.flatMap(x => x.values).map(labelOf))} set on ${andList(w.map(x => labelOf(x.id)))} in ${where}${why}${already}`);
    } else {
      showToast(`Linked ${body.linkedPairs} relation${body.linkedPairs === 1 ? "" : "s"}${already}`);
    }
  } catch (err) {
    showToast(`Failed to link: ${err}`);
  }
}

// "Unlink selection": asks the backend which links exist between the selected items, names
// every one in a confirm, and only then removes them (stopping at the first failure).
async function unlinkSelection(items) {
  const post = (confirm) => fetch("/api/unlink", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: items.map(v => ({ type: v.type, id: v.id })), ...(confirm ? { confirm: true } : {}) }),
  });
  try {
    const res = await post(false);
    const body = await res.json();
    if (!res.ok) { showToast(`Failed to unlink: ${body.error || res.status}`); return; }
    if (!body.links.length) { showToast("These aren't linked to each other — nothing to remove."); return; }
    if (!confirm(`Remove ${body.links.length === 1 ? "this link" : `these ${body.links.length} links`}?\n\n${body.links.map(l => `• ${l}`).join("\n")}`)) return;
    const done = await post(true);
    const result = await done.json();
    items.forEach(it => invalidateNodeDetail(it.id));
    (result.touched || []).forEach(id => invalidateNodeDetail(id));
    render();
    showToast(done.ok
      ? `Removed: ${result.removed.join("; ")}`
      : `Removed ${result.removed?.length ?? 0}, then stopped at “${result.failed}”: ${result.error || done.status}`);
  } catch (err) {
    showToast(`Failed to unlink: ${err}`);
  }
}

async function linkParents(type, pairs, experiments) {
  try {
    const res = await fetch("/api/parent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, pairs, ...(experiments ? { experiments } : {}) }),
    });
    const body = await res.json();
    if (!res.ok) { showToast(`Couldn't set what it is part of: ${body.error || res.status}`); return; }
    const retry = (exps) => linkParents(type, pairs, exps);
    if (body.needsExperiment?.noShared) {
      const ns = body.needsExperiment.noShared;
      const strong = t => `<span style="color:var(--ink); font-weight:600;">${escapeHtml(t)}</span>`;
      const options = new Map(ns.flatMap(n => n.parentExperiments).map(e => [e.id, { id: e.id, type: "experiment", label: e.label }]));
      experimentChoice = {
        what: "part of", retry, placeOptions: [...options.values()],
        lone: ns.map(n => ({ id: n.id, label: n.label })),
        lonePrompt: ns.length === 1
          ? `${strong(ns[0].label)} and ${strong(ns[0].parentLabel)} aren't in the same experiment, and “part of” is set per experiment. Add ${strong(ns[0].label)} to one of ${strong(ns[0].parentLabel)}'s experiments first?`
          : `${ns.length} ${typeName("scientific_object", ns.length)} aren't in an experiment with their parent, and “part of” is set per experiment. Add them to one of their parent's experiments first?`,
      };
      renderActionbar();
      return;
    }
    if (body.needsExperiment) {
      const n = body.needsExperiment;
      experimentChoice = { what: "part of", lone: [], experiments: n.experiments, objects: n.objects, retry };
      renderActionbar();
      return;
    }
    experimentChoice = null;
    (body.touched || []).forEach(id => invalidateNodeDetail(id));
    pairs.forEach(p => { invalidateNodeDetail(p.child); invalidateNodeDetail(p.parent); });
    render();
    const skippedNote = body.skipped ? `; ${body.skipped} not in the picked experiment(s) — left as they were` : "";
    const w = body.written || [];
    showToast(w.length === 1
      ? `${labelOf(w[0].child)} is now part of ${labelOf(w[0].parent)} in ${andList(w[0].experiments)}${w[0].only ? " — the only experiment both are in" : ""}${skippedNote}`
      : `Set what ${w.length} ${typeName("scientific_object", w.length)} are part of: ${w.map(x => `${labelOf(x.child)} in ${labelOf(x.parent)} (${andList(x.experiments)})`).join("; ")}${skippedNote}`);
  } catch (err) {
    showToast(`Couldn't set what it is part of: ${err}`);
  }
}

// Which types could be linked TO the current selection as a real existing resource — same
// intersection rule creatableTypesFor already uses for "+ New" (a candidate type must be
// adjacent to EVERY selected item), further restricted to LINKABLE_TYPES on both sides (the
// candidate AND every already-selected type), and excluding any type already present in the
// selection — EXCEPT when everything selected is one parent/child type (RANKED_TYPES): then
// more of that type can be gathered, and "Link selection" settles direction in the ranking list.
// Types whose same-type links are parent/child, settled in the ranking modal (never guessed).
const RANKED_TYPES = new Set(["organization", "scientific_object"]);
function linkableExistingTypes() {
  const selectedTypes = [...selection.values()].map(v => v.type);
  if (!selectedTypes.length || !selectedTypes.every(t => LINKABLE_TYPES.has(t))) return new Set();
  // Same-type candidates too when everything selected is one parent/child type — so more can be
  // gathered before "Link selection" opens the ranking list.
  const oneRanked = new Set(selectedTypes).size === 1 && RANKED_TYPES.has(selectedTypes[0]);
  const candidates = creatableTypesFor(selectedTypes);
  return new Set([...candidates].filter(t => LINKABLE_TYPES.has(t) && (oneRanked || !selectedTypes.includes(t))));
}

// ---------------- link-ranking modal ----------------
// Resolves organization<->organization direction by drag-and-drop instead of guessing: the
// anchor sits fixed in the middle, candidates start in the Children zone, and can be dragged
// above the anchor (Parents) or left below (Children). Selecting several rows first (same
// click/ctrl/shift rules as every other list) and dragging one of them moves the whole group.
let linkRanking = null; // { anchor, parents: Map(id->item), children: Map(id->item), selectedIds: Set, shiftAnchorId }

function enterLinkRanking(anchor, items) {
  linkRanking = { anchor, parents: new Map(), children: new Map(items.map(it => [it.id, it])), selectedIds: new Set(), shiftAnchorId: null };
  renderLinkRankingModal();
}

function exitLinkRanking() {
  linkRanking = null;
  renderLinkRankingModal();
}

function renderLinkRankingModal() {
  const overlay = document.getElementById("linkRankingOverlay");
  if (!overlay) return;
  if (!linkRanking) {
    overlay.innerHTML = "";
    overlay.classList.remove("open");
    return;
  }
  overlay.classList.add("open");
  const { anchor, parents, children, selectedIds } = linkRanking;
  const allIds = [...parents.keys(), ...children.keys()];
  // Objects have one parent ("part of", inside an experiment); organizations can have several.
  const oneParent = anchor.type === "scientific_object";

  const zoneHtml = (map, zoneKey, label) => {
    const items = [...map.values()];
    return `<div class="ranking-zone" data-zone="${zoneKey}">
      <div class="ranking-zone-label">${label} (${items.length})</div>
      ${items.map(it => `
        <div class="ranking-row${selectedIds.has(it.id) ? " selected" : ""}" draggable="true" data-id="${escapeHtml(it.id)}" style="${typeStyle(it.type)}">
          <span class="swatch"></span>${escapeHtml(it.label)}
          <button class="make-anchor" data-anchor="${escapeHtml(it.id)}" title="Make this the anchor">make anchor</button>
        </div>
      `).join("") || `<div class="ranking-empty">Drop here</div>`}
    </div>`;
  };

  overlay.innerHTML = `
    <div class="ranking-backdrop" id="rankingBackdrop"></div>
    <div class="ranking-modal">
      <div class="ranking-header">
        <span>What is ${escapeHtml(anchor.label)} part of, and what is part of it?</span>
        <button class="ranking-close" id="rankingClose" title="Cancel">&times;</button>
      </div>
      <p class="ranking-hint">Drag a row <b>above</b> the line if ${escapeHtml(anchor.label)} is part of it (its parent), or leave/drop it <b>below</b> if it is part of ${escapeHtml(anchor.label)}.${oneParent ? " A scientific object has one parent at most: dropping another above swaps it out. It is set within an experiment both are in." : ""} Any row can be the anchor: drag it onto the middle, or use “make anchor”. Click, ctrl-click, or shift-click to select several first and drag them together.</p>
      ${zoneHtml(parents, "parents", `${escapeHtml(anchor.label)} is part of`)}
      <div class="ranking-anchor" data-zone="anchor"><span class="swatch"></span>${escapeHtml(anchor.label)}<span class="ranking-anchor-tag">anchor</span></div>
      ${zoneHtml(children, "children", `Part of ${escapeHtml(anchor.label)}`)}
      <div class="ranking-footer">
        <button class="btn ghost" id="rankingCancel">Cancel</button>
        <button class="btn primary" id="rankingConfirm">Confirm ${allIds.length} relation${allIds.length === 1 ? "" : "s"}</button>
      </div>
    </div>
  `;

  overlay.querySelectorAll(".ranking-row").forEach((row) => {
    const id = row.dataset.id;
    row.addEventListener("click", (e) => {
      // Same click/ctrl/shift rules as the main rowlist and the link picker: plain click
      // replaces, ctrl toggles one in/out, shift range-selects (also replacing).
      if (e.shiftKey && linkRanking.shiftAnchorId && allIds.includes(linkRanking.shiftAnchorId)) {
        const lo = Math.min(allIds.indexOf(linkRanking.shiftAnchorId), allIds.indexOf(id));
        const hi = Math.max(allIds.indexOf(linkRanking.shiftAnchorId), allIds.indexOf(id));
        linkRanking.selectedIds = new Set(allIds.slice(lo, hi + 1));
      } else if (e.ctrlKey || e.metaKey) {
        if (linkRanking.selectedIds.has(id)) linkRanking.selectedIds.delete(id);
        else linkRanking.selectedIds.add(id);
      } else {
        linkRanking.selectedIds = new Set([id]);
      }
      linkRanking.shiftAnchorId = id;
      renderLinkRankingModal();
    });
    row.addEventListener("dragstart", (e) => {
      // Dragging a row that's part of the current selection moves the whole group; dragging
      // an unselected row moves just that one (and becomes the new selection).
      const dragIds = linkRanking.selectedIds.has(id) ? [...linkRanking.selectedIds] : [id];
      linkRanking.selectedIds = new Set(dragIds);
      e.dataTransfer.setData("text/plain", JSON.stringify(dragIds));
      e.dataTransfer.effectAllowed = "move";
    });
  });

  // Flexible anchor: the chosen row becomes the anchor, the old anchor drops in as a child.
  const makeAnchor = (id) => {
    const item = linkRanking.parents.get(id) || linkRanking.children.get(id);
    if (!item) return;
    linkRanking.parents.delete(id);
    linkRanking.children.delete(id);
    linkRanking.children.set(linkRanking.anchor.id, linkRanking.anchor);
    linkRanking.anchor = item;
    linkRanking.selectedIds = new Set();
    renderLinkRankingModal();
  };
  overlay.querySelectorAll(".make-anchor").forEach((btn) => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); makeAnchor(btn.dataset.anchor); });
  });
  const anchorEl = overlay.querySelector(".ranking-anchor");
  anchorEl.addEventListener("dragover", (e) => { e.preventDefault(); anchorEl.classList.add("drag-over"); });
  anchorEl.addEventListener("dragleave", () => anchorEl.classList.remove("drag-over"));
  anchorEl.addEventListener("drop", (e) => {
    e.preventDefault();
    const ids = JSON.parse(e.dataTransfer.getData("text/plain") || "[]");
    if (ids.length) makeAnchor(ids[0]); // one anchor: the first of a dragged group
  });

  overlay.querySelectorAll(".ranking-zone").forEach((zone) => {
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      const ids = JSON.parse(e.dataTransfer.getData("text/plain") || "[]");
      const target = zone.dataset.zone === "parents" ? linkRanking.parents : linkRanking.children;
      const other = zone.dataset.zone === "parents" ? linkRanking.children : linkRanking.parents;
      ids.forEach((dragId) => {
        const item = linkRanking.parents.get(dragId) || linkRanking.children.get(dragId);
        if (!item) return;
        other.delete(dragId);
        target.set(dragId, item);
      });
      // One parent for objects: the last one dropped stays, any other goes back to children.
      if (linkRanking.anchor.type === "scientific_object" && linkRanking.parents.size > 1) {
        const keep = ids.filter(id => linkRanking.parents.has(id)).pop();
        [...linkRanking.parents.entries()].filter(([id]) => id !== keep).forEach(([id, it]) => { linkRanking.parents.delete(id); linkRanking.children.set(id, it); });
      }
      renderLinkRankingModal();
    });
  });

  document.getElementById("rankingClose").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingCancel").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingBackdrop").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingConfirm").addEventListener("click", confirmLinkRanking);
}

async function confirmLinkRanking() {
  const { anchor, parents, children } = linkRanking;
  const parentIds = [...parents.keys()];
  const childItems = [...children.values()];
  const total = parentIds.length + childItems.length;
  exitLinkRanking();
  if (!total) return;
  if (anchor.type === "scientific_object") {
    // "part of" lives inside an experiment — explicit pairs, the backend finds the shared one.
    const pairs = [...parentIds.map(p => ({ child: anchor.id, parent: p })), ...childItems.map(c => ({ child: c.id, parent: anchor.id }))];
    return linkParents(anchor.type, pairs);
  }
  try {
    if (parentIds.length) {
      // Every dragged-to-Parents org goes into ONE PUT on the anchor (batched, same as
      // /api/link already does for same-field items — not one call per parent).
      const res = await fetch("/api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "organization", id: anchor.id, link: { field: "parents", uris: parentIds } }),
      });
      if (!res.ok) { const b = await res.json().catch(() => ({})); showToast(`Failed to link: ${b.error || res.status}`); return; }
      invalidateNodeDetail(anchor.id);
      parentIds.forEach((id) => invalidateNodeDetail(id));
    }
    // Each dragged-to-Children org owns its OWN "parents" field — can't batch across
    // different owners into one PUT, so this is one call per child.
    for (const child of childItems) {
      const res = await fetch("/api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "organization", id: child.id, link: { field: "parents", uris: [anchor.id] } }),
      });
      if (!res.ok) { const b = await res.json().catch(() => ({})); showToast(`Failed to link: ${b.error || res.status}`); return; }
      invalidateNodeDetail(child.id);
    }
    invalidateNodeDetail(anchor.id);
    render();
    showToast(`Ranked ${total} ${typeName("organization", total)} relative to ${anchor.label}`);
  } catch (err) {
    showToast(`Failed to link: ${err}`);
  }
}

// Real candidates for "Link existing…", grouped by type — every item in CATEGORY_ITEMS for
// each linkable candidate type, minus whatever's already selected. Grouped (not flat) so the
// popover can browse type-by-type instead of dumping everything into one long list.
function linkPickerCandidatesByType() {
  if (linkPickerMode) return new Map([[linkPickerMode.type, (linkPickerMode.items || CATEGORY_ITEMS[CATEGORY_FOR_TYPE[linkPickerMode.type]] || []).filter(it => !linkPickerMode.exclude?.has(it.id))]]);
  const selectedIds = new Set(selection.keys());
  // When there's exactly one selected node and its detail is cached, also drop anything already
  // related to it — otherwise "Link existing…" happily re-offers an org's own parent/child/
  // facility, and confirming does nothing but claim success (the backend dedupes the relation
  // silently). Skipped for multi-item selections: "already linked to item A" shouldn't hide a
  // candidate that still needs linking to item B.
  const anchorIds = selection.size === 1 ? [...selection.keys()] : [];
  const alreadyRelated = new Set();
  anchorIds.forEach(id => {
    (NODE_DETAIL[id]?.relations ?? []).forEach(rel => rel.items.forEach(it => alreadyRelated.add(it.id)));
  });
  const byType = new Map();
  linkableExistingTypes().forEach(type => {
    const categoryId = CATEGORY_FOR_TYPE[type];
    const items = (CATEGORY_ITEMS[categoryId] || []).filter(item => !selectedIds.has(item.id) && !alreadyRelated.has(item.id));
    if (items.length) byType.set(type, items);
  });
  return byType;
}

// Renders the "Link existing…" popover body in place, without touching the rest of the action
// bar — called on open and on every pick/search/navigate inside it. Two levels: pick a type
// (like a tiny category list), then pick one or more real items of that type using the SAME
// click/ctrl/shift rules as the main rowlist's applyClick: plain click replaces the pick set
// with just that row, ctrl toggles one row in/out without touching the rest, shift range-
// selects between the last-picked row and this one (also replacing, not adding to, the prior
// pick) — scoped to the currently visible (filtered) list, same idea as the main rowlist's
// shift-range but local to this popover.
function renderLinkPicker() {
  const body = document.getElementById("linkPickerBody");
  const footer = document.getElementById("linkPickerFooter");
  if (!body || !footer) return;
  const byType = linkPickerCandidatesByType();
  body.innerHTML = "";

  if (!linkPickerType) {
    if (!byType.size) {
      body.innerHTML = `<span style="padding:8px; font-size:12.5px; color:var(--ink-faint);">Nothing linkable found.</span>`;
    } else {
      [...byType.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([type, items]) => {
        const btn = document.createElement("button");
        btn.className = "newmenu-item";
        btn.setAttribute("style", typeStyle(type));
        btn.innerHTML = `<span class="swatch"></span>${typeName(type)}<span class="newmenu-item-type">${items.length}</span>`;
        btn.addEventListener("click", () => { linkPickerType = type; renderLinkPicker(); });
        body.appendChild(btn);
      });
    }
  } else {
    // Locked to one type = no type list to go back to.
    if (!linkPickerMode) {
      const crumb = document.createElement("div");
      crumb.className = "linkmenu-crumb";
      crumb.innerHTML = `<button class="linkmenu-back">&lsaquo; Types</button><span>${typeName(linkPickerType)}</span>`;
      crumb.querySelector(".linkmenu-back").addEventListener("click", () => { linkPickerType = null; renderLinkPicker(); });
      body.appendChild(crumb);
    }

    const search = document.createElement("input");
    search.className = "linkmenu-search";
    search.type = "text";
    search.placeholder = `Search ${typeName(linkPickerType)}…`;
    search.addEventListener("click", (e) => e.stopPropagation());
    body.appendChild(search);

    const listEl = document.createElement("div");
    listEl.className = "linkmenu-items";
    body.appendChild(listEl);

    const items = byType.get(linkPickerType) || [];
    const paintRows = (filterText) => {
      const q = filterText.trim().toLowerCase();
      const visible = q ? items.filter((it) => it.label.toLowerCase().includes(q)) : items;
      const visibleIds = visible.map((it) => it.id);
      listEl.innerHTML = "";
      if (!visible.length) {
        listEl.innerHTML = `<span style="padding:8px; font-size:12.5px; color:var(--ink-faint);">No matches.</span>`;
        return;
      }
      // Same click/ctrl/shift rules as every other list; picks only join the selection.
      visible.slice(0, 200).forEach((it) => {
        const row = document.createElement("button");
        row.className = "newmenu-item" + (linkPickerPicked.has(it.id) ? " selected" : "");
        row.setAttribute("style", typeStyle(it.type));
        row.innerHTML = `<span class="swatch"></span>${escapeHtml(it.label)}`;
        row.addEventListener("click", (e) => {
          // Same click/ctrl/shift rules as the main rowlist's applyClick: plain click REPLACES
          // the pick set with just this one, ctrl toggles it in/out without touching the rest,
          // shift range-selects between the last-picked anchor and this row (also replacing,
          // not adding to, whatever was picked before — matching the main list's shift branch).
          if (e.shiftKey && linkPickerShiftAnchor && visibleIds.includes(linkPickerShiftAnchor)) {
            const lo = Math.min(visibleIds.indexOf(linkPickerShiftAnchor), visibleIds.indexOf(it.id));
            const hi = Math.max(visibleIds.indexOf(linkPickerShiftAnchor), visibleIds.indexOf(it.id));
            linkPickerPicked = new Map();
            visibleIds.slice(lo, hi + 1).forEach((id) => {
              const found = visible.find((x) => x.id === id);
              if (found) linkPickerPicked.set(id, found);
            });
          } else if (e.ctrlKey || e.metaKey) {
            if (linkPickerPicked.has(it.id)) linkPickerPicked.delete(it.id);
            else linkPickerPicked.set(it.id, it);
          } else {
            linkPickerPicked = new Map([[it.id, it]]);
          }
          linkPickerShiftAnchor = it.id;
          paintRows(search.value);
          renderLinkPickerFooter();
        });
        listEl.appendChild(row);
      });
    };
    paintRows("");
    search.addEventListener("input", () => paintRows(search.value));
  }

  renderLinkPickerFooter();
}

function renderLinkPickerFooter() {
  const footer = document.getElementById("linkPickerFooter");
  if (!footer) return;
  footer.innerHTML = "";
  if (!linkPickerPicked.size) return;
  const btn = document.createElement("button");
  btn.className = "btn primary linkmenu-confirm";
  btn.textContent = linkPickerMode ? linkPickerMode.confirmLabel(linkPickerPicked.size) : `Add ${linkPickerPicked.size} to selection`;
  btn.addEventListener("click", () => {
    if (linkPickerMode) {
      const { onConfirm } = linkPickerMode;
      const picked = [...linkPickerPicked.values()];
      document.getElementById("linkMenu")?.classList.remove("open");
      linkPickerMode = null;
      linkPickerType = null;
      linkPickerPicked = new Map();
      linkPickerShiftAnchor = null;
      onConfirm(picked);
      return;
    }
    // "Add to selection…" only SELECTS (selection-first design) — linking is always the
    // selection pane's "Link selection", which then decides link / rank / why-not.
    const picked = [...linkPickerPicked.values()];
    document.getElementById("linkMenu")?.classList.remove("open");
    linkPickerType = null;
    linkPickerPicked = new Map();
    linkPickerShiftAnchor = null;
    picked.forEach((it) => selection.set(it.id, it));
    refreshLeftPane(); renderDetail(); renderActionbar();
  });
  footer.appendChild(btn);
}

// The picker popover's markup + open/close wiring, shared by "Link existing…" and the
// requiresLink standalone create. `onOpen` runs on each open, after the pick state is reset.
function linkMenuHtml(buttonHtml, title) {
  return `
    <div class="newmenu" id="linkMenu">
      ${buttonHtml}
      <div class="newmenu-list linkmenu-list" id="linkList">
        <div class="linkmenu-top">
          <span class="linkmenu-title">${title}</span>
          <button class="linkmenu-x" id="linkMenuClose" title="Close">&times;</button>
        </div>
        <div id="linkPickerBody"></div>
        <div class="linkmenu-footer" id="linkPickerFooter"></div>
      </div>
    </div>`;
}
function wireLinkMenu(buttonId, onOpen) {
  const linkMenu = document.getElementById("linkMenu");
  document.getElementById(buttonId).addEventListener("click", async (e) => {
    e.stopPropagation();
    linkMenu.classList.toggle("open");
    if (linkMenu.classList.contains("open")) {
      // Fresh picking session each time the popover opens.
      linkPickerMode = null;
      linkPickerType = null;
      linkPickerPicked = new Map();
      linkPickerShiftAnchor = null;
      await onOpen();
      if (linkMenu.classList.contains("open")) renderLinkPicker();
    }
  });
  // Without this, clicking anywhere inside the popover (search box, a row, the footer
  // button) would bubble to the document-level "close on next click" listener below and
  // collapse it before the click's own handler (pick/confirm) gets to run.
  document.getElementById("linkList").addEventListener("click", (e) => e.stopPropagation());
  document.getElementById("linkMenuClose").addEventListener("click", () => linkMenu.classList.remove("open"));
  document.addEventListener("click", () => linkMenu.classList.remove("open"), { once: true });
}

function renderActionbar() {
  const bar = els.actionbar;
  // The popover is rebuilt below, so a mode left over from one closed with × must not leak
  // into linkPickerCandidatesByType's normal "Link existing…" answer.
  linkPickerMode = null;
  if (experimentChoice) {
    const x = experimentChoice;
    const strong = t => `<span style="color:var(--ink); font-weight:600;">${escapeHtml(t)}</span>`;
    const lone = x.lone.length;
    const What = x.what === "germplasm" ? "Germplasm" : `“${x.what[0].toUpperCase()}${x.what.slice(1)}”`;
    bar.className = "actionbar";
    bar.innerHTML = `
      <div class="selection-summary"><span>${lone
        ? (x.lonePrompt || `${x.lone.map(o => strong(o.label)).join(", ")} ${lone === 1 ? "isn't" : "aren't"} in any experiment yet, and ${x.what} is set per experiment. Add ${lone === 1 ? "it" : "them"} to one first?`)
        : `${What} is kept per experiment, and ${x.objects === 1 ? "this one is" : "these are"} in several. Set it in which experiment(s)?`}</span></div>
      ${linkMenuHtml(`<button class="btn primary" id="expChoiceBtn">${lone ? "Add to experiment…" : "Choose…"}</button>`, lone ? "Add to which experiment(s)?" : "Which experiment(s)?")}
      <button class="btn ghost" id="expChoiceCancelBtn">Cancel</button>
    `;
    wireLinkMenu("expChoiceBtn", () => {
      linkPickerType = "experiment";
      linkPickerMode = lone
        ? {
            type: "experiment",
            ...(x.placeOptions ? { items: x.placeOptions } : {}),
            confirmLabel: (n) => `Add to ${n} experiment${n === 1 ? "" : "s"}`,
            onConfirm: async (picked) => {
              // Put the objects in the picked experiment(s) — a plain link — then retry the original.
              await linkItems([...x.lone.map(o => ({ type: "scientific_object", id: o.id })), ...picked.map(p => ({ type: "experiment", id: p.id }))]);
              carryOverOffer = null; // not the point here; their labels can be set after
              x.retry();
            },
          }
        : {
            type: "experiment",
            items: x.experiments.map(e => ({ id: e.id, type: "experiment", label: `${e.label} · ${e.objects} ${typeName("scientific_object", e.objects)}` })),
            confirmLabel: (n) => `Set in ${n} experiment${n === 1 ? "" : "s"}`,
            onConfirm: (picked) => x.retry(picked.map(p => p.id)),
          };
    });
    document.getElementById("expChoiceCancelBtn").addEventListener("click", () => { experimentChoice = null; renderActionbar(); });
    document.getElementById("expChoiceBtn").click(); // open straight away, nothing picked
    return;
  }
  if (carryOverOffer) {
    const c = carryOverOffer.items;
    const names = list => { const u = [...new Set(list)]; return u.length <= 2 ? u.join(" and ") : `${u.length}`; };
    const objs = names(c.map(x => x.label)), exps = names(c.map(x => x.experimentLabel));
    const strong = t => `<span style="color:var(--ink); font-weight:600;">${escapeHtml(t)}</span>`;
    const kids = c.every(x => x.parent), mixed = !kids && c.some(x => x.parent);
    const nKids = new Set(c.map(x => x.id)).size;
    bar.className = "actionbar";
    bar.innerHTML = `
      <div class="selection-summary"><span>${kids
        ? `${strong(names(c.map(x => x.from)))} ${new Set(c.map(x => x.parent)).size === 1 ? "has" : "have"} ${nKids} ${typeName("scientific_object", nKids)} that ${nKids === 1 ? "is" : "are"} part of it in ${strong(exps)}, without this germplasm. Also set it on ${nKids === 1 ? "it" : "them"}?`
        : mixed
        ? "Some scientific objects are missing germplasm they have in other experiments, or that their parent now has. Set any of it?"
        : `${strong(exps)} now ${new Set(c.map(x => x.experimentLabel)).size === 1 ? "has" : "have"} ${strong(objs)}${objs.match(/^\d+$/) ? ` ${typeName("scientific_object", 2)}` : ""}, without ${new Set(c.map(x => x.id)).size === 1 ? "its" : "their"} germplasm from other experiments. Copy any over?`}</span></div>
      ${linkMenuHtml(`<button class="btn primary" id="carryOverBtn">Choose…</button>`, kids ? "Also set on what is part of it" : "Copy over to the new experiment")}
      <button class="btn ghost" id="carryOverSkipBtn">Skip</button>
    `;
    wireLinkMenu("carryOverBtn", () => {
      linkPickerType = kids ? "object" : "carry-over";
      linkPickerMode = {
        type: linkPickerType,
        items: c.map(x => ({ ...x, type: x.valueType, id: `${x.id}|${x.experiment}|${x.field}|${x.value}`, label: x.parent ? `${x.valueLabel} → ${x.label}` : `${x.valueLabel} → ${x.label} (from ${x.from})` })),
        confirmLabel: (n) => kids ? `Set on ${n}` : `Carry over ${n}`,
        onConfirm: (picked) => applyCarryOver(picked),
      };
    });
    document.getElementById("carryOverSkipBtn").addEventListener("click", () => { carryOverOffer = null; renderActionbar(); });
    document.getElementById("carryOverBtn").click(); // open straight away, nothing picked
    return;
  }
  if (selection.size === 0) {
    // Nothing selected doesn't mean nothing can be created — browsing straight to a category
    // page (e.g. Organizations) with no selection still offers a standalone "+ New <type>" for
    // any type creation is wired for at all (CREATABLE). Clusters have to start somewhere;
    // linking happens once there's something real to link to, not necessarily at birth.
    const p = currentPane();
    const standaloneType = p.type === "category" ? TYPE_FOR_CATEGORY[p.id] : null;
    if (standaloneType && CREATABLE[standaloneType]) {
      bar.className = "actionbar";
      const niceType = typeName(standaloneType);
      const required = CREATABLE[standaloneType].requiresLink;
      if (required) {
        // Can't exist alone (e.g. a site needs an organization) — pick the anchor(s) first,
        // with the same picker/click rules as "Link existing…", then create linked to all.
        const niceReq = typeName(required);
        bar.innerHTML = `
          <div class="selection-summary" style="color:var(--ink-faint);">Nothing selected</div>
          ${linkMenuHtml(`<button class="btn primary" id="newStandaloneBtn">+ New ${niceType}…</button>`, `New ${niceType} in which ${niceReq}(s)?`)}
        `;
        wireLinkMenu("newStandaloneBtn", () => {
          linkPickerType = required;
          linkPickerMode = {
            type: required,
            confirmLabel: (n) => `Create ${niceType} in ${n} ${typeName(required, n)}`,
            onConfirm: async (picked) => {
              const v = await askCreateValues(standaloneType);
              if (v) createNode(standaloneType, v.name, picked.map((p) => ({ type: p.type, id: p.id })), `in ${picked.map((p) => p.label).join(", ")}`, v.fields);
            },
          };
        });
        return;
      }
      bar.innerHTML = `
        <div class="selection-summary" style="color:var(--ink-faint);">Nothing selected</div>
        <button class="btn primary" id="newStandaloneBtn">+ New ${typeName(standaloneType)}</button>
      `;
      document.getElementById("newStandaloneBtn").addEventListener("click", async () => {
        const v = await askCreateValues(standaloneType);
        if (v) createNode(standaloneType, v.name, [], undefined, v.fields);
      });
      return;
    }
    bar.className = "actionbar idle";
    bar.innerHTML = `Open or select something to see what you can add to it.`;
    return;
  }
  bar.className = "actionbar";
  const names = [...selection.values()].map(v => escapeHtml(v.label)).join(", ");
  // See adjacency.js: intersection of every selected item's adjacency, not union — a single
  // new node gets linked to ALL of them at once, so its type must be valid for every one.
  const creatable = creatableTypesFor([...selection.values()].map(v => v.type));
  const plan = linkPlan();
  const canLink = plan.kind !== "none";
  const hasExistingCandidates = linkPickerCandidatesByType().size > 0;

  bar.innerHTML = `
    <div class="selection-summary sel-count-summary">
      Selected <b>${selection.size}</b>
      <span class="selection-names">${names}</span>
    </div>
    <button class="btn ghost" id="clearSel">Clear</button>
    ${plan.why ? `<div class="selection-summary link-why">${escapeHtml(plan.why)}</div>` : ""}
    ${canLink ? `<button class="btn primary" id="linkSelectionBtn">${escapeHtml(linkSelectionLabel())}</button>` : ""}
    ${canLink ? `<button class="btn ghost" id="unlinkSelectionBtn">Unlink selection</button>` : ""}
    ${hasExistingCandidates ? linkMenuHtml(`<button class="btn ghost" id="addToSelectionBtn">Add to selection…</button>`, "Add to selection") : ""}
    <div class="newmenu" id="newMenu">
      <button class="btn primary" id="newBtn">+ New</button>
      <div class="newmenu-list" id="newList"></div>
    </div>
    ${[...selection.values()].every(v => VISIBILITY_TYPES.has(v.type)) ? `
    <div class="newmenu" id="visMenu">
      <button class="btn ghost small" id="visBtn">Visibility…</button>
      <div class="newmenu-list">
        <button class="newmenu-item" data-public="true">Make public (every PHIS user can see it)</button>
        <button class="newmenu-item" data-public="false">Make private</button>
      </div>
    </div>` : ""}
  `;
  const visMenu = document.getElementById("visMenu");
  if (visMenu) {
    document.getElementById("visBtn").addEventListener("click", (e) => { e.stopPropagation(); visMenu.classList.toggle("open"); });
    visMenu.querySelectorAll("[data-public]").forEach(b => b.addEventListener("click", () => {
      visMenu.classList.remove("open");
      setVisibility([...selection.values()], b.dataset.public === "true");
    }));
    document.addEventListener("click", () => visMenu.classList.remove("open"), { once: true });
  }
  if (canLink) {
    document.getElementById("linkSelectionBtn").addEventListener("click", () => {
      const items = [...selection.values()];
      // Parent/child: the first selected starts as the anchor, the rest as its children.
      if (plan.kind === "rank") enterLinkRanking(items[0], items.slice(1));
      else linkItems(items.map(v => ({ type: v.type, id: v.id })));
    });
    document.getElementById("unlinkSelectionBtn").addEventListener("click", () => unlinkSelection([...selection.values()]));
  }
  if (hasExistingCandidates) {
    // linkPickerCandidatesByType only filters out already-related items when the anchor's
    // relations are cached — usually true if the node was opened first, but a plain click-
    // to-select never loads NODE_DETAIL. Fetch it (if needed) BEFORE the one render,
    // rather than rendering then re-rendering after — a second render mid-interaction would
    // reset which rows exist out from under a pick already in progress.
    wireLinkMenu("addToSelectionBtn", async () => {
      const anchor = selection.size === 1 ? [...selection.values()][0] : null;
      if (anchor && !(anchor.id in NODE_DETAIL)) await loadNodeDetail(anchor);
    });
  }
  document.getElementById("clearSel").addEventListener("click", () => {
    selection = new Map(); anchorId = null; refreshLeftPane(); renderDetail(); renderActionbar();
  });
  const menu = document.getElementById("newMenu");
  const list = document.getElementById("newList");
  [...creatable].sort().forEach(t => {
    const item = document.createElement("button");
    item.className = "newmenu-item";
    item.setAttribute("style", typeStyle(t));
    // CREATABLE (from creation.js) only has entries for types with a real backend wired up so
    // far, and a wired type may still not take a link to every selected type (e.g. a scientific
    // object from another one) — /api/create would refuse it. Those stay listed (so the menu
    // shows what belongs here) but greyed, saying where to do it instead.
    // A link the new node's own DTO can't hold is linked right after, like "Link selection";
    // that works for any distinct pair of LINKABLE_TYPES (checked against the backend by a test).
    const canLink = (v) => CREATABLE[t].linkFields[v.type] || (v.type !== t && LINKABLE_TYPES.has(t) && LINKABLE_TYPES.has(v.type) && !inExperimentOnly(t, v.type));
    const can = t in CREATABLE && [...selection.values()].every(canLink);
    item.innerHTML = `<span class="swatch"></span>${typeName(t)}${can ? "" : `<span class="newmenu-item-type">in PHIS for now</span>`}`;
    if (!can) { item.disabled = true; item.title = `This app can't create a ${typeName(t)} here yet. Create it in PHIS, then link it here.`; }
    item.addEventListener("click", async () => {
      menu.classList.remove("open");
      const v = await askCreateValues(t);
      if (!v) return;
      const links = [...selection.values()].map(s => ({ type: s.type, id: s.id }));
      createNode(t, v.name, links, `linked to ${[...selection.values()].map(s => s.label).join(", ")}`, v.fields); // toast = plain text, not the escaped `names`
    });
    list.appendChild(item);
  });
  if (!creatable.size) {
    const msg = selection.size > 1
      ? "Nothing can be linked to all of these at once."
      : "Nothing creatable from this selection yet.";
    list.innerHTML = `<span style="padding:8px; font-size:12.5px; color:var(--ink-faint);">${msg}</span>`;
  }
  document.getElementById("newBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });
  document.addEventListener("click", () => menu.classList.remove("open"), { once: true });
}

function render() {
  renderCrumbs();
  refreshLeftPane();
  renderDetail();
  renderActionbar();
}

/* ---------------- tree mode: a forest built from `selection` ---------------- */

// Everything that shows the selection: the list (browse), the selection pane (what's gathered)
// and the tree along the bottom (how it connects) — all always visible, no switching.
function refreshLeftPane() {
  renderRows();
  renderSelectionList();
  renderTree();
}

function renderSelectionList() {
  els.selCount.textContent = selection.size ? `${selection.size} item${selection.size === 1 ? "" : "s"}` : "";
  els.selList.innerHTML = "";
  if (!selection.size) {
    els.selList.innerHTML = `<div class="empty-hint">Nothing selected yet. Click a row to select it; ctrl-click to add more.</div>`;
    return;
  }
  [...selection.values()].forEach(item => {
    const div = document.createElement("div");
    div.className = "sel-item";
    div.setAttribute("style", typeStyle(item.type));
    div.innerHTML = `<span class="row-dot"></span><span class="sel-label" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</span>
      <button class="sel-open" title="Open" aria-label="Open ${escapeHtml(item.label)}">›</button>
      <button class="sel-remove" title="Remove from selection" aria-label="Remove ${escapeHtml(item.label)} from selection">&times;</button>`;
    div.querySelector(".sel-open").addEventListener("click", () => item.type === "category" ? navigateTo([...path, item]) : openRelatedNode(item));
    div.querySelector(".sel-remove").addEventListener("click", () => {
      selection.delete(item.id);
      refreshLeftPane(); renderDetail(); renderActionbar();
    });
    els.selList.appendChild(div);
  });
}

let treeOrder = [];
function renderTree() {
  els.treeArea.innerHTML = "";
  treeOrder = [];
  if (selection.size === 0) {
    els.treeArea.innerHTML = `<div class="empty-hint">Select something to see how it connects.</div>`;
    return;
  }
  const roots = [...selection.values()];
  roots.forEach((item, i) => renderTreeRow(item, 0, els.treeArea, [], i === roots.length - 1));
}

/* Real connector lines (like a file tree), not just indentation + color —
   railFlags[i] says whether the vertical line at ancestor-column i must
   keep running past this row (that ancestor still has more children
   coming below) or stop (it was the last one). isLastSibling controls
   whether THIS row's own elbow closes off after its horizontal stub. */
function buildIndentHTML(railFlags, depth, isLastSibling) {
  if (depth === 0) return "";
  let html = '<span class="tree-indent">';
  for (let i = 0; i < depth - 1; i++) {
    html += `<span class="tree-rail">${railFlags[i] ? '<span class="rail-full"></span>' : ""}</span>`;
  }
  html += `<span class="tree-rail"><span class="rail-top"></span>${!isLastSibling ? '<span class="rail-bottom"></span>' : ""}<span class="rail-stub"></span></span>`;
  html += "</span>";
  return html;
}

function renderTreeRow(item, depth, container, railFlags, isLastSibling) {
  treeOrder.push(item.id);
  addressableItems.set(item.id, item);
  const node = NODE_DETAIL[item.id] || null;
  const hasChildren = !!(node && node.relations && node.relations.length);
  const isExpanded = expandedIds.has(item.id);

  const row = document.createElement("div");
  row.className = "row" + (selection.has(item.id) ? " selected" : "");
  row.setAttribute("style", typeStyle(item.type));
  row.dataset.id = item.id;

  row.innerHTML = `
    ${buildIndentHTML(railFlags, depth, isLastSibling)}
    <button class="row-nav" style="opacity:1; position:static; width:18px; height:18px; visibility:${hasChildren ? "visible" : "hidden"};" title="${isExpanded ? "Collapse" : "Expand"}">${isExpanded ? "▾" : "▸"}</button>
    <span class="row-dot"></span>
    <span class="row-main${item.type === "category" ? " stacked" : ""}">
      <span class="row-label">${escapeHtml(item.label)}</span>
      <span class="row-type">${item.type === "category" ? escapeHtml(item.hint ?? "") : typeName(item.type)}</span>
    </span>
    <button class="row-nav" title="Open" aria-label="Open ${escapeHtml(item.label)}">›</button>
  `;
  const [caretBtn, openBtn] = row.querySelectorAll(".row-nav");
  if (hasChildren) {
    caretBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isExpanded) expandedIds.delete(item.id); else expandedIds.add(item.id);
      renderTree();
    });
  }
  // The › arrow opens a LOCAL breadcrumb in the detail pane (detailPath) instead of a real
  // navigation — the list and the tree stay where they are.
  openBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    detailPath = [item];
    renderDetail();
    loadNodeDetail(item); // renderDetail alone never fetches: relations would read "No connections found"
  });

  container.appendChild(row);

  if (hasChildren && isExpanded) {
    // This row's own elbow column becomes an ancestor rail for its
    // children: it keeps drawing a continuous line past them only if this
    // row itself has more siblings coming after it.
    const childRailFlags = [...railFlags, !isLastSibling];
    const flatChildren = node.relations.flatMap(rel => rel.items.map(child => ({ child, rel })));

    node.relations.forEach((rel, ri) => {
      const label = document.createElement("div");
      label.className = "rel-label";
      label.style.cssText = `padding-left:${12 + (depth + 1) * 20}px; margin:4px 0 2px;`;
      label.textContent = rel.label;
      container.appendChild(label);
      rel.items.forEach((child, ci) => {
        const isLastOverall = ri === node.relations.length - 1 && ci === rel.items.length - 1;
        renderTreeRow(child, depth + 1, container, childRailFlags, isLastOverall);
      });
    });
  }
}

// "A", "A and B", "A, B and C" — for messages that name what was done.
function andList(labels) {
  const u = [...new Set(labels)];
  return u.length <= 1 ? (u[0] ?? "") : `${u.slice(0, -1).join(", ")} and ${u[u.length - 1]}`;
}
const labelOf = id => findItemById(id)?.label ?? id;

function findItemById(id) {
  return Object.values(CATEGORY_ITEMS).flat().concat(ROOT).find(i => i.id === id) || null;
}

/* ---------------- click + drag / marquee select ----------------
   Everything funnels through one mousedown -> mouseup pipeline instead of
   splitting "click" and "drag" across two separate listener systems that
   could race each other — the same pattern validated for real in the
   Phase 0 spike. A stationary mousedown/mouseup pair (moved <= 4px) is a
   click, resolved against whatever row the mousedown started on; anything
   past that threshold is a marquee drag. Drag can start anywhere on the
   page, not just over the row list. Native text-selection is killed at
   mousedown time so a fast drag never races the browser's own selection
   gesture into a second, unrelated highlight box. */
(function setupSelection() {
  let tracking = false, startX = 0, startY = 0, mod = "plain", box = null;
  let downItem = null;   // the row (item + type) the mousedown actually started on, if any
  let downInTree = false; // …and whether it was in the tree (shift ranges stay within one area)

  function removeBox() { if (box) { box.remove(); box = null; } }
  function modFromEvent(e) {
    return e.shiftKey ? "shift" : (e.ctrlKey || e.metaKey) ? "ctrl" : "plain";
  }

  document.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    // Anything interactive must be skipped: the preventDefault below also swallows the native
    // behaviour of whatever was pressed (a <select> never opens). A modal <dialog> is skipped
    // wholesale — nothing inside a form should start a marquee.
    if (e.target.closest(".row-nav, .crumb, .chip, .newmenu, .ranking-overlay, dialog, input, select, textarea, button")) return;
    e.preventDefault();
    document.body.style.userSelect = "none";

    tracking = true; startX = e.clientX; startY = e.clientY; mod = modFromEvent(e);
    const rowEl = e.target.closest(".row");
    downItem = rowEl ? (addressableItems.get(rowEl.dataset.id) || null) : null;
    downInTree = !!rowEl?.closest("#treeArea");

    removeBox();
    box = document.createElement("div");
    box.style.cssText = "position:fixed; left:0; top:0; width:0; height:0; border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); pointer-events:none; z-index:50;";
    document.body.appendChild(box);
  });

  window.addEventListener("mousemove", (e) => {
    if (!tracking || !box) return;
    const x = Math.min(startX, e.clientX), y = Math.min(startY, e.clientY);
    const w = Math.abs(e.clientX - startX), h = Math.abs(e.clientY - startY);
    box.style.left = x + "px"; box.style.top = y + "px"; box.style.width = w + "px"; box.style.height = h + "px";
  });

  window.addEventListener("mouseup", (e) => {
    if (!tracking) return;
    tracking = false;
    document.body.style.userSelect = "";
    const moved = Math.hypot(e.clientX - startX, e.clientY - startY) > 4;

    if (!moved) {
      // Categories ARE selectable — the user can choose to, say, select
      // "Organizations" and bind a variable to every org in it. Whether
      // that fans out into N relations is a creation-panel concern, not a
      // reason to block selection here.
      if (downItem) applyClick(downItem, mod, downInTree ? treeOrder : rowOrder);
    } else if (box) {
      const bx = box.getBoundingClientRect();
      const hit = [];
      document.querySelectorAll(".row").forEach(row => {
        const r = row.getBoundingClientRect();
        if (r.right > bx.left && r.left < bx.right && r.bottom > bx.top && r.top < bx.bottom) {
          hit.push(row.dataset.id);
        }
      });
      if (hit.length) {
        if (mod !== "ctrl") selection = new Map();
        hit.forEach(id => {
          const found = addressableItems.get(id);
          if (found) expandForSelection(found).forEach(m => selection.set(m.id, m));
        });
        anchorId = hit[hit.length - 1];
        refreshLeftPane(); renderDetail(); renderActionbar();
      }
    }
    removeBox();
    downItem = null;
  });
})();

// Types the backend's NODE_TYPES (server/src/node-types.ts) actually knows how to view/edit/
// link — NOT the same set as ADJACENT (which just says two types are conceptually related, not
// that either side has a real settable DTO field for the other). Kept in sync by hand, same
// pattern as CATEGORY_FOR_TYPE below; a server-side test asserts it doesn't drift from
// NODE_TYPES' keys that allow "link". Used by selectionHasLinkablePair to keep "Link selection" from
// appearing when nothing in it is guaranteed-resolvable — ADJACENT alone is too loose a proxy.
const LINKABLE_TYPES = new Set(["facility", "organization", "site", "experiment", "scientific_object", "project", "germplasm"]);
// Types with an is_public flag (NODE_TYPES' `visibility`) — same hand-kept pattern.
const VISIBILITY_TYPES = new Set(["experiment", "germplasm"]);
// Pairs that can only be linked INSIDE an experiment (NODE_TYPES[a].inExperiment.byType[b]) —
// "Link selection" handles them by asking which experiment, but "+ New" can't (a brand-new
// object isn't in any yet), so they're never offered there. Same drift check as LINKABLE_TYPES.
const IN_EXPERIMENT_PAIRS = new Set(["scientific_object:germplasm"]);
const inExperimentOnly = (a, b) => IN_EXPERIMENT_PAIRS.has(`${a}:${b}`) || IN_EXPERIMENT_PAIRS.has(`${b}:${a}`);

// Reverse of BACKED_CATEGORIES, keyed by node type instead of category id — lets a freshly
// created node (see the "+ New" handler above) get pushed into the same CATEGORY_ITEMS array
// the category browser reads, instead of only existing in `selection` until the next reload.
const CATEGORY_FOR_TYPE = {
  organization: "cat-organizations",
  experiment: "cat-experiments",
  project: "cat-projects",
  facility: "cat-facilities",
  device: "cat-devices",
  site: "cat-sites",
  person: "cat-persons",
  scientific_object: "cat-scientificobjects",
  variable: "cat-variables",
  germplasm: "cat-germplasm",
  data_file: "cat-datafiles",
  provenance: "cat-provenances",
  event: "cat-events",
  document: "cat-documents",
  factor: "cat-factors",
};

// The other direction — which type's instances live in a given leaf category — used to decide
// whether a standalone "+ New <type>" makes sense while browsing that category with nothing
// selected (see renderActionbar).
const TYPE_FOR_CATEGORY = Object.fromEntries(Object.entries(CATEGORY_FOR_TYPE).map(([type, catId]) => [catId, type]));

const BACKED_CATEGORIES = {
  "cat-organizations": "/api/organizations",
  "cat-experiments": "/api/experiments",
  "cat-projects": "/api/projects",
  "cat-facilities": "/api/facilities",
  "cat-devices": "/api/devices",
  "cat-sites": "/api/sites",
  "cat-persons": "/api/persons",
  "cat-scientificobjects": "/api/scientific-objects",
  "cat-variables": "/api/variables",
  "cat-germplasm": "/api/germplasm",
  "cat-datafiles": "/api/datafiles",
  "cat-provenances": "/api/provenances",
  "cat-events": "/api/events",
  "cat-documents": "/api/documents",
  "cat-factors": "/api/factors",
};

// Loads (or reloads, after an import) category lists from the backend.
function reloadCategories(ids = Object.keys(BACKED_CATEGORIES)) {
  return Promise.all(
    ids.map((categoryId) =>
      fetch(BACKED_CATEGORIES[categoryId])
        .then(r => r.json())
        .then(items => { CATEGORY_ITEMS[categoryId] = items; })
        .catch(err => console.error(`Failed to load ${categoryId} from backend:`, err))
    )
  ).finally(render);
}
reloadCategories();

/* ---------- instrument import (step 2: the plan; nothing is written yet) ----------
   The ZIP goes to /api/import/plan unchanged; the server's instrument plugins read it and answer
   what would be created or reused in PHIS. Shown in PHIS's words with a plain line under each. */
function openImport() {
  const overlay = document.getElementById("importOverlay");
  overlay.innerHTML = `
    <div class="ranking-backdrop" id="importBackdrop"></div>
    <div class="ranking-modal import-modal">
      <div class="ranking-header"><span>Import from an instrument</span><button class="ranking-close" id="importClose" title="Close">&times;</button></div>
      <p class="ranking-hint">Choose the ZIP your instrument produced (e.g. a TraitFinder export). You'll see what it would create in PHIS first — nothing is written until you confirm.</p>
      <input type="file" id="importFile" accept=".zip,application/zip">
      <div id="importPlan"></div>
    </div>`;
  overlay.classList.add("open");
  const close = () => { overlay.classList.remove("open"); overlay.innerHTML = ""; };
  document.getElementById("importBackdrop").addEventListener("click", close);
  document.getElementById("importClose").addEventListener("click", close);
  document.getElementById("importFile").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    const out = document.getElementById("importPlan");
    if (!f) { out.innerHTML = ""; return; }
    out.innerHTML = `<p class="ranking-hint">Reading ${escapeHtml(f.name)}…</p>`;
    try {
      const res = await fetch("/api/import/plan", { method: "POST", headers: { "Content-Type": "application/zip" }, body: f });
      const body = await res.json();
      out.innerHTML = res.ok ? importPlanHtml(body) : `<div class="import-warning">${escapeHtml(body.error || `Couldn't read the file (${res.status}).`)}</div>`;
      if (res.ok) wireImportRun(f, body, close);
    } catch (err) {
      out.innerHTML = `<div class="import-warning">Couldn't read the file: ${escapeHtml(String(err))}</div>`;
    }
  });
}
document.getElementById("importBtn").addEventListener("click", openImport);

function importPlanHtml(p) {
  const list = (names, max = 8) => escapeHtml(names.slice(0, max).join(", ") + (names.length > max ? `, … (${names.length} in all)` : ""));
  const g = p.germplasm;
  const newCount = g.missing.length;
  const sample = p.objects.sample[0];
  return `
    <p class="ranking-hint">Recognised as <b>${escapeHtml(p.instrument)}</b>.</p>
    ${p.warnings.map(w => `<div class="import-warning">${escapeHtml(w)}</div>`).join("")}
    <div class="import-section">
      <h3>Experiment<small>your trial</small></h3>
      <p>New: <b>${escapeHtml(p.experiment.name)}</b>, starting ${escapeHtml(p.experiment.startDate)}.</p>
      ${p.experiment.exists ? `<div class="import-warning">An experiment with this name already exists in PHIS.</div>` : ""}
    </div>
    <div class="import-section">
      <h3>Germplasm<small>plant material: species, varieties, lines</small></h3>
      ${g.existing.length ? `<p>Already in PHIS, reused: ${g.existing.length} <span class="import-names">(${list(g.existing.map(x => x.name))})</span></p>` : ""}
      ${newCount ? `<p>New: ${newCount} <span class="import-names">(${list(g.missing)})</span></p>
        <p><label>Species for the new germplasm: <select id="importSpecies"><option value="">Choose…</option>${p.speciesOptions.map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.label)}</option>`).join("")}</select></label></p>` : ""}
      ${g.ambiguous.map(a => `<div class="import-warning">"${escapeHtml(a.name)}" matches ${a.ids.length} germplasm in PHIS — it isn't clear which one is meant.</div>`).join("")}
    </div>
    <div class="import-section">
      <h3>Factors<small>treatments and design</small></h3>
      ${p.factors.length ? p.factors.map(f => `<p>${escapeHtml(f.name)}: ${f.levels.length} levels <span class="import-names">(${list(f.levels, 12)})</span></p>`).join("") : "<p>None.</p>"}
    </div>
    <div class="import-section">
      <h3>${escapeHtml(typeName("scientific_object", 2)[0].toUpperCase() + typeName("scientific_object", 2).slice(1))}<small>what you measure: plants, plots, pots, samples</small></h3>
      <p>New: ${p.objects.count}${sample ? ` <span class="import-names">(e.g. ${escapeHtml(sample.name)}: ${[sample.germplasm, ...Object.entries(sample.factors).map(([k, v]) => `${k} ${v}`)].filter(Boolean).map(escapeHtml).join(", ")})</span>` : ""}</p>
    </div>
    <div class="import-footer" id="importFooter">${importFooterHtml(p)}</div>`;
}

// What stops the import is said up front; otherwise the button says exactly what it will create.
function importFooterHtml(p) {
  const stops = [
    ...(p.experiment.exists ? ["an experiment with this name already exists"] : []),
    ...(p.germplasm.ambiguous.length ? ["some germplasm names match more than one in PHIS"] : []),
  ];
  if (stops.length) return `<span>Can't import this yet: ${escapeHtml(stops.join("; "))}. Nothing has been written to PHIS.</span>`;
  const parts = [
    "1 experiment",
    ...(p.germplasm.missing.length ? [`${p.germplasm.missing.length} germplasm`] : []),
    ...(p.factors.length ? [`${p.factors.length} ${p.factors.length === 1 ? "factor" : "factors"}`] : []),
    `${p.objects.count} ${typeName("scientific_object", p.objects.count)}`,
  ];
  return `<span>Nothing has been written to PHIS yet. What it creates will be public: every PHIS user can see it.</span><button class="btn primary" id="importRunBtn">Create ${escapeHtml(andList(parts))}</button>`;
}

function wireImportRun(file, plan, close) {
  const btn = document.getElementById("importRunBtn");
  if (!btn) return;
  const species = document.getElementById("importSpecies");
  const sync = () => { btn.disabled = !!species && !species.value; btn.title = btn.disabled ? "Choose the species for the new germplasm first" : ""; };
  species?.addEventListener("change", sync);
  sync();
  btn.addEventListener("click", async () => {
    const footer = document.getElementById("importFooter");
    if (species) species.disabled = true;
    // The server streams one line per write (NDJSON), so the bar shows real progress; closing the
    // dialog or the page doesn't stop the import on the server.
    footer.innerHTML = `<div class="import-progress"><span id="importStep">Starting…</span><progress id="importBar" max="1" value="0"></progress><span class="import-names">It keeps going on the server even if you close this.</span></div>`;
    try {
      const res = await fetch(`/api/import/run${species ? `?species=${encodeURIComponent(species.value)}` : ""}`, { method: "POST", headers: { "Content-Type": "application/zip" }, body: file });
      if (!res.ok) {
        const b = await res.json().catch(() => ({}));
        footer.innerHTML = `<div class="import-warning">${escapeHtml(b.error || `The import failed (${res.status}).`)}</div>`;
        return;
      }
      let body = null, failed = null, buf = "";
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        for (let i; (i = buf.indexOf("\n")) >= 0; buf = buf.slice(i + 1)) {
          const msg = JSON.parse(buf.slice(0, i));
          if (msg.progress) {
            const bar = document.getElementById("importBar");
            if (bar) { bar.max = msg.progress.total; bar.value = msg.progress.done; }
            const step = document.getElementById("importStep");
            if (step) step.textContent = `${msg.progress.step} (${Math.round(100 * msg.progress.done / msg.progress.total)}%)`;
          } else if (msg.result) body = msg.result;
          else if (msg.error) failed = msg.error;
        }
      }
      if (failed || !body) { footer.innerHTML = `<div class="import-warning">${escapeHtml(failed || "The import ended without an answer.")}</div>`; return; }
      await reloadCategories(["cat-experiments", "cat-germplasm", "cat-scientificobjects", "cat-factors"]);
      const c = body.created;
      footer.innerHTML = `<span>Created <b>${escapeHtml(body.experiment.label)}</b> with ${c.objects} ${typeName("scientific_object", c.objects)}, ${c.factors} ${c.factors === 1 ? "factor" : "factors"} and ${c.germplasm} new germplasm.</span><button class="btn primary" id="importOpenBtn">Open the experiment</button>`;
      document.getElementById("importOpenBtn").addEventListener("click", () => { close(); openRelatedNode(body.experiment); });
    } catch (err) {
      footer.innerHTML = `<div class="import-warning">The import failed: ${escapeHtml(String(err))}</div>`;
    }
  });
}
</script>
