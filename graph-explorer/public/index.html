<title>Graph Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #ffffff;
  --surface: #f7f9f1;
  --surface-2: #eef2e0;
  --ink: #1c2a1f;
  --ink-muted: #5d6b5b;
  --ink-faint: #8b9788;
  --border: #dfe6d3;
  --border-strong: #c7d1b8;
  --accent: #3d8526;
  --accent-ink: #ffffff;
  --accent-soft: #e6efdc;

  --type-org: #386fa4;
  --type-org-soft: #e4edf5;
  --type-research: #b0701f;
  --type-research-soft: #f6ecdb;
  --type-data: #6c4fa1;
  --type-data-soft: #ece6f5;
  --type-bio: #23896b;
  --type-bio-soft: #dfefe9;
  --type-device: #a14646;
  --type-device-soft: #f3e2e2;

  --warn: #a1631a;
  --warn-soft: #fbf0dc;
  --warn-ink: #4a3410;

  --shadow-1: 0 1px 2px rgba(28,42,31,0.06), 0 1px 1px rgba(28,42,31,0.04);
  --shadow-2: 0 8px 24px rgba(28,42,31,0.12), 0 2px 6px rgba(28,42,31,0.06);
  --radius: 6px;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10160f;
    --surface: #171e15;
    --surface-2: #202a1c;
    --ink: #e9efe1;
    --ink-muted: #a0ac97;
    --ink-faint: #707d68;
    --border: #2b3527;
    --border-strong: #3a4735;
    --accent: #5fb33d;
    --accent-ink: #0d1409;
    --accent-soft: #223420;

    --type-org: #7fb0e0;
    --type-org-soft: #202b36;
    --type-research: #dba05a;
    --type-research-soft: #352a1b;
    --type-data: #b09be0;
    --type-data-soft: #2b2536;
    --type-bio: #5fcda8;
    --type-bio-soft: #1a2f27;
    --type-device: #e08a8a;
    --type-device-soft: #362121;

    --warn: #dba05a;
    --warn-soft: #3a2c14;
    --warn-ink: #f4e2c4;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-2: 0 8px 28px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"] {
  --bg: #10160f;
  --surface: #171e15;
  --surface-2: #202a1c;
  --ink: #e9efe1;
  --ink-muted: #a0ac97;
  --ink-faint: #707d68;
  --border: #2b3527;
  --border-strong: #3a4735;
  --accent: #5fb33d;
  --accent-ink: #0d1409;
  --accent-soft: #223420;

  --type-org: #7fb0e0;
  --type-org-soft: #202b36;
  --type-research: #dba05a;
  --type-research-soft: #352a1b;
  --type-data: #b09be0;
  --type-data-soft: #2b2536;
  --type-bio: #5fcda8;
  --type-bio-soft: #1a2f27;
  --type-device: #e08a8a;
  --type-device-soft: #362121;

  --warn: #dba05a;
  --warn-soft: #3a2c14;
  --warn-ink: #f4e2c4;

  --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-2: 0 8px 28px rgba(0,0,0,0.45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 64px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.masthead h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin: 0;
}
.masthead .subtitle {
  font-size: 12.5px;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}

/* ---------- instrument import: reuses the ranking dialog's overlay/modal ---------- */
.masthead-right { display: flex; align-items: baseline; gap: 14px; }
.import-modal { width: min(600px, calc(100vw - 32px)); max-height: min(720px, calc(100vh - 32px)); }
.import-section { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.import-section h3 { margin: 0; font-size: 13px; font-weight: 700; }
.import-section h3 small { font-weight: 400; color: var(--ink-faint); margin-left: 6px; }
.import-section p { margin: 0; font-size: 12.5px; }
.import-names { color: var(--ink-faint); font-size: 12px; }
.import-warning { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn-ink); border-radius: var(--radius); padding: 8px; font-size: 12.5px; }
.import-footer { display: flex; justify-content: flex-end; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-faint); }
.import-progress { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.import-progress progress { width: 100%; accent-color: var(--accent); }

/* ---------- top bar: search + breadcrumb ---------- */
.topbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.searchrow {
  display: flex;
  align-items: center;
  gap: 8px;
}
.searchrow svg { flex: none; color: var(--ink-faint); }
.searchrow input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  padding: 2px 0;
}
.searchrow input::placeholder { color: var(--ink-faint); }
.searchrow input:focus { outline: none; }

.crumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}
.crumb {
  border: none;
  background: none;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-muted);
  padding: 4px 8px;
  border-radius: 999px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 120ms ease, color 120ms ease;
}
.crumb:hover { background: var(--surface-2); color: var(--ink); }
.crumb.current {
  color: var(--ink);
  font-weight: 700;
  cursor: default;
}
.crumb.current:hover { background: none; }
.crumb-sep { color: var(--ink-faint); font-size: 11px; }

/* ---------- workspace ---------- */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(0, 6fr) minmax(0, 4fr);
  gap: 16px;
  align-items: start;
}
.pane {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pane-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.pane-head h2 {
  margin: 0;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  font-weight: 600;
}
.pane-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }
.search-group { padding: 10px 14px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
.search-more { margin: 2px 14px 8px; }
.pane-count .btn { margin-left: 8px; }
.row.row-cant .row-type { opacity: 0.55; }

/* explorer rows */
.rowlist {
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  max-height: 480px;
  overflow-y: auto;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 12px;
  border-left: 3px solid transparent;
  cursor: pointer;
  position: relative;
}
.row + .row { border-top: 1px solid var(--border); }
.row:hover { background: var(--surface-2); }

/* tree connector lines — depth is read from these, not from color alone */
.tree-indent { display: flex; align-self: stretch; flex: none; }
.tree-rail { width: 20px; flex: none; position: relative; }
.rail-full, .rail-top, .rail-bottom {
  position: absolute; left: 9px; width: 1px; background: var(--border-strong);
}
.rail-full { top: -1px; bottom: -1px; }
.rail-top { top: -1px; height: calc(50% + 1px); }
.rail-bottom { top: 50%; bottom: -1px; }
.rail-stub { position: absolute; left: 9px; top: 50%; width: 11px; height: 1px; background: var(--border-strong); }
.row.selected {
  background: var(--accent-soft);
  border-left-color: var(--accent);
}
.row-dot {
  flex: none;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dot, var(--ink-faint));
}
.row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
/* Menu groups: the plain-words hint sits under the label, so neither gets cut off. */
.row-main.stacked { flex-direction: column; align-items: flex-start; gap: 1px; }
.row-main.stacked .row-type { font-family: inherit; font-size: 11.5px; text-transform: none; color: var(--ink-faint); }
.row-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.row-type {
  flex: none;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--type-color, var(--ink-faint));
  text-transform: lowercase;
}
.row-nav {
  flex: none;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: none;
  background: transparent;
  color: var(--ink-faint);
  border-radius: 5px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 100ms ease, background 100ms ease, color 100ms ease;
}
.row:hover .row-nav, .row.selected .row-nav { opacity: 1; }
.row-nav:hover { background: var(--border); color: var(--ink); }
.row-nav:focus-visible { opacity: 1; }

.empty-hint {
  padding: 28px 16px;
  color: var(--ink-faint);
  font-size: 13px;
  text-align: center;
}

/* ---------- detail pane ---------- */
.detail-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 320px; }
.detail-empty {
  flex: 1;
  display: flex;
  /* Top-aligned, not vertically centered: the "+ New" menu is a dropup anchored to the
     bottom-right of this pane, and a centered placeholder sits directly in its flight path
     once there are several creatable types — it visibly truncates the text underneath. */
  align-items: flex-start;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 13px;
  text-align: center;
  padding: 40px 20px;
}
.local-crumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  padding-bottom: 8px;
  margin-bottom: 4px;
  border-bottom: 1px dashed var(--border);
}
.local-crumb {
  border: none;
  background: none;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  padding: 2px 5px;
  border-radius: 4px;
  cursor: pointer;
}
.local-crumb:hover { background: var(--surface-2); color: var(--ink); }
.local-crumb.current { color: var(--ink); font-weight: 600; cursor: default; }
.local-crumb.current:hover { background: none; }
.node-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.node-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--type-color, var(--ink-faint));
  text-transform: lowercase;
}
.node-kicker .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ink-faint)); }
.node-title-row { display: flex; align-items: baseline; gap: 8px; }
.node-title { font-size: 19px; font-weight: 700; letter-spacing: -0.005em; }
/* The open node's own title, as a selectable chip: reads as the heading, reveals the chip on hover. */
.self-chip {
  font-family: inherit; color: inherit; text-align: left; cursor: pointer;
  background: none; border: 1px dashed transparent; border-radius: 999px;
  padding: 2px 10px; margin-left: -11px;
  transition: border-color 100ms ease, background 100ms ease;
}
.self-chip:hover { border-color: var(--type-color, var(--accent)); background: var(--type-soft, var(--surface-2)); }
.self-chip.selected { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.btn.small { padding: 3px 8px; font-size: 11.5px; }
.node-uri {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  word-break: break-all;
}
.node-visibility { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
.node-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
.node-facts b { font-weight: 600; color: var(--ink); margin-right: 4px; }

.rel-group { display: flex; flex-direction: column; gap: 8px; }
.unlink-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  border-radius: var(--radius);
  padding: 10px 12px;
  color: var(--warn-ink);
}
.unlink-intro .unlink-intro-text { font-size: 12.5px; font-weight: 600; line-height: 1.45; }
.unlink-intro .unlink-intro-actions { display: flex; gap: 6px; flex: none; }
.rel-label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color 100ms ease, background 100ms ease;
}
.chip:hover { border-color: var(--type-color, var(--accent)); background: var(--type-soft, var(--surface-2)); }
.chip.selected { background: var(--accent-soft); border-color: var(--accent); }
.chip .swatch { width: 6px; height: 6px; border-radius: 50%; background: var(--dot, var(--ink-faint)); }
.chip-unlink {
  border: none;
  background: none;
  color: var(--ink-faint);
  font-size: 14px;
  line-height: 1;
  padding: 0 0 0 2px;
  cursor: pointer;
}
.chip-unlink:hover { color: var(--type-color, var(--accent)); }
/* One box per item whose rows only hold within it — a scientific object's germplasm/parent
   per experiment (relationsFor's itemGroups). */
.item-box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.item-box-rows { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; }
.item-box-key { font-size: 12px; color: var(--ink-faint); }
.hx-fac { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 8px 10px 10px; margin-bottom: 8px; }
.hx-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 6px; }
.hx-level { border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px 8px; }
.hx-head { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; cursor: pointer; border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
.hx-head small { font-weight: 400; color: var(--ink-faint); }
.hx-plants { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.hx-plant { font-size: 11px; line-height: 16px; border: 1px solid var(--border); border-radius: 9px; padding: 0 7px; cursor: pointer; user-select: none; }
.hx.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }
.hx-plant.on { font-weight: 700; }
.hx.also { border-style: dashed; border-color: var(--accent); }
.hx-note { font-size: 12px; color: var(--ink-faint); margin: 4px 0; }
.meas-title { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
.meas-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); }
.meas-row { display: grid; grid-template-columns: minmax(130px, 36%) 1fr; gap: 12px; align-items: center; padding: 3px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.meas-row:last-child { border-bottom: none; }
.meas-name { min-width: 0; overflow-wrap: anywhere; }
.meas-name a { color: var(--ink); cursor: pointer; border-bottom: 1px dotted var(--ink-faint); }
.meas-name a:hover { border-bottom-color: var(--ink); }
.meas-unit { color: var(--ink-faint); margin-left: 4px; font-size: 11.5px; }
.meas-chart { position: relative; height: 30px; cursor: pointer; }
.meas-chart.none { cursor: default; color: var(--ink-faint); font-size: 11.5px; line-height: 30px; }
.meas-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.meas-chart polyline { fill: none; stroke: var(--type-data); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.meas-pt, .meas-dot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--type-data); pointer-events: none; }
.meas-dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; box-shadow: 0 0 0 3px var(--type-data-soft); }
.meas-tip { position: absolute; bottom: 100%; margin-bottom: 4px; padding: 2px 7px; white-space: nowrap; font-size: 11.5px; background: var(--ink); color: var(--surface); border-radius: 4px; pointer-events: none; z-index: 5; }
.meas-dialog { width: min(720px, 94vw); max-height: 90vh; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
.meas-dialog::backdrop { background: rgba(0, 0, 0, .45); }
.meas-dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.meas-dlg-title { font-size: 16px; font-weight: 600; }
.meas-dlg-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
.meas-chart.big { height: 220px; cursor: default; border: 1px solid var(--border); border-radius: var(--radius); }
.meas-axis { position: absolute; left: 6px; font-size: 11px; color: var(--ink-faint); }
.meas-axis.top { top: 4px; }
.meas-axis.bottom { bottom: 4px; }
.meas-axis-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin: 4px 2px 12px; }
.meas-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 12px; }
.meas-stats div { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-faint); }
.meas-stats b { font-size: 14px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.meas-values { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.meas-values table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.meas-values th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 500; color: var(--ink-muted); }
.meas-values th, .meas-values td { padding: 3px 10px; border-bottom: 1px solid var(--border); }
.meas-values td:last-child, .meas-values th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.meas-dlg-foot { margin-top: 12px; text-align: right; }
.rel-empty { color: var(--ink-faint); font-size: 12.5px; }

/* selection / CTA bar */
.actionbar {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-2);
}
.actionbar.idle { color: var(--ink-faint); font-size: 12.5px; }
.selection-summary {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-muted);
}
.selection-summary b { color: var(--ink); font-weight: 700; font-family: var(--font-mono); }
.selection-names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 5px;
  padding: 7px 12px;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-faint); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-faint); }

<script>
// API calls are relative ("api/...") so the page also works under a sub-path such as
// phis.pheno.no/portal/ (the server redirects the bare /portal to it).
// Every change the page asks for carries X-Graph-Explorer; the server refuses changes without it.
// Browsers won't add a custom header for another site, so no other site can make this browser
// change PHIS while it holds the portal's login (CSRF). Wrapped once so no call can forget it.
{
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (url, init = {}) => (init.method ?? "GET") === "GET" ? nativeFetch(url, init)
    : nativeFetch(url, { ...init, headers: { ...init.headers, "X-Graph-Explorer": "1" } });
}
/* ---------------- mock graph data ---------------- */
// `name` = PHIS's own word for the type, so what users learn here carries over to PHIS; the plain
// explanation lives in the menu hints. Every type name on the page goes through typeName().
const TYPES = {
  category:   { color: "var(--ink-faint)" },
  organization:{ color: "var(--type-org)", soft: "var(--type-org-soft)", name: "organization" },
  facility:   { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "facility", plural: "facilities" },
  experiment: { color: "var(--type-research)", soft: "var(--type-research-soft)", name: "experiment" },
  project:    { color: "var(--type-research)", soft: "var(--type-research-soft)", name: "project" },
  scientific_object: { color: "var(--type-bio)", soft: "var(--type-bio-soft)", name: "scientific object" },
  germplasm:  { color: "var(--type-bio)", soft: "var(--type-bio-soft)", name: "germplasm", plural: "germplasm" },
  variable:   { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "variable" },
  entity:     { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "entity", plural: "entities" },
  characteristic: { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "characteristic" },
  method:     { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "method" },
  unit:       { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "unit" },
  factor:     { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "factor" },
  factor_level: { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "factor level" },
  device:     { color: "var(--type-device)", soft: "var(--type-device-soft)", name: "device" },
  site:       { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "site" },
  person:     { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "person", plural: "persons" },
  account:    { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "account" },
  group:      { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "group" },
  profile:    { color: "var(--type-org)", soft: "var(--type-org-soft)", name: "profile" },
  data_file:  { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "data file" },
  provenance: { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "provenance" },
  event:      { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "event" },
  document:   { color: "var(--type-data)", soft: "var(--type-data-soft)", name: "document" },
};
// n given and not 1 = the plural (own `plural`, else name + "s").
const typeName = (t, n = 1) => {
  const one = TYPES[t]?.name ?? String(t).replace("_", " ");
  return n === 1 ? one : TYPES[t]?.plural ?? `${one}s`;
};

/* A higher-level PHIS: PHIS's own names (so learning carries over), grouped the way a plant
   scientist looks for things (trial first), each with a plain-words `hint` underneath. Designed
   2026-09-30 by simulating a trial scientist; to be checked with real users (first-click tasks).
   PHIS's grouping (Scientific Organization / Scientific Information / Data) is replaced on purpose.
   Accounts, groups and profiles are in People (user, 2026-10-01: "the whole PHIS stack"); read-only for now. */
const ROOT = [
  { id: "cat-trials", type: "category", label: "Trials", hint: "experiments, scientific objects, germplasm, factors" },
  { id: "cat-data", type: "category", label: "Data", hint: "variables, measurements, data files, provenances" },
  { id: "cat-setup", type: "category", label: "Setup", hint: "sites, facilities, devices, events" },
  { id: "cat-people", type: "category", label: "People", hint: "persons, accounts, groups, organizations, projects" },
];

const CATEGORY_ITEMS = {
  "cat-trials": [
    { id: "cat-experiments", type: "category", label: "Experiments", hint: "your trials, in greenhouse or field" },
    { id: "cat-scientificobjects", type: "category", label: "Scientific Objects", hint: "what you measure: plants, plots, pots, samples" },
    { id: "cat-germplasm", type: "category", label: "Germplasm", hint: "plant material: species, varieties, lines" },
    { id: "cat-factors", type: "category", label: "Factors", hint: "treatments and design, e.g. drought, replicate" },
  ],
  "cat-data": [
    { id: "cat-variables", type: "category", label: "Variables", hint: "traits: what is measured, e.g. plant height" },
    { id: "cat-tabular", type: "category", label: "Tabular Data", hint: "the measured values" },
    { id: "cat-datafiles", type: "category", label: "Data files", hint: "images and raw files" },
    { id: "cat-provenances", type: "category", label: "Provenances", hint: "how data was collected: device, software, who" },
    { id: "cat-documents", type: "category", label: "Documents", hint: "protocols, papers, notes" },
  ],
  "cat-setup": [
    { id: "cat-sites", type: "category", label: "Sites", hint: "places, e.g. Holt, Ås" },
    { id: "cat-facilities", type: "category", label: "Facilities", hint: "greenhouses, growth rooms, fields" },
    { id: "cat-devices", type: "category", label: "Devices", hint: "instruments: cameras, scanners, sensors" },
    { id: "cat-events", type: "category", label: "Events", hint: "logbook: sowing, moves, watering, calibration" },
  ],
  "cat-people": [
    { id: "cat-persons", type: "category", label: "Persons", hint: "people: scientists, technicians" },
    { id: "cat-accounts", type: "category", label: "Accounts", hint: "who can log in to PHIS" },
    { id: "cat-groups", type: "category", label: "Groups", hint: "who an experiment is shared with, and their rights" },
    { id: "cat-profiles", type: "category", label: "Profiles", hint: "bundles of rights a group member gets" },
    { id: "cat-organizations", type: "category", label: "Organizations", hint: "institutes, research groups" },
    { id: "cat-projects", type: "category", label: "Projects", hint: "funded projects" },
  ],

  // Real data, fetched from the backend at load time — see the fetch calls below.
  // Empty array = not wired to a real OpenSILEX endpoint yet (not "no data").
  "cat-organizations": [],
  "cat-experiments": [],
  "cat-projects": [],
  "cat-factors": [],
  "cat-facilities": [],
  "cat-devices": [],
  "cat-sites": [],
  "cat-persons": [],
  "cat-accounts": [],
  "cat-groups": [],
  "cat-profiles": [],
  "cat-scientificobjects": [],
  "cat-variables": [],
  "cat-germplasm": [],
  // Tabular Data has no direct wiring here: OpenSILEX's /core/data endpoint returns
  // individual measurement rows (value/variable/target/date), not named browsable
  // nodes — it needs a different UI (a table scoped to one scientific object/variable),
  // not the same "list of labeled things" pattern as everything else in this menu.
  "cat-tabular": [],
  "cat-datafiles": [],
  "cat-provenances": [],
  "cat-events": [],
  "cat-documents": [],
};

const NODE_DETAIL = {};

/* ADJACENT and creatableTypesFor live in server/src/adjacency.js, not here — it's the single
   source of truth shared by this page and the Node backend/tests (see that file's own comment
   for why and the DTO evidence behind each entry). The server inlines it verbatim at this
   marker when serving this page, so editing the rule means editing exactly one file. */
/* ADJACENCY_JS_INJECTED_HERE */

/* ---------------- state ---------------- */
let path = [{ id: "root", type: "category", label: "Graph" }];
let selection = new Map();   // id -> node — who's selected; drives BOTH the action bar and the tree forest
let anchorId = null;
let rowOrder = [];

/* Tree mode: an alternate rendering of the SAME `selection` — one root per
   selected item, expandable to show its relations. Entering/leaving it
   never touches `selection`, so anything picked in list mode is still
   there when you come back, and anything picked while in tree mode is
   still there once you leave. This is deliberate: selection is the single
   source of truth for "what's gathered so far," list and tree are just two
   views onto it. */
let expandedIds = new Set();

/* Local breadcrumb for the right-hand pane, only meaningful in tree mode.
   Lets you follow a tree node's own relations further right without
   touching the global `path` (which would exit tree mode) or the tree
   itself (the fixed base on the left). Cleared whenever tree mode toggles
   in either direction. */
let detailPath = [];

// id of the node currently showing the "unlink before delete" view, or null. Set by Delete
// when the node still has relations (delete would just fail); cleared automatically once
// every unlinkable relation is gone, or whenever a different node is opened.
let unlinkTargetId = null;

// "Link existing…" popover state — separate from `selection` since picking targets to link
// TO the current selection is a distinct gathering step, not a change to what's selected in
// the main pane. Reset whenever the popover opens or a link is confirmed.
let linkPickerType = null;     // which candidate type is being browsed, or null = type list
let linkPickerPicked = new Map();  // id -> item, gathered so far in this popover session
let linkPickerShiftAnchor = null;  // last picked id, for shift-range within the current type's list
// Non-null = the same picker locked to ONE type, with its own confirm action instead of linking
// to the selection — {type, confirmLabel(n), onConfirm(items)}. Used by standalone "+ New site"
// to pick the organization(s) a site can't exist without (CREATABLE[t].requiresLink).
let linkPickerMode = null;
// Labels offered in the action bar with nothing picked: after a link that created experiment
// copies, what those objects have in their other experiments (carryOver); after germplasm was
// set on an object, its children there that lack it (childOffer, items carry `parent`).
// Skipping, or navigating away, changes nothing.
let carryOverOffer = null;
// A link that lives inside an experiment (an object's germplasm or parent) that the backend
// couldn't place on its own: {what, lone, lonePrompt?, placeOptions?, experiments, objects, retry}.
// The action bar asks — which experiment(s), nothing picked (then retry(picked)); or first adds
// the `lone` objects to an experiment (placeOptions, else any) and then retry().
let experimentChoice = null;
// id of the node whose Delete was refused up front (node.deleteBlocked) — shows the reason in
// the detail pane instead of a confirm or a bare error toast. Cleared on navigation.
let deleteBlockedShown = null;
// Non-null while the top bar holds text: the list pane shows these results instead of `path`'s
// list — search is a view over the pane, not a place in the breadcrumb (spec "Search as a way to
// select"). groups = api/search's [{type, total, items, error?}], null while waiting.
let search = null;
let searchSeq = 0;   // bumped per query; an answer for an older seq is dropped
let searchTimer = null;

/* Every item currently clickable ANYWHERE on screen (left rowlist, tree,
   or the local member-list in the detail pane when it's showing a
   category), rebuilt by whichever render function last touched that
   area. The unified mousedown/mouseup pipeline resolves clicks through
   this single map instead of guessing which pane a click landed in. */
let addressableItems = new Map();

const els = {
  crumbs: document.getElementById("crumbs"),
  paneTitle: document.getElementById("paneTitle"),
  paneCount: document.getElementById("paneCount"),
  searchInput: document.getElementById("searchInput"),
  rowlist: document.getElementById("rowlist"),
  detailBody: document.getElementById("detailBody"),
  actionbar: document.getElementById("actionbar"),
  toast: document.getElementById("toast"),
  selList: document.getElementById("selList"),
  selCount: document.getElementById("selCount"),
  treeArea: document.getElementById("treeArea"),
};

function currentPane() { return path[path.length - 1]; }

function itemsForPane() {
  const p = currentPane();
  if (p.id === "root") return ROOT;
  // Items with a `parent` (a germplasm's species — see the backend's list.ts) sit under it: a
  // category lists only the parentless ones, an opened node lists its own children.
  if (p.type !== "category") return categoryRows(p).filter(i => i.parent === p.id);
  return (CATEGORY_ITEMS[p.id] || []).filter(i => !i.parent);
}
function categoryRows(item) { return CATEGORY_ITEMS[CATEGORY_FOR_TYPE[item.type]] || []; }

function typeStyle(type) {
  const t = TYPES[type] || TYPES.category;
  return `--dot:${t.color}; --type-color:${t.color}; --type-soft:${t.soft || "var(--surface-2)"};`;
}

/* Categories aren't real graph nodes, so "selecting" one really means
   "select every real resource inside it" — recursively, since a group can
   itself contain sub-groups (Scientific Organization -> Organizations ->
   individual orgs) before hitting anything real. */
function flattenCategoryToRealItems(id) {
  const kids = CATEGORY_ITEMS[id] || [];
  let out = [];
  kids.forEach(k => {
    out = k.type === "category" ? out.concat(flattenCategoryToRealItems(k.id)) : out.concat([k]);
  });
  return out;
}
function expandForSelection(item) {
  return item.type === "category" ? flattenCategoryToRealItems(item.id) : [item];
}
function isCategoryFullySelected(id) {
  const members = flattenCategoryToRealItems(id);
  return members.length > 0 && members.every(m => selection.has(m.id));
}

function showToast(msg, ms = 1600) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove("show"), ms);
}

/* ---------------- rendering ---------------- */
function renderCrumbs() {
  els.crumbs.innerHTML = "";
  path.forEach((seg, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      els.crumbs.appendChild(sep);
    }
    const btn = document.createElement("button");
    const isLast = i === path.length - 1;
    btn.className = "crumb" + (isLast ? " current" : "");
    btn.textContent = seg.label;
    if (!isLast) {
      btn.addEventListener("click", () => navigateTo(path.slice(0, i + 1))); // loads it again if its cached detail was dropped
    }
    els.crumbs.appendChild(btn);
  });
}

// One list row. `note` (search only) is appended to the type line, e.g. "can link".
function rowEl(item, note) {
  const isSelected = item.type === "category" ? isCategoryFullySelected(item.id) : selection.has(item.id);
  const row = document.createElement("div");
  row.className = "row" + (isSelected ? " selected" : "") + (note === "can't link" ? " row-cant" : "");
  row.setAttribute("style", typeStyle(item.type));
  row.dataset.id = item.id;
  const typeLine = item.type === "category" ? escapeHtml(item.hint ?? "") : typeName(item.type) + (note ? ` · ${note}` : "");
  row.innerHTML = `
    <span class="row-dot"></span>
    <span class="row-main${item.type === "category" ? " stacked" : ""}">
      <span class="row-label">${escapeHtml(item.label)}</span>
      <span class="row-type">${typeLine}</span>
    </span>
    <button class="row-nav" title="Open" aria-label="Open ${escapeHtml(item.label)}">›</button>
  `;
  // A search hit opens at its real place (its canonical path); navigateTo ends the search.
  row.querySelector(".row-nav").addEventListener("click", (e) => { e.stopPropagation(); search ? openRelatedNode(item) : openNode(item); });
  return row;
}

function emptyHint(text) {
  const div = document.createElement("div");
  div.className = "empty-hint";
  div.textContent = text;
  els.rowlist.appendChild(div);
}

function renderRows() {
  if (search) return renderSearchRows();
  const items = itemsForPane();
  const p = currentPane();
  els.paneTitle.textContent = p.label;
  els.paneCount.textContent = items.length ? `${items.length} item${items.length === 1 ? "" : "s"}` : "";
  els.rowlist.innerHTML = "";
  rowOrder = items.map(it => it.id);
  addressableItems = new Map(items.map(it => [it.id, it]));
  if (!items.length) return emptyHint("Nothing here yet.");
  items.forEach(item => els.rowlist.appendChild(rowEl(item)));
}

/* ---------------- search (spec "Search as a way to select") ----------------
   The top bar asks api/search (OpenSILEX's own name filters, 20 a type with totals) ~250 ms after
   typing stops. Results are an ordinary list: same click rules, Select all, Show more per type. */
// What a result is to the current selection (null when nothing is selected or it is selected):
// "can link" — its type can link to everything selected (the rule behind + New); "already linked"
// — only when known: one selected item whose detail is cached, never guessed; else "can't link".
function searchNote(item) {
  if (!selection.size || selection.has(item.id)) return null;
  if (selection.size === 1) {
    const rel = NODE_DETAIL[[...selection.keys()][0]]?.relations ?? [];
    if (rel.some(r => r.items.some(it => it.id === item.id))) return "already linked";
  }
  return linkableExistingTypes().has(item.type) ? "can link" : "can't link";
}

// Linkability is per type, so with something selected the types that can link come first
// (a stable sort keeps menu order within each half). Applied once when an answer arrives — never
// on a click, or the group just clicked in would jump away under the cursor.
function orderSearchGroups(groups) {
  if (!selection.size) return groups;
  const linkable = linkableExistingTypes();
  return [...groups].sort((a, b) => (linkable.has(a.type) ? 0 : 1) - (linkable.has(b.type) ? 0 : 1));
}
function searchGroupsInOrder() { return search.groups || []; }

// renderRows rebuilds addressableItems from the list alone; the tree and the detail pane's member
// rows re-add theirs when they render — so a search update re-renders them too, or they stop
// taking clicks.
function renderSearchUpdate() { refreshLeftPane(); renderDetail(); }

function renderSearchRows() {
  const groups = searchGroupsInOrder();
  const items = groups.flatMap(g => g.items);
  els.paneTitle.textContent = `Search: “${search.q}”`;
  els.paneCount.textContent = "";
  els.rowlist.innerHTML = "";
  rowOrder = items.map(it => it.id);
  addressableItems = new Map(items.map(it => [it.id, it]));
  if (search.failed) return emptyHint(`Search failed: ${search.failed}`);
  if (!search.groups) return emptyHint("Searching…");
  if (!groups.length) return emptyHint(`No matches for “${search.q}”.`);

  const total = groups.reduce((n, g) => n + g.total, 0);
  if (items.length) {
    // Adds what is shown to the selection (gathering, like ctrl-click), never thousands by
    // accident; says so when more match.
    if (items.length < total) els.paneCount.textContent = `${total} match — type more to narrow`;
    const all = document.createElement("button");
    all.className = "btn ghost small";
    all.id = "searchSelectAll";
    all.textContent = items.length < total ? `Select all ${items.length} shown` : `Select all ${items.length}`;
    all.addEventListener("click", () => {
      items.forEach(it => selection.set(it.id, it));
      anchorId = null;
      refreshLeftPane(); renderDetail(); renderActionbar();
    });
    els.paneCount.appendChild(all);
  }
  groups.forEach(g => {
    const head = document.createElement("div");
    head.className = "search-group";
    head.textContent = `${typeName(g.type, 2)} · ${g.error ? "couldn't be searched" : g.items.length < g.total ? `${g.items.length} of ${g.total}` : g.total}`;
    els.rowlist.appendChild(head);
    g.items.forEach(item => els.rowlist.appendChild(rowEl(item, searchNote(item))));
    if (!g.error && g.items.length < g.total) {
      const more = document.createElement("button");
      more.className = "btn ghost small search-more";
      more.textContent = "Show more";
      more.addEventListener("click", () => showMoreResults(g));
      els.rowlist.appendChild(more);
    }
  });
}

async function runSearch(q) {
  const seq = ++searchSeq;
  search = { q, groups: null };
  renderSearchUpdate();
  try {
    const res = await fetch(`api/search?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error(`${res.status}`);
    const groups = await res.json();
    if (seq !== searchSeq) return; // an older query answering late
    search = { q, groups: orderSearchGroups(groups) };
  } catch (err) {
    if (seq !== searchSeq) return;
    search = { q, groups: [], failed: err.message };
  }
  renderSearchUpdate();
}

async function showMoreResults(group) {
  const seq = searchSeq;
  const page = (group.page ?? 0) + 1; // the next api/search page of this type
  const res = await fetch(`api/search?q=${encodeURIComponent(search.q)}&type=${encodeURIComponent(group.type)}&page=${page}`);
  const [next] = res.ok ? await res.json() : [];
  if (seq !== searchSeq || !search) return;
  if (next) {
    group.page = page;
    group.items = group.items.concat(next.items.filter(it => !group.items.some(x => x.id === it.id)));
  }
  else showToast("Couldn't load more.");
  renderSearchUpdate();
}

// Ends the search without rendering (callers that navigate render anyway).
function clearSearch() {
  clearTimeout(searchTimer);
  searchSeq++;
  search = null;
  els.searchInput.value = "";
}
function endSearch() { clearSearch(); renderSearchUpdate(); }

els.searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = els.searchInput.value.trim();
  if (!q) return endSearch();
  searchTimer = setTimeout(() => runSearch(q), 250);
});
els.searchInput.addEventListener("keydown", (e) => { if (e.key === "Escape") endSearch(); });

// `order` = the visible order of the area the click came from (the list, or the tree), so a
// shift-range never spans two areas.
function applyClick(item, mod, order = rowOrder) {
  if (mod === "shift" && anchorId && order.includes(anchorId) && order.includes(item.id)) {
    const lo = Math.min(order.indexOf(anchorId), order.indexOf(item.id));
    const hi = Math.max(order.indexOf(anchorId), order.indexOf(item.id));
    selection = new Map();
    order.slice(lo, hi + 1).forEach(id => {
      const found = addressableItems.get(id);
      if (found) expandForSelection(found).forEach(m => selection.set(m.id, m));
    });
  } else if (mod === "ctrl") {
    // A category toggles as a whole group: if every real member is
    // already in, ctrl-click removes them all; otherwise it adds
    // whichever are missing. This is what makes drilling into a group and
    // ctrl-clicking one member back OUT actually work — that member is a
    // normal selection entry, not a symbolic "all members" placeholder.
    const members = expandForSelection(item);
    const allIn = members.length > 0 && members.every(m => selection.has(m.id));
    if (allIn) members.forEach(m => selection.delete(m.id));
    else members.forEach(m => selection.set(m.id, m));
    anchorId = item.id;
  } else {
    selection = new Map(expandForSelection(item).map(m => [m.id, m]));
    anchorId = item.id;
  }
  refreshLeftPane();
  renderDetail();
  renderActionbar();
}

function openNode(item) {
  navigateTo([...path, item]);
}

// A relation chip in the detail pane can point at a resource that already has its own real
// spot in the category tree — e.g. opening Org A, following its "Facilities" relation to
// Facility X, then following X's "Organizations" relation back to Org A. Appending each hop
// onto whatever ad-hoc trail got you there (like openNode does for real drill-down) would grow
// the breadcrumb into a nonsensical, looping trail (A -> X -> A -> X...). Jump to the target's
// canonical path instead — same destination as if you'd browsed there directly.
const VARIABLE_PARTS = new Set(["entity", "characteristic", "method", "unit"]);
function openRelatedNode(item) {
  navigateTo(canonicalPathFor(item));
}

function navigateTo(newPath) {
  clearSearch();
  path = newPath;
  detailPath = []; // a real navigation ends any local detail opened from the tree
  unlinkTargetId = null; // opening any node starts on the normal view, not mid-unlink
  carryOverOffer = null;
  experimentChoice = null;
  deleteBlockedShown = null;
  render();
  loadNodeDetail(newPath[newPath.length - 1]);
}

// The category tree is exactly two levels deep before real nodes (see ROOT/CATEGORY_ITEMS'
// header comment) — walk it to find which two category crumbs a given type lives under.
function canonicalPathFor(item) {
  // A factor level lives under its factor: Trials › Factors › Replicate › Replicate: 2.
  if (item.type === "factor_level" && item.factor) {
    const factor = findItemById(item.factor) || { id: item.factor, type: "factor", label: item.label.split(":")[0] };
    return [...canonicalPathFor(factor), item];
  }
  // A variable's parts are shared by many variables, so they sit beside them: Data › Variables › Millimeter.
  if (VARIABLE_PARTS.has(item.type)) return [...canonicalPathFor({ type: "variable", id: "" }).slice(0, -1), item];
  const categoryId = CATEGORY_FOR_TYPE[item.type];
  // Its parents too (an accession's species), outermost first; the length cap guards a cycle.
  const ancestors = [];
  for (let p = categoryRows(item).find(i => i.id === item.id)?.parent; p && ancestors.length < 10; ) {
    const row = categoryRows(item).find(i => i.id === p);
    if (!row) break;
    ancestors.unshift(row);
    p = row.parent;
  }
  for (const topCat of ROOT) {
    if (categoryId && topCat.id === categoryId) return [path[0], topCat, ...ancestors, item];
    const leafCat = (CATEGORY_ITEMS[topCat.id] || []).find(c => c.id === categoryId);
    if (leafCat) return [path[0], topCat, leafCat, ...ancestors, item];
  }
  // Type not wired into the category tree at all (shouldn't happen for anything with its own
  // relations) — fall back to appending, same as before this existed.
  return [...path, item];
}

// NODE_DETAIL is a cache, not a placeholder: populated on demand as nodes are opened, not
// preloaded. Types the backend doesn't support yet (see /api/node-detail) just 404/400 and
// leave the existing "No connections found" fallback in place — honest, not fake.
async function loadNodeDetail(item) {
  if (item.type === "category" || item.id in NODE_DETAIL) return;
  try {
    const res = await fetch(`api/node-detail?type=${encodeURIComponent(item.type)}&id=${encodeURIComponent(item.id)}`);
    if (!res.ok) return;
    NODE_DETAIL[item.id] = await res.json();
    renderDetail();
  } catch {
    // stays unset — renderNodeDetail's existing null-branch already shows the honest fallback
  }
}

// Drops a node's cached detail — same "cache is stale, don't guess, just drop it" reasoning as
// everywhere NODE_DETAIL gets invalidated. render() alone never refetches an open node (only
// openNode does, via loadNodeDetail), so a bare `delete` on the node currently shown in the
// right-hand pane would leave it showing "No connections found" until the user navigated away
// and back — refetch it immediately instead when that's the case.
function invalidateNodeDetail(id) {
  delete NODE_DETAIL[id];
  Object.keys(MEASUREMENTS).filter(k => k.startsWith(`${id}|`)).forEach(k => delete MEASUREMENTS[k]);
  const p = currentPane();
  if (p && p.id === id) loadNodeDetail(p);
}

// Public or private, one PUT per item (experiments and germplasm only — VISIBILITY_TYPES).
async function setVisibility(items, isPublic) {
  let done = 0;
  const failed = [];
  for (const item of items) {
    const res = await fetch("api/node", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: item.type, id: item.id, isPublic }),
    }).catch(err => ({ ok: false, json: async () => ({ error: String(err) }) }));
    if (res.ok) {
      done++;
      if (NODE_DETAIL[item.id]) NODE_DETAIL[item.id] = { ...NODE_DETAIL[item.id], isPublic };
    } else failed.push(`${item.label} (${(await res.json().catch(() => ({}))).error || res.status})`);
  }
  renderDetail();
  showToast(`Made ${done} ${isPublic ? "public" : "private"}${failed.length ? `. Failed: ${failed.join(", ")}` : ""}`, failed.length ? 6000 : 1600);
}

// `inExp` = {id, label, name}: rename only the copy in that experiment (a scientific object's
// box on its page) — the title then changes only if it showed that copy's name.
async function renameNode(item, inExp = null) {
  const current = inExp ? inExp.name : item.label;
  const label = prompt(inExp ? `New name for ${current} in ${inExp.label}?` : `New name for ${item.label}?`, current);
  if (!label || label === current) return;
  try {
    const res = await fetch("api/node", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: item.type, id: item.id, name: label, ...(inExp ? { experiment: inExp.id } : {}) }),
    });
    const body = await res.json();
    if (!res.ok) { showToast(`Failed to rename: ${body.error || res.status}`, 6000); return; }
    // item is the same object referenced from selection/CATEGORY_ITEMS/path (see how "+ New"
    // auto-attach relies on the same sharing) — mutating it in place keeps everywhere in sync.
    if (!inExp || item.label === current) item.label = body.label;
    // Its connections still show the old name (a factor's Levels list, a plant's level chip).
    (NODE_DETAIL[item.id]?.relations ?? []).flatMap(rel => rel.items).forEach(it => delete NODE_DETAIL[it.id]);
    // Its own page shows per-experiment names (a scientific object's boxes): fetch it again.
    if (item.type === "scientific_object") { delete NODE_DETAIL[item.id]; loadNodeDetail(item); }
    render();
    showToast(`Renamed to ${body.label}`);
  } catch (err) {
    showToast(`Failed to rename: ${err}`);
  }
}

// The one remaining link a type can't exist without (CREATABLE[t].requiresLink — e.g. a site's
// last organization), or null. Unlinking it can only be refused by OpenSILEX, so the unlink view
// offers deleting the node instead of a dead-end ×.
function lastRequiredLink(type, node) {
  const required = CREATABLE[type]?.requiresLink;
  if (!required) return null;
  const items = (node?.relations ?? []).filter(rel => rel.field).flatMap(rel => rel.items).filter(it => it.type === required);
  return items.length === 1 ? items[0] : null;
}

// `force` = delete even though relations remain — only offered from the unlink view when the
// last remaining required link can't be removed (see lastRequiredLink). OpenSILEX drops the
// node's links along with it (confirmed live for sites), and the confirm names them.
// Drops a deleted node from every client-side list it could still appear in.
function forgetNode(item) {
  const categoryId = CATEGORY_FOR_TYPE[item.type];
  if (categoryId && CATEGORY_ITEMS[categoryId]) {
    CATEGORY_ITEMS[categoryId] = CATEGORY_ITEMS[categoryId].filter(i => i.id !== item.id);
  }
  selection.delete(item.id);
  delete NODE_DETAIL[item.id];
}

async function deleteNode(item, force = false) {
  // A node with real relations would just get refused by OpenSILEX (referential integrity —
  // the whole point of this app is that nothing gets orphaned) — so route straight to the
  // unlink view instead of letting the user hit that as a dead-end "Failed to delete" toast.
  // Two exceptions: a type whose delete takes its links with it (node.deleteRemovesLinks —
  // e.g. experiment) goes straight to a confirm naming them; and a group that BLOCKS delete
  // (rel.blocksDelete — an experiment's scientific objects) always routes to unlink mode,
  // where the banner explains why and offers to delete those first.
  // A counted cascade warning is counted again right now: a level set on objects since the
  // factor was opened (here or by someone else) must not be missing from the confirm.
  if (NODE_DETAIL[item.id]?.deleteWarning !== undefined) {
    delete NODE_DETAIL[item.id];
    await loadNodeDetail(item);
  }
  const node = NODE_DETAIL[item.id];
  if (node?.deleteBlocked) {
    deleteBlockedShown = item.id;
    renderDetail();
    return;
  }
  const blockers = (node?.relations ?? []).filter(rel => rel.blocksDelete);
  const related = (node?.relations ?? []).filter(rel => !rel.blocksDelete).flatMap(rel => rel.items);
  if (!force && (blockers.length || (related.length && !node?.deleteRemovesLinks))) {
    unlinkTargetId = item.id;
    render();
    return;
  }
  // A type whose delete cascades where the relations don't show says so itself (a factor's levels
  // vanish from the objects using them — counted by the server).
  const alsoUnlinks = node?.deleteWarning ? ` ${node.deleteWarning}`
    : related.length ? ` It will also be unlinked from: ${related.map(it => it.label).join(", ")}.` : "";
  if (!confirm(`Delete ${item.label}?${alsoUnlinks} This cannot be undone.`)) return;
  try {
    const res = await fetch(`api/node?type=${encodeURIComponent(item.type)}&id=${encodeURIComponent(item.id)}`, {
      method: "DELETE",
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showToast(`Failed to delete: ${body.error || res.status}`);
      return;
    }
    forgetNode(item);
    related.forEach(it => invalidateNodeDetail(it.id)); // their relations still list this node
    unlinkTargetId = null;
    if (path[path.length - 1]?.id === item.id) path = path.slice(0, -1);
    render();
    showToast(`Deleted ${item.label}`);
  } catch (err) {
    showToast(`Failed to delete: ${err}`);
  }
}

// "Scientific objects" group label -> "1 scientific object" / "3 scientific objects".
function countOf(n, groupLabels) {
  const words = groupLabels.map(l => l.toLowerCase()).join(" and ");
  return `${n} ${n === 1 ? words.replace(/s$/, "") : words}`;
}

// The blocked-delete path: clears the node's blocksDelete groups (e.g. an experiment's scientific
// objects), then carries on with the delete the user started — the node's own confirm, which
// names the links that go with it. Per item: one that lives ONLY here is deleted from PHIS
// entirely; one that also lives elsewhere (a scientific object shared with another experiment)
// is only removed from this node, via the group's unlink, so the other experiments keep it.
// The confirm spells out which is which.
async function deleteBlockers(item) {
  const groups = (NODE_DETAIL[item.id]?.relations ?? []).filter(rel => rel.blocksDelete);
  const entries = groups.flatMap(rel => rel.items.map(it => ({ it, field: rel.field })));
  const niceType = typeName(item.type);
  // Where else does each one live? One backend call that asks the experiments' side (/api/elsewhere);
  // asking each object was minutes of silence for a 100-plant trial (found 2026-09-30).
  if (entries.length > 10) showToast(`Checking where each of the ${entries.length} is used, before asking…`, 30000);
  let elsewhere = {};
  try {
    const res = await fetch(`api/elsewhere?experiment=${encodeURIComponent(item.id)}`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    elsewhere = await res.json();
  } catch (err) {
    showToast(`Couldn't check where they are used: ${err}`);
    return;
  }
  for (const e of entries) e.elsewhere = elsewhere[e.it.id] ?? [];
  els.toast.classList.remove("show");
  const what = countOf(entries.length, groups.map(rel => rel.label));
  const lines = entries.map(e => e.elsewhere.length
    ? `• ${e.it.label} — also in ${e.elsewhere.map(o => o.label).join(", ")}: removed from ${item.label} only, kept there`
    : `• ${e.it.label} — only here: deleted from PHIS entirely`);
  if (!confirm(`${item.label} holds ${what}. To delete the ${niceType}:\n\n${lines.join("\n")}\n\nThis cannot be undone.`)) return;
  for (const [i, e] of entries.entries()) {
    if (entries.length > 10) showToast(`Removing ${i + 1} of ${entries.length}…`, 10000);
    try {
      const res = e.elsewhere.length
        ? await fetch("api/node", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: item.type, id: item.id, unlink: { field: e.field, uri: e.it.id } }),
          })
        : await fetch(`api/node?type=${encodeURIComponent(e.it.type)}&id=${encodeURIComponent(e.it.id)}`, { method: "DELETE" });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        showToast(`Failed on ${e.it.label}: ${body.error || res.status}`);
        invalidateNodeDetail(item.id); // show what's actually left
        return;
      }
    } catch (err) {
      showToast(`Failed on ${e.it.label}: ${err}`);
      return;
    }
    if (e.elsewhere.length) delete NODE_DETAIL[e.it.id]; // its Experiments list just lost this one
    else forgetNode(e.it);
  }
  delete NODE_DETAIL[item.id];
  await loadNodeDetail(item);
  showToast(`Cleared ${what} from ${item.label}`);
  unlinkTargetId = null; // cancelling the next confirm lands on the normal view, Delete ready
  if (!(NODE_DETAIL[item.id]?.relations ?? []).some(rel => rel.blocksDelete)) deleteNode(item);
  else render();
}

async function unlinkOne(item, field, uri, experiment) {
  try {
    const res = await fetch("api/node", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: item.type, id: item.id, unlink: { field, uri }, ...(experiment ? { experiment } : {}) }),
    });
    const body = await res.json();
    if (!res.ok) { showToast(`Failed to unlink: ${body.error || res.status}`); return; }
    NODE_DETAIL[item.id] = { ...NODE_DETAIL[item.id], relations: body.relations };
    // The other side of the relation still has this node cached in ITS relations (unlinking
    // is two-sided even though the request is one PUT) — drop it so it refetches fresh next
    // time it's opened, instead of showing the removed link until a full page reload.
    invalidateNodeDetail(uri);
    if (experiment) invalidateNodeDetail(experiment); // its derived Species may have changed
    if (!body.relations.length) unlinkTargetId = null; // nothing left — Delete will work now
    renderDetail();
  } catch (err) {
    showToast(`Failed to unlink: ${err}`);
  }
}

async function applyCarryOver(picked) {
  const batches = new Map();
  picked.forEach(p => {
    const key = `${p.id.split("|").slice(0, 3).join("|")}`;
    const orig = carryOverOffer.items.find(x => `${x.id}|${x.experiment}|${x.field}|${x.value}` === p.id);
    if (!batches.has(key)) batches.set(key, { ...orig, uris: [] });
    batches.get(key).uris.push(orig.value);
  });
  let done = 0;
  for (const b of batches.values()) {
    try {
      const res = await fetch("api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: b.type, id: b.id, experiment: b.experiment, link: { field: b.field, uris: b.uris } }),
      });
      const body = await res.json();
      if (!res.ok) { showToast(`Set ${done}; failed on ${b.label}: ${body.error || res.status}`); break; }
      done += b.uris.length;
      invalidateNodeDetail(b.id);
      invalidateNodeDetail(b.experiment);
      b.uris.forEach(u => invalidateNodeDetail(u));
    } catch (err) {
      showToast(`Set ${done}; failed on ${b.label}: ${err}`);
      break;
    }
  }
  carryOverOffer = null;
  if (done === picked.length) showToast(`Saved ${done} change${done === 1 ? "" : "s"}`);
  render();
}

async function unlinkAll(item) {
  const node = NODE_DETAIL[item.id];
  const targets = (node?.relations ?? [])
    .filter(rel => rel.field)
    .flatMap(rel => rel.items.map(it => ({ field: rel.field, uri: it.id, type: it.type })));
  // Keep one link of a required type (e.g. a site's last organization) — OpenSILEX refuses
  // removing it, which would abort the loop halfway; the view then offers deleting instead.
  const required = CREATABLE[item.type]?.requiresLink;
  const keep = required ? targets.filter(t => t.type === required).pop() : null;
  for (const { field, uri } of targets.filter(t => t !== keep)) {
    const t = { field, uri };
    try {
      const res = await fetch("api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: item.type, id: item.id, unlink: t }),
      });
      const body = await res.json();
      if (!res.ok) { showToast(`Failed to unlink: ${body.error || res.status}`); return; }
      NODE_DETAIL[item.id] = { ...NODE_DETAIL[item.id], relations: body.relations };
      invalidateNodeDetail(t.uri); // see unlinkOne — the other side's cache is now stale too
    } catch (err) {
      showToast(`Failed to unlink: ${err}`);
      return;
    }
  }
  if (!NODE_DETAIL[item.id].relations.length) unlinkTargetId = null;
  renderDetail();
}

/* Selecting (plain/ctrl/shift click, or drag) NEVER changes the detail
   pane — only real navigation does (the › arrow, a breadcrumb crumb, or
   clicking a relation chip). In tree mode, the › arrow on a tree row opens
   a SEPARATE, local breadcrumb (`detailPath`) scoped to the right-hand
   pane only — the tree on the left (the base) never moves. This lets you
   follow a chain of relations out from any tree node without losing the
   selection overview you built. Outside tree mode, the › arrow still does
   a real, global navigation (`path`), same as before. */
function renderDetail() {
  const p = currentPane();
  const isOpenNode = p.id !== "root" && p.type !== "category";

  if (detailPath.length > 0) {
    renderNodeDetail(detailPath[detailPath.length - 1], { local: true });
    return;
  }

  if (isOpenNode) {
    renderNodeDetail(p, { local: false });
    return;
  }

  // A category page of a type with an explainer (TYPE_INFO) shows it above the usual message.
  const info = p.type === "category" ? typeInfoHtml(TYPE_FOR_CATEGORY[p.id]) : "";
  if (selection.size === 0) {
    els.detailBody.innerHTML = info + `<div class="detail-empty">Select a row, or click the &rsaquo; arrow to open one, to see its connections here.</div>`;
    wireTypeInfo(els.detailBody);
    return;
  }
  const names = [...selection.values()].map(n => escapeHtml(n.label)).join(", ");
  els.detailBody.innerHTML = info + `<div class="detail-empty"><span><b style="color:var(--ink); font-family:var(--font-mono);">${selection.size}</b>&nbsp;selected &mdash; ${names}<br><br>Use the buttons in the Selection pane to link or create something linked to ${selection.size > 1 ? "all of them" : "it"}, or click the &rsaquo; arrow on a row to open it.</span></div>`;
  wireTypeInfo(els.detailBody);
}

// Names come from PHIS, where any user can type anything, and this page acts as the server's
// account — so they're escaped before going into HTML. Not yet applied to every older
// innerHTML spot (rows, node title, confirms); see the spec's Known gaps.
const escapeHtml = v => String(v ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

function chipHtml(it, unlinkField, expId) {
  const e = escapeHtml;
  return `<span class="chip${selection.has(it.id) ? " selected" : ""}" style="${typeStyle(it.type)}" data-openid="${e(it.id)}" data-type="${e(it.type)}"${it.factor ? ` data-factor="${e(it.factor)}"` : ""}><span class="swatch"></span>${e(it.label)}${it.count ? ` <span style="opacity:.6">&middot; ${e(it.count)}</span>` : ""}`
    + (unlinkField ? `<button class="chip-unlink" data-field="${e(unlinkField)}" data-uri="${e(it.id)}"${expId ? ` data-exp="${e(expId)}"` : ""} title="Unlink">&times;</button>` : "")
    + `</span>`;
}
// One relation group. Items carrying `groups` (what the node is within that item) render as
// boxes; empty rows say "none". A box row with a `field` gets × on its chips in unlink mode.
// Adding goes through the selection (select the object and the value, then Link selection).
// `unlinkable` decides per item whether it gets an × (unlink mode only).
function relGroupHtml(rel, { unlinkable = () => false, unlinking = false, withMeasurements = false } = {}) {
  let h = `<div class="rel-group"><div class="rel-label">${escapeHtml(rel.label)}</div>`;
  if (!rel.items.length) return h + `<span class="rel-empty">${rel.emptyText || "None."}</span></div>`;
  const chip = it => chipHtml(it, rel.field && unlinkable(it) ? rel.field : null);
  if (rel.items.some(it => it.groups)) {
    rel.items.forEach(it => {
      h += `<div class="item-box"><div class="chip-row">${chip(it)}</div><div class="item-box-rows">`;
      // A scientific object's name in this experiment (each copy has its own), renamed here only.
      if (typeof it.name === "string") {
        h += `<span class="item-box-key">Name</span><div class="chip-row"><span>${escapeHtml(it.name)}</span>${unlinking ? "" : ` <button class="btn ghost small" data-rename-in="${escapeHtml(it.id)}">Rename</button>`}</div>`;
      }
      (it.groups || []).forEach(g => {
        const chips = g.items.map(x => chipHtml(x, unlinking && g.field ? g.field : null, it.id)).join("");
        h += `<span class="item-box-key">${escapeHtml(g.label)}</span><div class="chip-row">${chips || `<span class="rel-empty">none</span>`}</div>`;
      });
      h += `</div>`;
      // Filled in after render by loadMeasurements; removed again when the object has no values here.
      if (it.type === "experiment" && withMeasurements) h += `<div data-meas-exp="${escapeHtml(it.id)}"></div>`;
      h += `</div>`;
    });
    return h + `</div>`;
  }
  return h + `<div class="chip-row">${rel.items.map(chip).join("")}</div></div>`;
}

// An experiment's structure: its variables and its plants in a box per factor and level (a plant is
// listed under every factor it belongs to). The .hx elements are picked/opened by the pipeline in
// setupSelection; `on` = picked from this box, `also` = picked, but from another box.
function structureHtml(st) {
  const e = escapeHtml;
  const hx = (kind, it, extra, cls = "") => {
    const picked = selection.get(it.id);
    const state = kind === "plant"
      ? (picked ? ((picked.vias ?? [""]).includes(extra.via) ? " on" : " also") : "")
      : (picked ? " on" : "");
    const data = Object.entries(extra).map(([k, v]) => ` data-${k}="${e(v)}"`).join("");
    return `<span class="hx ${cls}${state}" data-hx="${kind}" data-id="${e(it.id)}" data-label="${e(it.label)}"${data}>`;
  };
  const plants = (list, via, fac) => list.length
    ? `<div class="hx-plants">${list.map(p => `${hx("plant", p, { via, fac }, "hx-plant")}${e(p.label)}</span>`).join("")}</div>`
    : `<div class="hx-note">no plants</div>`;
  let h = "";
  if (st.variables.length) {
    h += `<div class="rel-group"><div class="rel-label">Variables measured</div><div class="chip-row">`
      + st.variables.map(v => chipHtml({ id: v.id, type: "variable", label: v.label, count: v.count.toLocaleString("en") })).join("") + `</div></div>`;
  }
  h += `<div class="rel-group"><div class="rel-label">Scientific objects — by factor</div>`;
  if (st.truncated) h += `<div class="hx-note">PHIS returned only the first 500 objects of a list, so some plants are missing or sit in the wrong box here.</div>`;
  st.factors.forEach(f => {
    h += `<div class="hx-fac" data-fac="${e(f.id)}">${hx("factor", { id: f.id, label: f.label }, { fac: f.id }, "hx-head")}${e(f.label)} <small>${f.levels.length} level${f.levels.length === 1 ? "" : "s"}</small></span><div class="hx-levels">`;
    f.levels.forEach(l => {
      h += `<div class="hx-level" data-level="${e(l.id)}">${hx("level", l, { fac: f.id, factor: f.id }, "hx-head")}${e(l.label.replace(/^[^:]*:s*/, "Level "))} <small>${l.plants.length} plants</small></span>${plants(l.plants, l.id, f.id)}</div>`;
    });
    if (f.unset.length) h += `<div class="hx-level"><div class="hx-head" style="cursor:default">(unset) <small>${f.unset.length} without a level here</small></div>${plants(f.unset, `${f.id}#unset`, f.id)}</div>`;
    h += `</div></div>`;
  });
  if (st.other.length) h += `<div class="hx-fac" data-fac="#other"><div class="hx-head" style="cursor:default">Not in a factor <small>${st.other.length}</small></div>${plants(st.other, "#other", "#other")}</div>`;
  return h + `</div>`;
}

function renderNodeDetail(focusNode, { local } = { local: false }) {
  const node = NODE_DETAIL[focusNode.id] || null;
  const label = focusNode.label;
  const type = focusNode.type;

  let html = "";

  if (local) {
    html += `<div class="local-crumbs">`;
    detailPath.forEach((seg, i) => {
      if (i > 0) html += `<span class="crumb-sep">›</span>`;
      const isLast = i === detailPath.length - 1;
      html += isLast
        ? `<span class="local-crumb current">${escapeHtml(seg.label)}</span>`
        : `<button class="local-crumb" data-crumb="${i}">${escapeHtml(seg.label)}</button>`;
    });
    html += `</div>`;
  }

  const isCategoryMembers = type === "category";
  // Rename/Delete only appear once a real node-detail response has come back (`node` truthy —
  // set by loadNodeDetail on a 200) — that's the one reliable signal the backend actually
  // supports this type, same honesty rule the "+ New" menu follows for CREATABLE. Which buttons
  // show comes from node.actions (e.g. a move event can only be deleted).
  const canEdit = !isCategoryMembers && node;
  const actions = node?.actions ?? ["rename", "delete", "link"]; // same default as the backend
  const canRename = canEdit && actions.includes("rename");
  const canDelete = canEdit && actions.includes("delete");
  const blockers = canEdit ? (node.relations ?? []).filter(rel => rel.blocksDelete) : [];
  const unlinking = canEdit && unlinkTargetId === focusNode.id;
  // The button doesn't just delete when relations exist — it opens the unlink view instead —
  // so it says so upfront rather than promising a delete that's actually going to redirect.
  const hasRelations = canEdit && node.relations && node.relations.length > 0;
  // ...unless the type's delete simply takes its links along (and nothing blocks it).
  const deleteRedirects = hasRelations && (blockers.length > 0 || !node.deleteRemovesLinks);
  const deleteLabel = deleteRedirects ? "Unlink/Delete" : "Delete";
  // When Delete doesn't pass through unlink mode (deleteRemovesLinks), unlinking needs its own
  // way in — otherwise e.g. a scientific object could never be taken out of one experiment.
  const canUnlink = canEdit && !deleteRedirects && actions.includes("link") && (node.relations ?? []).some(rel => rel.field && rel.items.length);

  html += `
    <div class="node-card" style="${typeStyle(type)}">
      <div class="node-kicker"><span class="swatch"></span>${type === "category" ? "group" : typeName(type)}${node?.typeName ? ` · ${node.typeName}` : ""}</div>
      <div class="node-title-row">
        ${isCategoryMembers
          ? `<div class="node-title">${escapeHtml(label)}</div>`
          : `<button class="node-title self-chip${selection.has(focusNode.id) ? " selected" : ""}" id="selfChip" title="Click to select this ${typeName(type)} (ctrl/cmd-click adds it to the selection)">${escapeHtml(label)}</button>`}
        ${canRename ? `<button class="btn ghost small" id="renameNodeBtn">Rename</button>` : ""}
        ${canUnlink ? `<button class="btn ghost small" id="unlinkModeBtn">Unlink…</button>` : ""}
        ${canDelete ? `<button class="btn ${deleteRedirects ? "warn" : "ghost"} small" id="deleteNodeBtn">${deleteLabel}</button>` : ""}
      </div>
      ${node ? `<div class="node-uri">${escapeHtml(node.uri)}</div>` : ""}
      ${node?.facts?.length ? `<div class="node-facts">${node.facts.map(f => `<span><b>${escapeHtml(f.label)}</b> ${escapeHtml(f.value)}</span>`).join("")}</div>` : ""}
      ${node && "isPublic" in node ? `<div class="node-visibility">${node.isPublic ? "Public: every PHIS user can see it." : "Private: in PHIS, only admins and the people it's shared with see it."}</div>` : ""}
    </div>
  `;
  if (!isCategoryMembers) html += typeInfoHtml(type);
  if (node?.deleteBlocked && deleteBlockedShown === focusNode.id) {
    html += `<div class="unlink-intro">
      <span class="unlink-intro-text"><b>CAN'T DELETE HERE</b> — ${escapeHtml(label)} ${escapeHtml(node.deleteBlocked)}</span>
      <span class="unlink-intro-actions">${node.deleteFix ? `<button class="btn warn small" id="deleteFixBtn">${escapeHtml(node.deleteFix.label)}</button>` : ""}<button class="btn small" id="deleteBlockedOkBtn">${node.deleteFix ? "Cancel" : "OK"}</button></span>
    </div>`;
  }

  if (isCategoryMembers) {
    // A category isn't a resource with relations — it's a group. Show
    // what's actually inside it as a REAL selectable list (not read-only
    // chips), so ctrl+click here can pull one member back out of an
    // "all members" selection, same as anywhere else.
    html += `<div class="rel-group"><div class="rel-label">Members</div><div class="rowlist" id="detailMembers"></div></div>`;
  } else if (node && node.relations && node.relations.length) {
    if (unlinking) {
      // Delete was blocked by real relations: instead of a dead-end "Failed to delete"
      // toast, offer to remove them here — per item, or all at once — so Delete becomes
      // actionable instead of just failing. Only relation groups the backend marked
      // unlinkable (rel.field present — see node-types.ts) get an Unlink button; a
      // read-only relation (e.g. a facility's Devices, which live on the device's own
      // record) stays visible but not actionable, same honesty rule as everywhere else.
      const lastReq = lastRequiredLink(type, node);
      const anyUnlinkable = node.relations.some(rel => rel.field && rel.items.some(it => it.id !== lastReq?.id));
      const niceType = typeName(type);
      const blockerCount = blockers.flatMap(rel => rel.items).length;
      const blockerWhat = countOf(blockerCount, blockers.map(rel => rel.label));
      const them = blockerCount === 1 ? "it" : "them";
      html += `<div class="unlink-intro">
        <span class="unlink-intro-text">${blockers.length
          ? `<b>CAN'T DELETE YET</b> — ${escapeHtml(label)} still holds ${blockerWhat}. Deleting the ${niceType} with ${them} inside would leave ${them} orphaned in PHIS, so ${blockerCount === 1 ? "it has" : "they have"} to go first — remove one with its ×, or clear them all (anything also used by another experiment is only removed from this one).`
          : lastReq
          ? `<b>UNLINK MODE</b> — a ${niceType} must belong to at least one ${typeName(lastReq.type)}, so <b>${escapeHtml(lastReq.label)}</b> can't be unlinked. Delete the ${niceType} instead — that also removes every link below.`
          : node.deleteRemovesLinks
          ? `<b>UNLINK MODE</b> — remove any link below with its ×.`
          : `<b>UNLINK MODE</b> — delete is blocked while ${escapeHtml(label)} is still linked to the items below.`}</span>
        <span class="unlink-intro-actions">
          ${blockers.length ? `<button class="btn warn small" id="deleteBlockersBtn">Clear ${blockerWhat}…</button>` : ""}
          ${lastReq && !blockers.length ? `<button class="btn warn small" id="forceDeleteBtn">Delete ${niceType}</button>` : ""}
          ${anyUnlinkable ? `<button class="btn warn small" id="unlinkAllBtn">Unlink all</button>` : ""}
          <button class="btn warn small" id="cancelUnlinkBtn">Cancel</button>
        </span>
      </div>`;
      node.relations.forEach(rel => { html += relGroupHtml(rel, { unlinkable: it => it.id !== lastReq?.id, unlinking: true }); });
      if (!anyUnlinkable && !lastReq && !blockers.length) {
        html += `<div class="rel-group"><span style="color:var(--ink-faint); font-size:12.5px;">These can't be unlinked from here — nothing left to try automatically.</span></div>`;
      }
    } else {
      if (node.structure) html += structureHtml(node.structure);
      node.relations.forEach(rel => {
        if (node.structure && rel.field === "scientific_object") return; // shown as boxes above (unlink mode keeps the flat list)
        html += relGroupHtml(rel, { withMeasurements: type === "scientific_object" });
      });
    }
  } else {
    // Covers both "not loaded yet / unsupported type" (node === null) and "loaded, genuinely
    // no relations" (node.relations is empty) — same honest message either way.
    // ...except a type the backend has no detail view for (NODE_TYPES): say that, not "none".
    const msg = LINKABLE_TYPES.has(type) || type === "factor"
      ? "No connections found."
      : `This app can't show a ${typeName(type)}'s connections yet. Look it up in PHIS for now.`;
    html += `<div class="rel-group"><div class="rel-label">Relations</div><span style="color:var(--ink-faint); font-size:12.5px;">${msg}</span></div>`;
  }

  els.detailBody.innerHTML = html;
  wireTypeInfo(els.detailBody);

  if (isCategoryMembers) renderDetailMembers(focusNode.id);

  if (local) {
    els.detailBody.querySelectorAll(".local-crumb[data-crumb]").forEach(btn => {
      btn.addEventListener("click", () => {
        detailPath = detailPath.slice(0, Number(btn.dataset.crumb) + 1);
        renderDetail();
      });
    });
  }

  document.getElementById("renameNodeBtn")?.addEventListener("click", () => renameNode(focusNode));
  els.detailBody.querySelectorAll("[data-rename-in]").forEach(btn => btn.addEventListener("click", () => {
    const box = (node?.relations ?? []).flatMap(rel => rel.items).find(it => it.id === btn.dataset.renameIn && typeof it.name === "string");
    if (box) renameNode(focusNode, box);
  }));
  document.getElementById("deleteBlockedOkBtn")?.addEventListener("click", () => { deleteBlockedShown = null; renderDetail(); });
  // The way past the block: counted again right now (values may have been added since the page
  // opened), its own confirm, then the node is reloaded — Delete then works as usual.
  document.getElementById("deleteFixBtn")?.addEventListener("click", async () => {
    const item = focusNode;
    delete NODE_DETAIL[item.id];
    Object.keys(MEASUREMENTS).filter(k => k.startsWith(`${item.id}|`)).forEach(k => delete MEASUREMENTS[k]);
    await loadNodeDetail(item);
    const fix =NODE_DETAIL[item.id]?.deleteFix;
    if (!fix) { deleteBlockedShown = null; renderDetail(); return; }
    if (!confirm(fix.confirm)) { renderDetail(); return; }
    const res = await fetch(`api/node/delete-fix?type=${encodeURIComponent(item.type)}&id=${encodeURIComponent(item.id)}`, { method: "DELETE" });
    const body = await res.json().catch(() => ({}));
    delete NODE_DETAIL[item.id];
    await loadNodeDetail(item);
    deleteBlockedShown = NODE_DETAIL[item.id]?.deleteBlocked ? item.id : null;
    renderDetail();
    showToast(res.ok ? `Done. ${item.label} can be deleted now.` : (body.error || `It didn't work (${res.status}).`), 3000);
  });
  document.getElementById("deleteNodeBtn")?.addEventListener("click", () => deleteNode(focusNode));
  document.getElementById("unlinkModeBtn")?.addEventListener("click", () => { unlinkTargetId = focusNode.id; render(); });
  // The open node's own title is a chip too: however you navigated here (breadcrumb, chip, tree),
  // the node itself stays selectable. Same rules as rows — plain click replaces the selection
  // with just this node, ctrl/cmd toggles it in/out. (No navigate: you are already here.) Unlike
  // relation chips it does NOT jump into tree mode — the point is to pick up the node you are on
  // and keep browsing for the next thing; the chip and the action bar show the pick.
  document.getElementById("selfChip")?.addEventListener("click", (e) => {
