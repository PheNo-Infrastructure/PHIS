    const item = findItemById(focusNode.id) || focusNode;
    if (e.ctrlKey || e.metaKey) {
      if (selection.has(item.id)) selection.delete(item.id); else selection.set(item.id, item);
    } else {
      selection = new Map([[item.id, item]]);
    }
    anchorId = item.id;
    refreshLeftPane();
    renderDetail();
    renderActionbar();
  });

  if (unlinking) {
    els.detailBody.querySelectorAll(".chip-unlink").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        unlinkOne(focusNode, btn.dataset.field, btn.dataset.uri, btn.dataset.exp);
      });
    });
    document.getElementById("unlinkAllBtn")?.addEventListener("click", () => unlinkAll(focusNode));
    document.getElementById("forceDeleteBtn")?.addEventListener("click", () => deleteNode(focusNode, true));
    document.getElementById("deleteBlockersBtn")?.addEventListener("click", () => deleteBlockers(focusNode));
    document.getElementById("cancelUnlinkBtn").addEventListener("click", () => {
      unlinkTargetId = null;
      renderDetail();
    });
  }

  const onChipClick = (chip, e) => {
    {
      const id = chip.dataset.openid;
      const found = findItemById(id) || { id, type: chip.dataset.type, label: chip.textContent.trim(), ...(chip.dataset.factor ? { factor: chip.dataset.factor } : {}) };
      if (e.ctrlKey || e.metaKey) {
        toggleChipSelection(found);
        return;
      }
      // Plain click still just navigates — but not while unlinking, where the point is to
      // stay put and manage links, not wander off (the × button is the only action there).
      if (unlinking) return;
      if (local) {
        detailPath = [...detailPath, found];
        renderDetail();
        loadNodeDetail(found);
      } else {
        openRelatedNode(found);
      }
    }
  };
  els.detailBody.querySelectorAll(".chip[data-openid]").forEach(chip => chip.addEventListener("click", (e) => onChipClick(chip, e)));
  if (type === "scientific_object" && !unlinking) loadMeasurements(focusNode.id, focusNode.label, onChipClick);
}

// A plant's measured values in each experiment box: variables × scan dates, one row per variable
// with a small trend line. Asked for per object|experiment and kept for the session; the box is
// dropped when there is nothing to show. A variable's name behaves like a chip (onChipClick).
const MEASUREMENTS = {};
const UNIT_TEXT = { mm2: "mm²", mm3: "mm³" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const sig4 = n => String(Number(n.toPrecision(4)));

// One row per variable: name, a trend line that fills the row (hover = that scan's time and value,
// click = the full picture in a dialog), and the latest value.
const timeOf = k => Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), k.length > 10 ? +k.slice(11, 13) : 0, k.length > 10 ? +k.slice(14, 16) : 0);
const whenText = (key, at) => `${+key.slice(8, 10)} ${MONTHS[+key.slice(5, 7) - 1]} ${key.slice(0, 4)}${at ? " " + at : ""}`;
const unitText = u => UNIT_TEXT[u] || u;

// A variable's scans that have a value, placed 0-100 across and 0-100 down (0 = top) with a little margin.
function measurementPoints(data, v) {
  const pts = v.values.map((x, i) => x && Number.isFinite(x.v) ? { v: x.v, at: x.at, key: data.columns[i].key, t: timeOf(data.columns[i].key) } : null).filter(Boolean);
  const t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
  const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  pts.forEach(p => {
    p.x = 2 + 96 * (t1 === t0 ? 0.5 : (p.t - t0) / (t1 - t0));
    p.y = 12 + 76 * (hi === lo ? 0.5 : 1 - (p.v - lo) / (hi - lo));
  });
  return pts;
}

function chartHtml(pts, big) {
  const line = pts.length > 1 ? `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline vector-effect="non-scaling-stroke" points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}"/></svg>` : "";
  const dots = big || pts.length === 1 ? pts.map(p => `<span class="meas-pt" style="left:${p.x}%;top:${p.y}%"></span>`).join("") : "";
  return `${line}${dots}<span class="meas-dot"></span><span class="meas-tip"></span>`;
}

// Hovering a chart picks the nearest scan: its point lights up and a tip names the time and value.
function wireChart(chart, pts, unit) {
  const dot = chart.querySelector(".meas-dot"), tip = chart.querySelector(".meas-tip");
  const off = () => { dot.style.display = tip.style.display = "none"; };
  chart.addEventListener("mousemove", ev => {
    const r = chart.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * 100;
    const p = pts.reduce((a, b) => Math.abs(b.x - fx) < Math.abs(a.x - fx) ? b : a);
    dot.style.cssText = `display:block;left:${p.x}%;top:${p.y}%`;
    tip.textContent = `${whenText(p.key, p.at)} · ${sig4(p.v)}${unit ? " " + unit : ""}`;
    tip.style.cssText = `display:block;left:${p.x}%;transform:translateX(-${p.x}%)`;
  });
  chart.addEventListener("mouseleave", off);
  off();
}

function measurementsHtml(data) {
  const e = escapeHtml;
  return `<div class="meas-list">${data.variables.map((v, i) => {
    const pts = measurementPoints(data, v), unit = unitText(v.unit);
    return `<div class="meas-row"><div class="meas-name"><a data-openid="${e(v.id)}" data-type="variable">${e(v.name)}</a>${unit ? `<span class="meas-unit">${e(unit)}</span>` : ""}</div>`
      + (pts.length
        ? `<div class="meas-chart" data-var="${i}" title="Click for all values">${chartHtml(pts)}</div>`
        : `<div class="meas-chart none">no values</div>`)
      + `</div>`;
  }).join("")}</div>`;
}

// The full picture for one variable on one plant: a big chart, the numbers that summarise it, and every value.
function openMeasurementDialog(data, v, plantLabel, expLabel, onOpenVariable) {
  const e = escapeHtml, pts = measurementPoints(data, v), unit = unitText(v.unit);
  const vals = pts.map(p => p.v), mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const stat = (k, x) => `<div><span>${k}</span><b>${e(x)}</b></div>`;
  const dlg = document.createElement("dialog");
  dlg.className = "meas-dialog";
  dlg.innerHTML = `<div class="meas-dlg-head"><div><div class="meas-dlg-title">${e(v.name)}${unit ? `<span class="meas-unit">${e(unit)}</span>` : ""}</div>
      <div class="meas-dlg-sub">${e(plantLabel)} · ${e(expLabel)}</div></div><button class="btn ghost small" data-close>Close</button></div>
    <div class="meas-chart big">${chartHtml(pts, true)}<span class="meas-axis top">${sig4(Math.max(...vals))}</span><span class="meas-axis bottom">${sig4(Math.min(...vals))}</span></div>
    <div class="meas-axis-x"><span>${e(whenText(pts[0].key))}</span><span>${e(whenText(pts[pts.length - 1].key))}</span></div>
    <div class="meas-stats">${stat("Scans", pts.length)}${stat("Min", sig4(Math.min(...vals)))}${stat("Max", sig4(Math.max(...vals)))}${stat("Mean", sig4(mean))}${stat("First", sig4(vals[0]))}${stat("Latest", sig4(vals[vals.length - 1]))}</div>
    <div class="meas-values"><table><thead><tr><th>Date</th><th>Time</th><th>Value${unit ? ` (${e(unit)})` : ""}</th></tr></thead><tbody>${pts.map(p => `<tr><td>${e(whenText(p.key))}</td><td>${e(p.at)}</td><td>${e(p.v)}</td></tr>`).join("")}</tbody></table></div>
    <div class="meas-dlg-foot"><button class="btn ghost small" data-var>Open ${e(v.name)}</button></div>`;
  document.body.appendChild(dlg);
  wireChart(dlg.querySelector(".meas-chart"), pts, unit);
  dlg.addEventListener("click", ev => { if (ev.target === dlg || ev.target.closest("[data-close]")) dlg.close(); });
  dlg.querySelector("[data-var]").addEventListener("click", ev => { dlg.close(); onOpenVariable(ev); });
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
}

function loadMeasurements(objectId, objectLabel, onChipClick) {
  els.detailBody.querySelectorAll("[data-meas-exp]").forEach(async box => {
    const exp = box.dataset.measExp, key = `${objectId}|${exp}`;
    box.innerHTML = `<div class="meas-title">Measurements — loading…</div>`;
    if (!MEASUREMENTS[key]) {
      MEASUREMENTS[key] = fetch(`api/measurements?object=${encodeURIComponent(objectId)}&experiment=${encodeURIComponent(exp)}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
        .catch(() => { delete MEASUREMENTS[key]; return null; });
    }
    const data = await MEASUREMENTS[key];
    if (!box.isConnected) return;
    if (!data) { box.innerHTML = `<div class="meas-title">Measurements couldn't be loaded.</div>`; return; }
    if (!data.variables.length) { box.remove(); return; }
    box.innerHTML = `<div class="meas-title">Measurements — hover a line for a value, click it for all of them</div>${measurementsHtml(data)}`;
    const expLabel = box.closest(".item-box")?.querySelector(".chip")?.textContent.trim() ?? "";
    box.querySelectorAll("a[data-openid]").forEach(a => a.addEventListener("click", ev => onChipClick(a, ev)));
    box.querySelectorAll(".meas-chart[data-var]").forEach(chart => {
      const v = data.variables[Number(chart.dataset.var)], pts = measurementPoints(data, v), unit = unitText(v.unit);
      wireChart(chart, pts, unit);
      const nameLink = chart.closest(".meas-row").querySelector("a[data-openid]");
      chart.addEventListener("click", () => openMeasurementDialog(data, v, objectLabel, expLabel, ev => onChipClick(nameLink, ev)));
    });
  });
}

// Ctrl/meta-click on a relation chip adds (or removes) it from whatever's currently selected,
// without navigating and without disturbing the rest of the selection — same "never replace,
// just add" reasoning as picking a node from the simulated graph panel. Works from either the
// normal relations view or the unlink view, so a selection built up across several nodes'
// relations doesn't require leaving the detail pane at all.
function toggleChipSelection(item) {
  if (selection.has(item.id)) selection.delete(item.id);
  else selection.set(item.id, item);
  anchorId = item.id;
  refreshLeftPane();
  renderDetail();
  renderActionbar();
}

// ---- picks inside an experiment's factor boxes (.hx) ----
// A plant picked from a box is remembered with that box (`vias`); one picked from a list has none (""),
// so "the same plant picked twice" is simply more than one instance.
const plantInstances = it => it.vias ?? [""];

function hxItem(el) {
  const d = el.dataset;
  if (d.hx === "plant") return { id: d.id, type: "scientific_object", label: d.label };
  if (d.hx === "level") return { id: d.id, type: "factor_level", label: d.label, factor: d.factor };
  return { id: d.id, type: "factor", label: d.label };
}

// Adds or removes ONE instance of a plant (the copy clicked in `via`'s box).
function togglePlantVia(item, via) {
  const cur = selection.get(item.id);
  if (!cur) { selection.set(item.id, { ...item, vias: [via] }); return; }
  const vias = plantInstances(cur);
  if (vias.includes(via)) {
    const left = vias.filter(v => v !== via);
    if (left.length) selection.set(item.id, { ...cur, vias: left }); else selection.delete(item.id);
  } else {
    selection.set(item.id, { ...cur, vias: [...vias, via] });
  }
}

function hxAfterPick() { refreshLeftPane(); renderDetail(); renderActionbar(); }

// ctrl toggles one thing; shift picks the range, in reading order, between the anchor and this one
// among things of the same kind in the same factor box (anything else falls back to ctrl).
let hxAnchor = null; // the .hx element last clicked, by data
const hxKey = d => `${d.hx}|${d.fac}|${d.via ?? ""}|${d.id}`;
function hxPick(el, mod) {
  const item = hxItem(el);
  if (mod === "shift" && hxAnchor && hxAnchor.hx === el.dataset.hx && hxAnchor.fac === el.dataset.fac) {
    const all = [...document.querySelectorAll(`.hx[data-hx="${el.dataset.hx}"][data-fac="${CSS.escape(el.dataset.fac)}"]`)];
    const i = all.findIndex(x => hxKey(x.dataset) === hxAnchor.key), j = all.indexOf(el);
    if (i >= 0 && j >= 0) {
      selection = new Map();
      all.slice(Math.min(i, j), Math.max(i, j) + 1).forEach(x => {
        const it = hxItem(x);
        if (it.type === "scientific_object") togglePlantVia(it, x.dataset.via); else selection.set(it.id, it);
      });
      hxAfterPick();
      return;
    }
  }
  if (item.type === "scientific_object") togglePlantVia(item, el.dataset.via);
  else if (selection.has(item.id)) selection.delete(item.id); else selection.set(item.id, item);
  hxAnchor = { hx: el.dataset.hx, fac: el.dataset.fac, key: hxKey(el.dataset) };
  anchorId = item.id;
  hxAfterPick();
}

// A drag that started inside one factor box: picks the plants it crossed (or, if it crossed none, the
// level/factor headers) in that box only. Without ctrl it replaces the selection.
function hxSweep(hits, mod) {
  const plants = hits.filter(x => x.dataset.hx === "plant");
  const chosen = plants.length ? plants : hits;
  if (!chosen.length) return;
  if (mod !== "ctrl") selection = new Map();
  chosen.forEach(x => {
    const it = hxItem(x);
    if (it.type === "scientific_object") { const cur = selection.get(it.id); if (!cur || !plantInstances(cur).includes(x.dataset.via)) togglePlantVia(it, x.dataset.via); }
    else selection.set(it.id, it);
  });
  const last = chosen[chosen.length - 1];
  hxAnchor = { hx: last.dataset.hx, fac: last.dataset.fac, key: hxKey(last.dataset) };
  hxAfterPick();
}

// The selection is graph-only as soon as one plant is picked in more than one place (two boxes, or a
// list plus a box). Only charts make sense then: link/create/visibility would act on the same plant twice.
const isGraphOnly = () => [...selection.values()].some(v => v.type === "scientific_object" && plantInstances(v).length > 1);
function pickCounts() {
  let picks = 0, plants = 0;
  selection.forEach(v => { if (v.type === "scientific_object") { plants++; picks += plantInstances(v).length; } else picks++; });
  return { picks, plants };
}
function viaLabel(via) {
  if (via === "") return "the list";
  if (via === "#other") return "Not in a factor";
  const st = NODE_DETAIL[currentPane()?.id]?.structure;
  const level = st?.factors.flatMap(f => f.levels).find(l => l.id === via);
  if (level) return level.label;
  const unset = st?.factors.find(f => via === `${f.id}#unset`);
  return unset ? `${unset.label} (unset)` : via;
}
function dropExtraPicks() {
  selection.forEach((v, id) => {
    if (v.type === "scientific_object" && plantInstances(v).length > 1) {
      const first = plantInstances(v)[0];
      selection.set(id, first === "" ? (({ vias, ...rest }) => rest)(v) : { ...v, vias: [first] });
    }
  });
  hxAfterPick();
}

/* Real, selectable rows for a category's members — ctrl/shift-click
   resolves through the same global mousedown/mouseup pipeline as every
   other row (see addressableItems), so deselecting one out of an "all
   members" pick is just a normal ctrl+click here. */
function renderDetailMembers(categoryId) {
  const el = document.getElementById("detailMembers");
  if (!el) return;
  const members = CATEGORY_ITEMS[categoryId] || [];
  el.style.cssText = "max-height:none; overflow:visible; border:1px solid var(--border); border-radius:var(--radius);";

  if (!members.length) {
    el.innerHTML = `<div class="empty-hint">Nothing in this group yet.</div>`;
    return;
  }

  members.forEach(m => addressableItems.set(m.id, m));

  members.forEach(m => {
    const isSelected = m.type === "category" ? isCategoryFullySelected(m.id) : selection.has(m.id);
    const row = document.createElement("div");
    row.className = "row" + (isSelected ? " selected" : "");
    row.setAttribute("style", typeStyle(m.type));
    row.dataset.id = m.id;
    row.innerHTML = `
      <span class="row-dot"></span>
      <span class="row-main${m.type === "category" ? " stacked" : ""}">
        <span class="row-label">${escapeHtml(m.label)}</span>
        <span class="row-type">${m.type === "category" ? escapeHtml(m.hint ?? "") : typeName(m.type)}</span>
      </span>
      <button class="row-nav" title="Open" aria-label="Open ${escapeHtml(m.label)}">›</button>
    `;
    row.querySelector(".row-nav").addEventListener("click", (e) => {
      e.stopPropagation();
      detailPath = [...detailPath, m];
      renderDetail();
      loadNodeDetail(m);
    });
    el.appendChild(row);
  });
}

// Shared by both creation entry points — the selection-driven "+ New" menu (links = the
// current selection) and the standalone "+ New <type>" button on a category page with nothing
// selected (links = []). Handles the POST, auto-attaches the result into `selection` (so it's
// immediately visible and linkable to something else) and the category browser's
// CATEGORY_ITEMS, and reports success/failure via toast.
// Short explainers for types whose OpenSILEX behaviour isn't obvious, shown as a collapsible
// box on that type's category page and on each node of it. Open/closed is remembered per viewer.
const TYPE_INFO = {
  scientific_object: {
    title: "How scientific objects work",
    points: [
      "A scientific object can be in several experiments. What it is in each one — its germplasm, factor levels and what it is part of — is kept separately, so a change in one experiment never alters another.",
      "Creating one with several experiments selected creates it in all of them.",
      "Adding it to another experiment keeps everything else as it was; removing it (×) takes it out of that experiment only.",
      "One experiment can't have two scientific objects with the same name. Renaming isn't offered here yet for that reason.",
      "Each experiment has its own box showing what it is there. When it joins a new experiment it starts empty there, and you're offered to copy its germplasm over.",
      "Deleting it removes it from every experiment. Removing it from its last experiment keeps it, just not in any experiment.",
      "An experiment can't be deleted while scientific objects are still in it. Clearing them deletes the ones only in that experiment and just removes the ones shared with other experiments.",
    ],
  },
};
let typeInfoOpen = {};
try { typeInfoOpen = JSON.parse(localStorage.getItem("typeInfoOpen") || "{}"); } catch {}
function typeInfoHtml(type) {
  const info = TYPE_INFO[type];
  if (!info) return "";
  return `<details class="type-info" data-type="${type}"${typeInfoOpen[type] ? " open" : ""}>
    <summary>${info.title}</summary>
    <ul>${info.points.map(p => `<li>${p}</li>`).join("")}</ul>
  </details>`;
}
function wireTypeInfo(root) {
  root.querySelectorAll("details.type-info").forEach(d => d.addEventListener("toggle", () => {
    typeInfoOpen[d.dataset.type] = d.open;
    try { localStorage.setItem("typeInfoOpen", JSON.stringify(typeInfoOpen)); } catch {}
  }));
}

// Every creation entry point asks for its values through here: a plain name prompt for most
// types, or a small form when CREATABLE[type].fields lists more (e.g. an experiment's
// objective/start date). A field with input "select" is a dropdown whose options come from its
// `options` list endpoint ({id, label} rows — e.g. scientific-object classes), fetched on open.
// Resolves {name, fields}, or null if cancelled.
async function askCreateValues(type) {
  const nice = typeName(type);
  const extra = CREATABLE[type]?.fields;
  if (!extra) {
    const name = prompt(`Name for the new ${nice}?`);
    return name ? { name, fields: {} } : null;
  }
  const options = {};
  for (const fd of extra.filter(fd => fd.input === "select")) {
    if (Array.isArray(fd.options)) { options[fd.key] = fd.options; continue; } // the choices themselves
    try {
      const res = await fetch(fd.options);
      options[fd.key] = res.ok ? await res.json() : [];
    } catch { options[fd.key] = []; }
    if (!options[fd.key].length) { showToast(`Couldn't load the ${fd.label.toLowerCase()} list`); return null; }
  }
  const input = (fd) => fd.input === "select"
    ? `<select name="${fd.key}"${fd.required ? " required" : ""}><option value="">Choose…</option>${options[fd.key].map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.label)}</option>`).join("")}</select>`
    : fd.input === "lines"
      ? `<textarea name="${fd.key}" rows="4"${fd.required ? " required" : ""}></textarea>`
      : `<input name="${fd.key}" type="${fd.input || "text"}"${fd.required ? " required" : ""}>`;
  return new Promise((resolve) => {
    const dlg = document.createElement("dialog");
    dlg.className = "create-dialog";
    dlg.innerHTML = `<form method="dialog">
      <div class="ranking-header">New ${nice}</div>
      <label>Name<input name="name" required autofocus></label>
      ${extra.map(fd => `<label>${fd.label}${fd.required ? "" : " (optional)"}${input(fd)}</label>`).join("")}
      <div class="ranking-footer">
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Create</button>
      </div>
    </form>`;
    // Clicks inside must not reach the document-level "close menus" listeners.
    dlg.addEventListener("click", (e) => e.stopPropagation());
    dlg.addEventListener("close", () => {
      const ok = dlg.returnValue === "ok";
      const { name, ...rest } = Object.fromEntries(new FormData(dlg.querySelector("form")));
      dlg.remove();
      resolve(ok ? { name, fields: Object.fromEntries(Object.entries(rest).filter(([, v]) => v !== "")) } : null);
    });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

async function createNode(type, name, links, toastSuffix, fields = {}) {
  try {
    const res = await fetch("api/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, name, links, fields }),
    });
    const body = await res.json();
    if (!res.ok) {
      showToast(`Failed to create ${typeName(type)}: ${body.error || res.status}`);
      return;
    }
    selection.set(body.id, body);
    const categoryId = CATEGORY_FOR_TYPE[type];
    if (categoryId) (CATEGORY_ITEMS[categoryId] ||= []).push(body);
    if (type === "germplasm") reloadCategories(["cat-germplasm"]); // to sit under its species
    // Every linked-to node's cached relations are now stale too — same reasoning as linkItems,
    // just for /api/create's own `links` instead of /api/link's `items`. Without this, creating
    // e.g. a facility linked to an open organization left that organization's pane showing the
    // pre-creation relations until a full page reload.
    links.forEach((l) => invalidateNodeDetail(l.id));
    render();
    showToast(`Created ${body.label}${toastSuffix ? `, ${toastSuffix}` : ""}${body.warning ? ` — but ${body.warning}` : ""}`);
  } catch (err) {
    showToast(`Failed to create ${typeName(type)}: ${err}`);
  }
}

// "Link" makes sense for the WHOLE current selection, any size, any mix of types — same
// "everything selected gets linked" philosophy /api/create already uses when creating a new
// node from a multi-type selection, just applied to nodes that already exist. It only requires
// that at least one PAIR of distinct types present is actually resolvable: both in
// LINKABLE_TYPES (the backend knows how to own a field for these types at all — NOT the same
// as ADJACENT, which just says two types are conceptually related; e.g. organization can't own
// a link to a site even though ADJACENT still lists them) and adjacent per ADJACENT. A 4-
// facility + 1-organization selection has exactly one resolvable pair (facility, organization)
// — that's enough to enable the button; /api/link itself does the real per-pair resolution and
// batches same-type items into one PUT per owner (see routes/link.ts). Same-type-only
// selections (e.g. three organizations, nothing else) never resolve — which one is whose
// parent is ambiguous, matching linkFieldFor's server-side limitation.
// "Link selection", except when the selection is objects + germplasm only: then the button
// says what it will write ("Set Annika on 2 objects…"), so a leftover pick shows before clicking.
function linkSelectionLabel() {
  const items = [...selection.values()];
  const own = linkPlan().label; // a plan that says what it does (set a species, move devices)
  if (own) return own;
  const types = [...new Set(items.map(v => v.type))];
  if (types.length !== 2 || !inExperimentOnly(types[0], types[1])) return "Link selection";
  const objects = items.filter(v => v.type === "scientific_object");
  const values = items.filter(v => v.type !== "scientific_object");
  const what = values.length <= 2 ? andList(values.map(v => v.label)) : `${values.length} ${typeName(values[0].type, values.length)}`;
  return `Set ${what} on ${objects.length === 1 ? objects[0].label : `${objects.length} ${typeName("scientific_object", objects.length)}`}…`;
}

// What "Link selection" would do with the current selection (selection-first design):
//   rank — two or more of ONE parent/child type and nothing else -> the ranking list;
//   link — different types, and every item can link to at least one other selected item;
//   none — otherwise, with `why` naming what doesn't fit (so there's no silent dead end).
function linkPlan() {
  const items = [...selection.values()];
  if (items.length < 2) return { kind: "none" };
  const types = [...new Set(items.map(v => v.type))];
  const nice = t => typeName(t);
  if (types.length === 1 && types[0] === "germplasm") return germplasmPlan(items);
  if (types.length === 2 && types.includes("device") && types.includes("facility")) return movePlan(items);
  if (types.length === 1) {
    return RANKED_TYPES.has(types[0]) ? { kind: "rank" } : { kind: "none", why: `Two ${typeName(types[0], 2)} can't be linked to each other.` };
  }
  // An object holds one level per factor.
  const levels = items.filter(v => v.type === "factor_level");
  if (new Set(levels.map(l => l.factor)).size < levels.length) return { kind: "none", why: "Two levels of one factor can't both be on a scientific object — keep one." };
  const pairOk = (a, b) => a !== b && LINKABLE_TYPES.has(a) && LINKABLE_TYPES.has(b) && ((ADJACENT[a] || []).includes(b) || (ADJACENT[b] || []).includes(a) || inExperimentOnly(a, b));
  const misfit = items.find(v => !items.some(w => w !== v && pairOk(v.type, w.type)));
  return misfit
    ? { kind: "none", why: `${misfit.label} (${nice(misfit.type)}) can't be linked to anything else selected — remove it to link the rest.` }
    : { kind: "link" };
}

// Germplasm only: the one species (or variety) is set on the others — a species on varieties and
// accessions, a variety on accessions. Not unlinkable: a variety can't be without a species. A
// chip whose kind isn't known (from a plant's row) leaves the check to the server.
const GERMPLASM_RANK = { species: 3, variety: 2, accession: 1 };
// Devices + one facility: each device gets a Move there on a date asked at click time (its
// history is kept). Not unlinkable: a device leaves a facility by moving somewhere else.
function movePlan(items) {
  const facilities = items.filter(v => v.type === "facility");
  if (facilities.length !== 1) return { kind: "none", why: "A device is in one facility at a time — select one facility." };
  const devices = items.filter(v => v.type === "device");
  const what = devices.length <= 2 ? andList(devices.map(v => v.label)) : `${devices.length} devices`;
  return { kind: "link", noUnlink: true, askDate: facilities[0].label, label: `Move ${what} to ${facilities[0].label}…` };
}
function germplasmPlan(items) {
  const rank = v => GERMPLASM_RANK[v.kind] ?? 0;
  if (items.some(v => !v.kind)) return { kind: "link", noUnlink: true };
  const top = Math.max(...items.map(rank));
  const tops = items.filter(v => rank(v) === top);
  if (top < 2 || tops.length !== 1) return { kind: "none", why: "Select one species or variety, and the germplasm to set it on." };
  const rest = items.filter(v => v !== tops[0]);
  return { kind: "link", noUnlink: true, label: `Set ${tops[0].label} as ${tops[0].kind} of ${rest.length <= 2 ? andList(rest.map(v => v.label)) : `${rest.length} germplasm`}…` };
}

function selectionHasLinkablePair() {
  const types = [...new Set([...selection.values()].map(v => v.type))];
  for (let i = 0; i < types.length; i++) {
    for (let j = i + 1; j < types.length; j++) {
      if (!LINKABLE_TYPES.has(types[i]) || !LINKABLE_TYPES.has(types[j])) continue;
      if ((ADJACENT[types[i]] || []).includes(types[j]) || (ADJACENT[types[j]] || []).includes(types[i])) return true;
    }
  }
  return false;
}

// Shared by both link entry points: "Link selection" (items = the current selection as-is)
// and "Link existing" (items = the current selection PLUS one item picked from a searchable
// list of real candidates — see linkableExistingCandidates — so finding and linking a target
// doesn't require first navigating away to select it manually).
async function linkItems(items, experiments, extra = {}) {
  try {
    const res = await fetch("api/link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items, ...(experiments ? { experiments } : {}), ...extra }),
    });
    const body = await res.json();
    if (!res.ok) { showToast(`Failed to link: ${body.error || res.status}`); return; }
    if (body.needsExperiment) {
      const n = body.needsExperiment;
      const names = andList((n.notInAny || []).map(o => escapeHtml(o.label)));
      experimentChoice = n.placeOptions
        ? { what: "factor level", lone: n.notInAny, placeOptions: n.placeOptions, retry: () => linkItems(items),
            lonePrompt: `${names} ${n.notInAny.length === 1 ? "isn't" : "aren't"} in ${escapeHtml(n.placeOptions[0].label)}, where this factor level belongs. Add ${n.notInAny.length === 1 ? "it" : "them"} there first?` }
        : { what: "germplasm", lone: n.notInAny, experiments: n.experiments, objects: n.objects, retry: (exps) => linkItems(items, exps) };
      renderActionbar();
      return;
    }
    experimentChoice = null;
    (body.touched || []).forEach(id => invalidateNodeDetail(id));
    // A germplasm's species decides where it sits in the Germplasm list.
    if (items.every(it => it.type === "germplasm")) reloadCategories(["cat-germplasm"]);
    // Every involved node's cached relations are now potentially stale — drop them rather than
    // guess how the response maps onto each one. If one of them is the node currently open in
    // the detail pane, invalidateNodeDetail refetches it right away instead of leaving that
    // pane showing the pre-link state until the user navigates away and back.
    items.forEach(it => invalidateNodeDetail(it.id));
    const offers = [...(body.carryOver || []), ...(body.childOffer || [])];
    carryOverOffer = offers.length ? { items: offers } : null;
    render();
    const already = (body.alreadyLinked ? `, ${body.alreadyLinked} already linked` : "") + (body.skipped ? `, ${body.skipped} not in the picked experiment(s) — left as they were` : "");
    if (body.written?.length) {
      // Say exactly what went where — a leftover selection or an automatic choice is then visible.
      const w = body.written;
      const where = andList(w.flatMap(x => x.experiments));
      const why = w.every(x => x.only) ? ` — the only experiment ${w.length === 1 ? "it's" : "they're"} in` : "";
      showToast(`${andList(w.flatMap(x => x.values).map(labelOf))} set on ${andList(w.map(x => labelOf(x.id)))} in ${where}${why}${already}`);
    } else {
      showToast(`Linked ${body.linkedPairs} relation${body.linkedPairs === 1 ? "" : "s"}${already}`);
    }
  } catch (err) {
    showToast(`Failed to link: ${err}`);
  }
}

// "Unlink selection": asks the backend which links exist between the selected items, names
// every one in a confirm, and only then removes them (stopping at the first failure).
async function unlinkSelection(items) {
  const post = (confirm) => fetch("api/unlink", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: items.map(v => ({ type: v.type, id: v.id })), ...(confirm ? { confirm: true } : {}) }),
  });
  try {
    const res = await post(false);
    const body = await res.json();
    if (!res.ok) { showToast(`Failed to unlink: ${body.error || res.status}`); return; }
    if (!body.links.length) { showToast("These aren't linked to each other — nothing to remove."); return; }
    if (!confirm(`Remove ${body.links.length === 1 ? "this link" : `these ${body.links.length} links`}?\n\n${body.links.map(l => `• ${l}`).join("\n")}`)) return;
    const done = await post(true);
    const result = await done.json();
    items.forEach(it => invalidateNodeDetail(it.id));
    (result.touched || []).forEach(id => invalidateNodeDetail(id));
    render();
    showToast(done.ok
      ? `Removed: ${result.removed.join("; ")}`
      : `Removed ${result.removed?.length ?? 0}, then stopped at “${result.failed}”: ${result.error || done.status}`);
  } catch (err) {
    showToast(`Failed to unlink: ${err}`);
  }
}

async function linkParents(type, pairs, experiments) {
  try {
    const res = await fetch("api/parent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, pairs, ...(experiments ? { experiments } : {}) }),
    });
    const body = await res.json();
    if (!res.ok) { showToast(`Couldn't set what it is part of: ${body.error || res.status}`); return; }
    const retry = (exps) => linkParents(type, pairs, exps);
    if (body.needsExperiment?.noShared) {
      const ns = body.needsExperiment.noShared;
      const strong = t => `<span style="color:var(--ink); font-weight:600;">${escapeHtml(t)}</span>`;
      const options = new Map(ns.flatMap(n => n.parentExperiments).map(e => [e.id, { id: e.id, type: "experiment", label: e.label }]));
      experimentChoice = {
        what: "part of", retry, placeOptions: [...options.values()],
        lone: ns.map(n => ({ id: n.id, label: n.label })),
        lonePrompt: ns.length === 1
          ? `${strong(ns[0].label)} and ${strong(ns[0].parentLabel)} aren't in the same experiment, and “part of” is set per experiment. Add ${strong(ns[0].label)} to one of ${strong(ns[0].parentLabel)}'s experiments first?`
          : `${ns.length} ${typeName("scientific_object", ns.length)} aren't in an experiment with their parent, and “part of” is set per experiment. Add them to one of their parent's experiments first?`,
      };
      renderActionbar();
      return;
    }
    if (body.needsExperiment) {
      const n = body.needsExperiment;
      experimentChoice = { what: "part of", lone: [], experiments: n.experiments, objects: n.objects, retry };
      renderActionbar();
      return;
    }
    experimentChoice = null;
    (body.touched || []).forEach(id => invalidateNodeDetail(id));
    pairs.forEach(p => { invalidateNodeDetail(p.child); invalidateNodeDetail(p.parent); });
    render();
    const skippedNote = body.skipped ? `; ${body.skipped} not in the picked experiment(s) — left as they were` : "";
    const w = body.written || [];
    showToast(w.length === 1
      ? `${labelOf(w[0].child)} is now part of ${labelOf(w[0].parent)} in ${andList(w[0].experiments)}${w[0].only ? " — the only experiment both are in" : ""}${skippedNote}`
      : `Set what ${w.length} ${typeName("scientific_object", w.length)} are part of: ${w.map(x => `${labelOf(x.child)} in ${labelOf(x.parent)} (${andList(x.experiments)})`).join("; ")}${skippedNote}`);
  } catch (err) {
    showToast(`Couldn't set what it is part of: ${err}`);
  }
}

// Which types could be linked TO the current selection as a real existing resource — same
// intersection rule creatableTypesFor already uses for "+ New" (a candidate type must be
// adjacent to EVERY selected item), further restricted to LINKABLE_TYPES on both sides (the
// candidate AND every already-selected type), and excluding any type already present in the
// selection — EXCEPT when everything selected is one parent/child type (RANKED_TYPES): then
// more of that type can be gathered, and "Link selection" settles direction in the ranking list.
// Types whose same-type links are parent/child, settled in the ranking modal (never guessed).
const RANKED_TYPES = new Set(["organization", "scientific_object"]);
function linkableExistingTypes() {
  const selectedTypes = [...selection.values()].map(v => v.type);
  if (!selectedTypes.length || !selectedTypes.every(t => LINKABLE_TYPES.has(t))) return new Set();
  // Same-type candidates too when everything selected is one parent/child type — so more can be
  // gathered before "Link selection" opens the ranking list.
  const oneRanked = new Set(selectedTypes).size === 1 && RANKED_TYPES.has(selectedTypes[0]);
  const candidates = creatableTypesFor(selectedTypes);
  return new Set([...candidates].filter(t => LINKABLE_TYPES.has(t) && (oneRanked || !selectedTypes.includes(t))));
}

// ---------------- link-ranking modal ----------------
// Resolves organization<->organization direction by drag-and-drop instead of guessing: the
// anchor sits fixed in the middle, candidates start in the Children zone, and can be dragged
// above the anchor (Parents) or left below (Children). Selecting several rows first (same
// click/ctrl/shift rules as every other list) and dragging one of them moves the whole group.
let linkRanking = null; // { anchor, parents: Map(id->item), children: Map(id->item), selectedIds: Set, shiftAnchorId }

function enterLinkRanking(anchor, items) {
  linkRanking = { anchor, parents: new Map(), children: new Map(items.map(it => [it.id, it])), selectedIds: new Set(), shiftAnchorId: null };
  renderLinkRankingModal();
}

function exitLinkRanking() {
  linkRanking = null;
  renderLinkRankingModal();
}

function renderLinkRankingModal() {
  const overlay = document.getElementById("linkRankingOverlay");
  if (!overlay) return;
  if (!linkRanking) {
    overlay.innerHTML = "";
    overlay.classList.remove("open");
    return;
  }
  overlay.classList.add("open");
  const { anchor, parents, children, selectedIds } = linkRanking;
  const allIds = [...parents.keys(), ...children.keys()];
  // Objects have one parent ("part of", inside an experiment); organizations can have several.
  const oneParent = anchor.type === "scientific_object";

  const zoneHtml = (map, zoneKey, label) => {
    const items = [...map.values()];
    return `<div class="ranking-zone" data-zone="${zoneKey}">
      <div class="ranking-zone-label">${label} (${items.length})</div>
      ${items.map(it => `
        <div class="ranking-row${selectedIds.has(it.id) ? " selected" : ""}" draggable="true" data-id="${escapeHtml(it.id)}" style="${typeStyle(it.type)}">
          <span class="swatch"></span>${escapeHtml(it.label)}
          <button class="make-anchor" data-anchor="${escapeHtml(it.id)}" title="Make this the anchor">make anchor</button>
        </div>
      `).join("") || `<div class="ranking-empty">Drop here</div>`}
    </div>`;
  };

  overlay.innerHTML = `
    <div class="ranking-backdrop" id="rankingBackdrop"></div>
    <div class="ranking-modal">
      <div class="ranking-header">
        <span>What is ${escapeHtml(anchor.label)} part of, and what is part of it?</span>
        <button class="ranking-close" id="rankingClose" title="Cancel">&times;</button>
      </div>
      <p class="ranking-hint">Drag a row <b>above</b> the line if ${escapeHtml(anchor.label)} is part of it (its parent), or leave/drop it <b>below</b> if it is part of ${escapeHtml(anchor.label)}.${oneParent ? " A scientific object has one parent at most: dropping another above swaps it out. It is set within an experiment both are in." : ""} Any row can be the anchor: drag it onto the middle, or use “make anchor”. Click, ctrl-click, or shift-click to select several first and drag them together.</p>
      ${zoneHtml(parents, "parents", `${escapeHtml(anchor.label)} is part of`)}
      <div class="ranking-anchor" data-zone="anchor"><span class="swatch"></span>${escapeHtml(anchor.label)}<span class="ranking-anchor-tag">anchor</span></div>
      ${zoneHtml(children, "children", `Part of ${escapeHtml(anchor.label)}`)}
      <div class="ranking-footer">
        <button class="btn ghost" id="rankingCancel">Cancel</button>
        <button class="btn primary" id="rankingConfirm">Confirm ${allIds.length} relation${allIds.length === 1 ? "" : "s"}</button>
      </div>
    </div>
  `;

  overlay.querySelectorAll(".ranking-row").forEach((row) => {
    const id = row.dataset.id;
    row.addEventListener("click", (e) => {
      // Same click/ctrl/shift rules as the main rowlist and the link picker: plain click
      // replaces, ctrl toggles one in/out, shift range-selects (also replacing).
      if (e.shiftKey && linkRanking.shiftAnchorId && allIds.includes(linkRanking.shiftAnchorId)) {
        const lo = Math.min(allIds.indexOf(linkRanking.shiftAnchorId), allIds.indexOf(id));
        const hi = Math.max(allIds.indexOf(linkRanking.shiftAnchorId), allIds.indexOf(id));
        linkRanking.selectedIds = new Set(allIds.slice(lo, hi + 1));
      } else if (e.ctrlKey || e.metaKey) {
        if (linkRanking.selectedIds.has(id)) linkRanking.selectedIds.delete(id);
        else linkRanking.selectedIds.add(id);
      } else {
        linkRanking.selectedIds = new Set([id]);
      }
      linkRanking.shiftAnchorId = id;
      renderLinkRankingModal();
    });
    row.addEventListener("dragstart", (e) => {
      // Dragging a row that's part of the current selection moves the whole group; dragging
      // an unselected row moves just that one (and becomes the new selection).
      const dragIds = linkRanking.selectedIds.has(id) ? [...linkRanking.selectedIds] : [id];
      linkRanking.selectedIds = new Set(dragIds);
      e.dataTransfer.setData("text/plain", JSON.stringify(dragIds));
      e.dataTransfer.effectAllowed = "move";
    });
  });

  // Flexible anchor: the chosen row becomes the anchor, the old anchor drops in as a child.
  const makeAnchor = (id) => {
    const item = linkRanking.parents.get(id) || linkRanking.children.get(id);
    if (!item) return;
    linkRanking.parents.delete(id);
    linkRanking.children.delete(id);
    linkRanking.children.set(linkRanking.anchor.id, linkRanking.anchor);
    linkRanking.anchor = item;
    linkRanking.selectedIds = new Set();
    renderLinkRankingModal();
  };
  overlay.querySelectorAll(".make-anchor").forEach((btn) => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); makeAnchor(btn.dataset.anchor); });
  });
  const anchorEl = overlay.querySelector(".ranking-anchor");
  anchorEl.addEventListener("dragover", (e) => { e.preventDefault(); anchorEl.classList.add("drag-over"); });
  anchorEl.addEventListener("dragleave", () => anchorEl.classList.remove("drag-over"));
  anchorEl.addEventListener("drop", (e) => {
    e.preventDefault();
    const ids = JSON.parse(e.dataTransfer.getData("text/plain") || "[]");
    if (ids.length) makeAnchor(ids[0]); // one anchor: the first of a dragged group
  });

  overlay.querySelectorAll(".ranking-zone").forEach((zone) => {
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      const ids = JSON.parse(e.dataTransfer.getData("text/plain") || "[]");
      const target = zone.dataset.zone === "parents" ? linkRanking.parents : linkRanking.children;
      const other = zone.dataset.zone === "parents" ? linkRanking.children : linkRanking.parents;
      ids.forEach((dragId) => {
        const item = linkRanking.parents.get(dragId) || linkRanking.children.get(dragId);
        if (!item) return;
        other.delete(dragId);
        target.set(dragId, item);
      });
      // One parent for objects: the last one dropped stays, any other goes back to children.
      if (linkRanking.anchor.type === "scientific_object" && linkRanking.parents.size > 1) {
        const keep = ids.filter(id => linkRanking.parents.has(id)).pop();
        [...linkRanking.parents.entries()].filter(([id]) => id !== keep).forEach(([id, it]) => { linkRanking.parents.delete(id); linkRanking.children.set(id, it); });
      }
      renderLinkRankingModal();
    });
  });

  document.getElementById("rankingClose").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingCancel").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingBackdrop").addEventListener("click", exitLinkRanking);
  document.getElementById("rankingConfirm").addEventListener("click", confirmLinkRanking);
}

async function confirmLinkRanking() {
  const { anchor, parents, children } = linkRanking;
  const parentIds = [...parents.keys()];
  const childItems = [...children.values()];
  const total = parentIds.length + childItems.length;
  exitLinkRanking();
  if (!total) return;
  if (anchor.type === "scientific_object") {
    // "part of" lives inside an experiment — explicit pairs, the backend finds the shared one.
    const pairs = [...parentIds.map(p => ({ child: anchor.id, parent: p })), ...childItems.map(c => ({ child: c.id, parent: anchor.id }))];
    return linkParents(anchor.type, pairs);
  }
  try {
    if (parentIds.length) {
      // Every dragged-to-Parents org goes into ONE PUT on the anchor (batched, same as
      // /api/link already does for same-field items — not one call per parent).
      const res = await fetch("api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "organization", id: anchor.id, link: { field: "parents", uris: parentIds } }),
      });
      if (!res.ok) { const b = await res.json().catch(() => ({})); showToast(`Failed to link: ${b.error || res.status}`); return; }
      invalidateNodeDetail(anchor.id);
      parentIds.forEach((id) => invalidateNodeDetail(id));
    }
    // Each dragged-to-Children org owns its OWN "parents" field — can't batch across
    // different owners into one PUT, so this is one call per child.
    for (const child of childItems) {
      const res = await fetch("api/node", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "organization", id: child.id, link: { field: "parents", uris: [anchor.id] } }),
      });
      if (!res.ok) { const b = await res.json().catch(() => ({})); showToast(`Failed to link: ${b.error || res.status}`); return; }
      invalidateNodeDetail(child.id);
    }
    invalidateNodeDetail(anchor.id);
    render();
    showToast(`Ranked ${total} ${typeName("organization", total)} relative to ${anchor.label}`);
  } catch (err) {
    showToast(`Failed to link: ${err}`);
  }
}

// The picker only answers the app's questions now (linkPickerMode set): which experiment,
// carry-over, the anchor of a requiresLink create. Gathering a selection is the search bar's job.
function linkPickerCandidatesByType() {
  if (!linkPickerMode) return new Map();
  return new Map([[linkPickerMode.type, (linkPickerMode.items || CATEGORY_ITEMS[CATEGORY_FOR_TYPE[linkPickerMode.type]] || []).filter(it => !linkPickerMode.exclude?.has(it.id))]]);
}

// Renders the picker popover body in place, without touching the rest of the action bar —
// called on open and on every pick/filter inside it. Every question locks it to one type
// (linkPickerType); items are picked with the SAME click/ctrl/shift rules as the main rowlist's
// applyClick: plain click replaces the pick set with just that row, ctrl toggles one row in/out
// without touching the rest, shift range-selects between the last-picked row and this one —
// scoped to the currently visible (filtered) list.
function renderLinkPicker() {
  const body = document.getElementById("linkPickerBody");
  const footer = document.getElementById("linkPickerFooter");
  if (!body || !footer) return;
  const byType = linkPickerCandidatesByType();
  body.innerHTML = "";

  const filterInput = document.createElement("input");
  filterInput.className = "linkmenu-search";
  filterInput.type = "text";
  filterInput.placeholder = `Search ${typeName(linkPickerType)}…`;
  filterInput.addEventListener("click", (e) => e.stopPropagation());
  body.appendChild(filterInput);

  const listEl = document.createElement("div");
  listEl.className = "linkmenu-items";
  body.appendChild(listEl);

  const items = byType.get(linkPickerType) || [];
  const paintRows = (filterText) => {
    const q = filterText.trim().toLowerCase();
    const visible = q ? items.filter((it) => it.label.toLowerCase().includes(q)) : items;
    const visibleIds = visible.map((it) => it.id);
    listEl.innerHTML = "";
    if (!visible.length) {
      listEl.innerHTML = `<span style="padding:8px; font-size:12.5px; color:var(--ink-faint);">No matches.</span>`;
      return;
    }
    // Same click/ctrl/shift rules as every other list; picks only join the selection.
    visible.slice(0, 200).forEach((it) => {
      const row = document.createElement("button");
      row.className = "newmenu-item" + (linkPickerPicked.has(it.id) ? " selected" : "");
      row.setAttribute("style", typeStyle(it.type));
      row.innerHTML = `<span class="swatch"></span>${escapeHtml(it.label)}`;
      row.addEventListener("click", (e) => {
        // Same click/ctrl/shift rules as the main rowlist's applyClick: plain click REPLACES
        // the pick set with just this one, ctrl toggles it in/out without touching the rest,
        // shift range-selects between the last-picked anchor and this row (also replacing,
        // not adding to, whatever was picked before — matching the main list's shift branch).
        if (e.shiftKey && linkPickerShiftAnchor && visibleIds.includes(linkPickerShiftAnchor)) {
          const lo = Math.min(visibleIds.indexOf(linkPickerShiftAnchor), visibleIds.indexOf(it.id));
          const hi = Math.max(visibleIds.indexOf(linkPickerShiftAnchor), visibleIds.indexOf(it.id));
          linkPickerPicked = new Map();
          visibleIds.slice(lo, hi + 1).forEach((id) => {
            const found = visible.find((x) => x.id === id);
            if (found) linkPickerPicked.set(id, found);
          });
        } else if (e.ctrlKey || e.metaKey) {
          if (linkPickerPicked.has(it.id)) linkPickerPicked.delete(it.id);
          else linkPickerPicked.set(it.id, it);
        } else {
          linkPickerPicked = new Map([[it.id, it]]);
        }
        linkPickerShiftAnchor = it.id;
        paintRows(filterInput.value);
        renderLinkPickerFooter();
      });
      listEl.appendChild(row);
    });
  };
  paintRows("");
  filterInput.addEventListener("input", () => paintRows(filterInput.value));

  renderLinkPickerFooter();
}

function renderLinkPickerFooter() {
  const footer = document.getElementById("linkPickerFooter");
  if (!footer) return;
  footer.innerHTML = "";
  if (!linkPickerPicked.size) return;
  const btn = document.createElement("button");
  btn.className = "btn primary linkmenu-confirm";
  btn.textContent = linkPickerMode.confirmLabel(linkPickerPicked.size);
  btn.addEventListener("click", () => {
    const { onConfirm } = linkPickerMode;
    const picked = [...linkPickerPicked.values()];
    document.getElementById("linkMenu")?.classList.remove("open");
    linkPickerMode = null;
    linkPickerType = null;
    linkPickerPicked = new Map();
    linkPickerShiftAnchor = null;
    onConfirm(picked);
  });
  footer.appendChild(btn);
}

// The picker popover's markup + open/close wiring, used by the app's questions (experiment
// choice, carry-over, requiresLink create). `onOpen` runs on each open, after the pick state is reset.
function linkMenuHtml(buttonHtml, title) {
  return `
    <div class="newmenu" id="linkMenu">
      ${buttonHtml}
      <div class="newmenu-list linkmenu-list" id="linkList">
        <div class="linkmenu-top">
          <span class="linkmenu-title">${title}</span>
          <button class="linkmenu-x" id="linkMenuClose" title="Close">&times;</button>
        </div>
        <div id="linkPickerBody"></div>
        <div class="linkmenu-footer" id="linkPickerFooter"></div>
      </div>
    </div>`;
}
function wireLinkMenu(buttonId, onOpen) {
  const linkMenu = document.getElementById("linkMenu");
  document.getElementById(buttonId).addEventListener("click", async (e) => {
    e.stopPropagation();
    linkMenu.classList.toggle("open");
    if (linkMenu.classList.contains("open")) {
      // Fresh picking session each time the popover opens.
      linkPickerMode = null;
      linkPickerType = null;
      linkPickerPicked = new Map();
      linkPickerShiftAnchor = null;
      await onOpen();
      if (linkMenu.classList.contains("open")) renderLinkPicker();
    }
  });
  // Without this, clicking anywhere inside the popover (search box, a row, the footer
  // button) would bubble to the document-level "close on next click" listener below and
  // collapse it before the click's own handler (pick/confirm) gets to run.
  document.getElementById("linkList").addEventListener("click", (e) => e.stopPropagation());
  document.getElementById("linkMenuClose").addEventListener("click", () => linkMenu.classList.remove("open"));
  document.addEventListener("click", () => linkMenu.classList.remove("open"), { once: true });
}

function renderActionbar() {

    e.stopPropagation();
    menu.classList.toggle("open");
  });
  document.addEventListener("click", () => menu.classList.remove("open"), { once: true });
}

function render() {
