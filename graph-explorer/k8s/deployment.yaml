apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-explorer
  template:
    metadata:
      labels:
        app: graph-explorer
    spec:
      containers:
        - name: graph-explorer
          image: phisacr.azurecr.io/graph-explorer:latest
          ports:
            - containerPort: 4000
          # PHIS_USER / PHIS_PASS come from the secret. PHIS_HOST can be any OpenSILEX URL.
          envFrom:
            - secretRef:
                name: graph-explorer-env
          env:
            - name: PHIS_HOST
              value: http://opensilex.phis-test.svc.cluster.local
            - name: BASE_PATH
              value: /portal
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4000
