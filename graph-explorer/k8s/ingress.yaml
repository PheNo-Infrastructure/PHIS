# Served at phis.pheno.no/portal (BASE_PATH in deployment.yaml must match the path).
# No tls section: like any other path on this host, it uses the phis.pheno.no certificate from
# the OpenSILEX ingress. No use-regex/rewrite: use-regex would apply to every path on the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graph-explorer
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: graph-explorer-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "PHIS Graph Explorer"
    # Imports stream progress for minutes and upload instrument ZIPs.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: phis.pheno.no
      http:
        paths:
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: graph-explorer
                port:
                  number: 80
