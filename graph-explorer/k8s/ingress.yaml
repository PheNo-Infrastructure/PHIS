# Served at phis.pheno.no/portal (BASE_PATH in deployment.yaml must match the path).
# No tls section: like any other path on this host, it uses the phis.pheno.no certificate from
# the OpenSILEX ingress. No use-regex/rewrite: use-regex would apply to every path on the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graph-explorer
  annotations:
    # Open on purpose (2026-10, decided with the owner): it talks to the phis-test instance, whose data can be reset (demo:reset).
    # It was behind basic auth (auth-type / auth-secret graph-explorer-basic-auth); put those annotations back to close it again.
    # Imports stream progress for minutes and upload instrument ZIPs; every request body is capped at 60m (the import route itself refuses over 50 MB) since nobody is logged in.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
spec:
  ingressClassName: nginx
  rules:
    - host: phis.pheno.no
      http:
        paths:
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: graph-explorer
                port:
                  number: 80
