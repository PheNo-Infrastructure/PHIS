# Apply the entire stack with: kubectl apply -k k8s/
# Resources are applied in the order listed.
# K8s processes them all, but actual startup order is governed by
# the StatefulSet readinessProbe and the initContainers in OpenSILEX.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: phis

resources:
  - namespace.yaml
  - mongodb/service.yaml
  - mongodb/externalsecret.yaml
  - mongodb/statefulset.yaml
  - graphdb/pvc.yaml
  - graphdb/service.yaml
  - graphdb/externalsecret.yaml
  - graphdb/nginx-config.yaml
  - graphdb/deployment.yaml
  - graphdb-init/job.yaml
  - opensilex/externalsecret.yaml
  - opensilex/service.yaml
  - opensilex/deployment.yaml
  - opensilex-init/job.yaml

# Generates a ConfigMap with a content-hash suffix so any change to
# opensilex.yml automatically triggers a pod rollout via the Deployment
# spec reference changing.
configMapGenerator:
  - name: opensilex-config
    files:
      - opensilex/opensilex.yml
