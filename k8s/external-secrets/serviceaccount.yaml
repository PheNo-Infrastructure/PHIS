# This ServiceAccount is the Kubernetes side of the Workload Identity trust bridge.
# The annotation tells the Azure Workload Identity webhook to swap the projected
# K8s token for an Azure AD token scoped to the managed identity in Terraform.
#
# ${ESO_IDENTITY_CLIENT_ID} is substituted by Flux at reconcile time from the
# phis-tf-outputs ConfigMap created by 04-bootstrap.ps1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: "${ESO_IDENTITY_CLIENT_ID}"
