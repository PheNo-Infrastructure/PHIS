# ClusterSecretStore: cluster-scoped, so ExternalSecrets in any namespace
# (including "phis") can reference it.
#
# authType: WorkloadIdentity — no stored credentials. ESO uses the token
# injected by the Azure Workload Identity webhook into its pod.
#
# ${KEY_VAULT_URI} is substituted by Flux from the phis-tf-outputs ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${KEY_VAULT_URI}"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
