apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "0.10.*"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # Label required by the Azure Workload Identity webhook.
    # The webhook injects the projected SA token into pods with this label.
    podLabels:
      azure.workload.identity/use: "true"
