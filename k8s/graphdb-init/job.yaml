apiVersion: batch/v1
kind: Job
metadata:
  name: graphdb-init
  namespace: phis
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: graphdb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: graphdb-init
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for GraphDB to be ready..."
              until curl -sf http://graphdb:7200/rest/repositories > /dev/null 2>&1; do
                echo "  GraphDB not ready yet, retrying in 10s..."
                sleep 10
              done

              echo "Enabling GraphDB security..."
              if curl -sf http://graphdb:7200/rest/security | grep -q "^true$"; then
                echo "Security already enabled."
              else
                curl -sf -X POST http://graphdb:7200/rest/security \
                  -H "Content-Type: application/json" \
                  -d "true"
                echo "Security enabled."
              fi

              echo "Checking if repository 'opensilex' already exists..."
              if curl -sf -u "admin:${GDB_ADMIN_PASSWORD}" http://graphdb:7200/rest/repositories/opensilex > /dev/null 2>&1; then
                echo "Repository 'opensilex' already exists. Nothing to do."
                exit 0
              fi

              echo "Creating GraphDB repository 'opensilex'..."
              curl -sf -u "admin:${GDB_ADMIN_PASSWORD}" -X POST http://graphdb:7200/rest/repositories \
                -H "Content-Type: multipart/form-data" \
                -F "config=@/tmp/repo-config.ttl" \
                -w "\nHTTP status: %{http_code}\n"

              echo "Repository created successfully."
          env:
            - name: GDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphdb-credentials
                  key: admin-password
          volumeMounts:
            - name: repo-config
              mountPath: /tmp/repo-config.ttl
              subPath: repo-config.ttl
      volumes:
        - name: repo-config
          configMap:
            name: graphdb-repo-config
---
# The repository config is stored as a ConfigMap so it lives in git
# and is applied declaratively with the rest of the stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphdb-repo-config
  namespace: phis
data:
  repo-config.ttl: |
    @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
    @prefix rep:  <http://www.openrdf.org/config/repository#> .
    @prefix sr:   <http://www.openrdf.org/config/repository/sail#> .
    @prefix sail: <http://www.openrdf.org/config/sail#> .

    [] a rep:Repository ;
       rep:repositoryID "opensilex" ;
       rdfs:label "OpenSILEX Repository" ;
       rep:repositoryImpl [
          rep:repositoryType "graphdb:SailRepository" ;
          sr:sailImpl [
             sail:sailType "graphdb:Sail" ;
             <http://www.ontotext.com/config/graphdb#ruleset> "empty" ;
             <http://www.ontotext.com/config/graphdb#storage-folder> "opensilex" ;
             <http://www.ontotext.com/config/graphdb#entity-index-size> "10000000" ;
             <http://www.ontotext.com/config/graphdb#entity-id-size> "32" ;
             <http://www.ontotext.com/config/graphdb#enable-literal-index> "true" ;
             <http://www.ontotext.com/config/graphdb#check-for-inconsistencies> "false" ;
             <http://www.ontotext.com/config/graphdb#disable-sameAs> "true"
          ]
       ] .
