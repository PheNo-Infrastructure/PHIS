---
# Managed Disk StorageClass with Retain reclaim policy.
# Use this instead of managed-csi (which defaults to Delete) for any PVC
# that holds persistent data. Deleting the PVC will NOT delete the disk.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-retain
provisioner: disk.csi.azure.com
parameters:
  skuname: StandardSSD_LRS
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

# These StorageClasses use the Azure Blob CSI driver (blob.csi.azure.com).
# The blob driver must be enabled on the AKS cluster — see terraform/aks.tf
# storage_profile { blob_driver_enabled = true }.
#
# resourceGroup and storageAccount must match var.resource_group_name
# and var.storage_account_name in terraform/variables.tf.
#
# reclaimPolicy: Retain — deleting a PVC does NOT delete the blob container
# or its contents. Data survives cluster deletion as long as the storage
# account (in phis-rg, not the MC_ node resource group) is intact.

---
# For OpenSILEX application data. OpenSILEX runs as root (uid=0) so no uid
# mapping is needed. blobfuse2 v2.5.3 does not support --uid/--gid/--file-mode
# CLI flags; the mount is root-owned and root can write directly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azureblob-fuse2-phis
provisioner: blob.csi.azure.com
parameters:
  resourceGroup: phis-rg
  storageAccount: phistfstate
  skuName: Standard_LRS
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - --allow-other
  - --file-cache-timeout=120

---
# For backup CronJob PVs. No uid/gid override — backup jobs run as root.
# file-cache-timeout=0 disables caching so backup files are visible immediately.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azureblob-fuse2-backup
provisioner: blob.csi.azure.com
parameters:
  resourceGroup: phis-rg
  storageAccount: phistfstate
  skuName: Standard_LRS
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - --allow-other
  - --file-cache-timeout=0
