# HelmRepository tells Flux where to find the Helm chart.
# Think of it like adding a package registry — this one is the
# official Prometheus community registry.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
