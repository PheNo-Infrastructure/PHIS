# Blackbox exporter — a tiny Prometheus exporter that actively probes an HTTP
# endpoint (like a curl health check) and exposes the result (up/down, latency,
# status code) as metrics. Unlike the exporters in the main kube-prometheus-stack
# chart, which only read Kubernetes-internal state (pod status, node stats),
# this is what actually checks "is phis.pheno.no really answering requests".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
            method: GET
