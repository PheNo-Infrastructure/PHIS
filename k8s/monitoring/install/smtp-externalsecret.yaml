# Alertmanager (namespace: monitoring) can't mount the opensilex-credentials
# secret directly — it lives in the phis namespace and Kubernetes secrets
# can't be mounted across namespaces. This pulls the same SMTP credentials
# from Key Vault into a copy scoped to monitoring.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp-credentials
    creationPolicy: Owner
  data:
    - secretKey: smtp-password
      remoteRef:
        key: smtp-password
