apiVersion: batch/v1
kind: Job
metadata:
  name: portal-graphdb-init
  namespace: phis
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for GraphDB..."
              until curl -sf -u "admin:${GDB_ADMIN_PASSWORD}" \
                http://graphdb:7200/rest/repositories > /dev/null; do
                sleep 5
              done

              echo "Checking whether the 'portal' user already exists..."
              EXISTS=$(curl -s -u "admin:${GDB_ADMIN_PASSWORD}" \
                http://graphdb:7200/rest/security/users | grep -c "\"username\":\"${GDB_PORTAL_USER}\"" || true)

              if [ "$EXISTS" = "0" ]; then
                echo "Creating '${GDB_PORTAL_USER}' user..."
                curl -sf -X POST \
                  -u "admin:${GDB_ADMIN_PASSWORD}" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"username\": \"${GDB_PORTAL_USER}\",
                    \"password\": \"${GDB_PORTAL_PASSWORD}\",
                    \"grantedAuthorities\": [\"ROLE_USER\", \"READ_REPO_opensilex\"]
                  }" \
                  "http://graphdb:7200/rest/security/users/${GDB_PORTAL_USER}"
              else
                echo "'${GDB_PORTAL_USER}' user exists — syncing password to current secret..."
                curl -sf -X PUT \
                  -u "admin:${GDB_ADMIN_PASSWORD}" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"username\": \"${GDB_PORTAL_USER}\",
                    \"password\": \"${GDB_PORTAL_PASSWORD}\",
                    \"grantedAuthorities\": [\"ROLE_USER\", \"READ_REPO_opensilex\"]
                  }" \
                  "http://graphdb:7200/rest/security/users/${GDB_PORTAL_USER}"
              fi
              echo "Portal user ready."
          env:
            - name: GDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphdb-credentials
                  key: admin-password
            - name: GDB_PORTAL_USER
              valueFrom:
                secretKeyRef:
                  name: graphdb-portal-credentials
                  key: graphdb-portal-user
            - name: GDB_PORTAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphdb-portal-credentials
                  key: graphdb-portal-password
