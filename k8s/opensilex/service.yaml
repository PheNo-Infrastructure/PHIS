# Public LoadBalancer: exposes only the web UI port (8666).
# On AKS, run "kubectl get service opensilex -n phis" to see EXTERNAL-IP.
# The dns-label annotation makes AKS attach the label to the public IP so
# phis-opensilex.norwayeast.cloudapp.azure.com resolves to the LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: opensilex
  namespace: phis
spec:
  type: ClusterIP
  selector:
    app: opensilex
  ports:
    - name: http
      port: 8666
      targetPort: 8666
---
# Admin port (8667) on ClusterIP only — never exposed to the internet.
# Access via: kubectl port-forward -n phis svc/opensilex-admin 8667:8667
apiVersion: v1
kind: Service
metadata:
  name: opensilex-admin
  namespace: phis
spec:
  type: ClusterIP
  selector:
    app: opensilex
  ports:
    - name: admin
      port: 8667
      targetPort: 8667
