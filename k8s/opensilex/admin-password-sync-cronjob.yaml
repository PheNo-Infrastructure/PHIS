# Makes Azure Key Vault the source of truth for the OpenSILEX admin password.
#
# OpenSILEX has no "reset password" mechanism reachable from outside the app
# (the deployment's `user add --admin ... || true` is a no-op once the admin
# exists), so a KV change never reaches the running system on its own. This
# CronJob closes that gap: it bcrypts the KV-sourced password (ESO syncs it
# into secret `opensilex-credentials`) and writes it straight into GraphDB as
# the admin account's `os-sec:hasPasswordHash`.
#
# Flow:  KV phis-kv/opensilex-admin-password
#          -> ESO (refreshInterval 1h) -> secret opensilex-credentials/admin-password
#          -> this CronJob (hourly)     -> GraphDB set/user hasPasswordHash
#
# Consequences:
#  - To change the admin password, set it in Key Vault. Nothing else.
#    It takes effect within ~1-2h (ESO refresh + next run).
#  - A password changed in the OpenSILEX UI reverts to the KV value on the
#    next run. KV is the only knob, by design.
#  - The job gates nothing: if it fails, OpenSILEX keeps running on the
#    current password and the run retries next hour.
#
# ponytail: unconditional re-hash every run (new bcrypt salt each time, so the
# hash triple churns hourly even when unchanged). Harmless at this graph size;
# add a checksum-skip if the revision churn ever matters.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensilex-admin-password-sync
  namespace: phis
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: opensilex-admin-password-sync
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: httpd:2.4-alpine   # provides htpasswd + busybox wget + base64
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  ADMIN_EMAIL="admin@opensilex.org"
                  GRAPH="https://phis.pheno.no/set/user"
                  GDB="http://graphdb:7200/repositories/opensilex"

                  # bcrypt(cost 12) the KV-sourced password; normalise $2y$ -> $2a$
                  # (OpenSILEX writes $2a$; the digest bytes are identical, only the
                  #  version tag differs, and favre-bcrypt verifies either).
                  HASH=$(htpasswd -bnBC 12 "" "$OPENSILEX_ADMIN_PASSWORD" \
                           | tr -d '\r\n' | sed 's/^://; s/^\$2y\$/\$2a\$/')
                  case "$HASH" in
                    \$2a\$12\$*) [ "${#HASH}" -eq 60 ] || { echo "FATAL: bcrypt length ${#HASH} != 60: $HASH" >&2; exit 1; } ;;
                    *) echo "FATAL: unexpected bcrypt output: $HASH" >&2; exit 1 ;;
                  esac

                  AUTH="Authorization: Basic $(printf '%s' "admin:$GDB_ADMIN_PASSWORD" | base64 | tr -d '\n')"

                  UPDATE="PREFIX os-sec: <http://www.opensilex.org/security#>
                  PREFIX foaf: <http://xmlns.com/foaf/0.1/>
                  DELETE { GRAPH <$GRAPH> { ?a os-sec:hasPasswordHash ?old } }
                  INSERT { GRAPH <$GRAPH> { ?a os-sec:hasPasswordHash \"$HASH\" } }
                  WHERE  { GRAPH <$GRAPH> { ?a foaf:accountName \"$ADMIN_EMAIL\" .
                                            OPTIONAL { ?a os-sec:hasPasswordHash ?old } } }"

                  if wget -q -O- \
                       --header="$AUTH" \
                       --header="Content-Type: application/sparql-update" \
                       --post-data="$UPDATE" \
                       "$GDB/statements" >/dev/null; then
                    echo "hasPasswordHash updated for $ADMIN_EMAIL"
                  else
                    echo "FATAL: SPARQL update rejected (wget exit $?)" >&2
                    exit 1
                  fi

                  N=$(wget -q -O- \
                        --header="Content-Type: application/sparql-query" \
                        --post-data="PREFIX os-sec: <http://www.opensilex.org/security#>
                          PREFIX foaf: <http://xmlns.com/foaf/0.1/>
                          SELECT (COUNT(*) AS ?n) WHERE { GRAPH <$GRAPH> {
                            ?a foaf:accountName \"$ADMIN_EMAIL\" ; os-sec:hasPasswordHash ?h } }" \
                        "$GDB" | tr -cd '0-9' | head -c 3)
                  echo "admin hasPasswordHash triples now: ${N:-?}"
                  [ "$N" = "1" ] || echo "WARN: expected exactly 1 hash triple"
                  echo "admin password synced from Key Vault."
              env:
                - name: OPENSILEX_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensilex-credentials
                      key: admin-password
                - name: GDB_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: graphdb-credentials
                      key: admin-password
              resources:
                requests:
                  cpu: "20m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
