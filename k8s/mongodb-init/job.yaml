apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: phis
spec:
  ttlSecondsAfterFinished: 86400
  # Job retries up to 10 times with exponential backoff.
  # Retries cover the window while MongoDB is starting up.
  backoffLimit: 10
  template:
    spec:
      # OnFailure: restart the container (not a new pod) on non-zero exit.
      restartPolicy: OnFailure
      containers:
        - name: mongodb-init
          image: mongo:6.0
          command:
            - mongosh
            - --host
            # Use the StatefulSet pod's stable DNS, not "mongodb".
            # MongoDB stores this string as the replica set member identity.
            - mongodb-0.mongodb.phis.svc.cluster.local:27017
            - --eval
            - |
              try {
                var status = rs.status();
                print('Replica set already initialized, state: ' + status.myState);
              } catch(e) {
                print('Initializing replica set...');
                rs.initiate({
                  _id: 'opensilex',
                  members: [{ _id: 0, host: 'mongodb-0.mongodb.phis.svc.cluster.local:27017' }]
                });
                print('Replica set initialized.');
              }
