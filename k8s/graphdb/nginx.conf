events {}
http {
  server {
    listen 7201;

    # OpenSILEX system install tries to PUT a repository config with rdf4j:LmdbStore,
    # which GraphDB rejects. Return 204 so install proceeds to ontology loading.
    location ~ ^/repositories/[^/]+/config$ {
      if ($request_method ~ "^(PUT|POST)$") {
        return 204;
      }
      proxy_pass http://127.0.0.1:7200;
      proxy_http_version 1.1;
      # $http_host preserves the port (graphdb:7200). Plain $host drops it, which
      # makes GraphDB emit transaction Location headers of http://graphdb (port 80)
      # -> a black-hole address that hangs every write forever.
      proxy_set_header Host $http_host;
    }

    location / {
      proxy_pass http://127.0.0.1:7200;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_read_timeout 1800s;
      proxy_connect_timeout 10s;
    }
  }
}
