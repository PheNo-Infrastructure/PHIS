apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphdb
  namespace: phis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphdb
  # Recreate: kills the old pod fully before starting the new one.
  # Required because the PVC is ReadWriteOnce — two pods cannot
  # mount it simultaneously, which RollingUpdate would attempt.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: graphdb
    spec:
      containers:
        - name: graphdb
          image: ontotext/graphdb:10.6.4
          env:
            - name: GDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphdb-credentials
                  key: admin-password
            - name: GDB_JAVA_OPTS
              value: >-
                -Xmx5g -Xms512m
                -Dgraphdb.home=/opt/graphdb/home
                -Dgraphdb.workbench.cors.enable=false
          ports:
            - containerPort: 7200
          readinessProbe:
            tcpSocket:
              port: 7200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 7200
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
          volumeMounts:
            - name: graphdb-data
              mountPath: /opt/graphdb/home

        # Sidecar: intercepts PUT /repositories/*/config so OpenSILEX system install
        # doesn't fail with "Unsupported Sail type: rdf4j:LmdbStore".
        # Containers in the same pod share localhost — nginx proxies 7201 → 7200.
        - name: graphdb-proxy
          image: nginx:alpine
          ports:
            - containerPort: 7201
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: graphdb-data
          persistentVolumeClaim:
            claimName: graphdb-data
        - name: nginx-config
          configMap:
            name: graphdb-nginx-config
