# __LB_IP__ and __NS__ are substituted by scripts/test-env.sh before apply.
# OpenSILEX validates the Host header against its publicURI — they must match.
apiVersion: batch/v1
kind: Job
metadata:
  name: opensilex-init
  namespace: __NS__
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: opensilex-init
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              OPENSILEX_URL="http://opensilex:80"
              ADMIN_EMAIL="admin@opensilex.org"

              echo "Waiting for OpenSILEX REST API..."
              until curl -sf -H "Host: __LB_IP__" "$OPENSILEX_URL/rest/core/system/info" > /dev/null 2>&1; do
                echo "  Not ready, retrying in 15s..."
                sleep 15
              done
              echo "OpenSILEX is ready."

              echo "Authenticating as $ADMIN_EMAIL..."
              AUTH_RESPONSE=$(curl -sf -X POST "$OPENSILEX_URL/rest/security/authenticate" \
                -H "Host: __LB_IP__" \
                -H "Content-Type: application/json" \
                -d "{\"identifier\":\"$ADMIN_EMAIL\",\"password\":\"$OPENSILEX_ADMIN_PASSWORD\"}") || true

              TOKEN=$(echo "$AUTH_RESPONSE" | sed -n 's/.*"token" *: *"\([^"]*\)".*/\1/p')

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Could not authenticate."
                exit 1
              fi
              echo "Authenticated."

              echo "Checking for 'Default profile'..."
              PROFILES=$(curl -sf -X GET "$OPENSILEX_URL/rest/security/profiles?name=Default+profile" \
                -H "Host: __LB_IP__" \
                -H "Authorization: Bearer $TOKEN") || true

              if echo "$PROFILES" | grep -q '"name":"Default profile"'; then
                echo "'Default profile' already exists."
              else
                echo "Creating 'Default profile'..."
                RESPONSE=$(curl -sf -X POST "$OPENSILEX_URL/rest/security/profiles" \
                  -H "Host: __LB_IP__" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"name":"Default profile","description":"Default permissions for Feide/OpenID users","credentials":[]}') || true
                # credentials:[] = no permissions. After deployment, manually grant credentials
                # via Admin UI → Security → Profiles → Default profile. To automate, query
                # GET /rest/security/credentials to get valid URIs and add them here.

                if echo "$RESPONSE" | grep -q '"result"'; then
                  echo "'Default profile' created successfully."
                else
                  echo "WARNING: Unexpected response creating 'Default profile': $RESPONSE"
                fi
              fi

              echo "Checking for 'Users' group..."
              GROUPS=$(curl -sf -X GET "$OPENSILEX_URL/rest/security/groups?name=Users" \
                -H "Host: __LB_IP__" \
                -H "Authorization: Bearer $TOKEN") || true

              if echo "$GROUPS" | grep -q '"name":"Users"'; then
                echo "'Users' group already exists."
              else
                echo "Creating 'Users' group..."
                RESPONSE=$(curl -sf -X POST "$OPENSILEX_URL/rest/security/groups" \
                  -H "Host: __LB_IP__" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"name":"Users","description":"Default group for Feide/OpenID users","user_profiles":[]}') || true

                if echo "$RESPONSE" | grep -q '"result"'; then
                  echo "'Users' group created successfully."
                else
                  echo "WARNING: Unexpected response creating 'Users' group: $RESPONSE"
                fi
              fi

              echo "Init complete."
          env:
            - name: OPENSILEX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensilex-credentials
                  key: admin-password
