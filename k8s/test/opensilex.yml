# __LB_IP__ is substituted by scripts/test-env.ps1 before apply.

server:
  publicURI: "http://__LB_IP__/"

ontologies:
  baseURI: "http://__LB_IP__/"
  baseURIAlias: "phis"
  sparql:
    config:
      serverURI: "http://graphdb:7200"
      repository: "opensilex"
      maxConnections: 10
      connectionTimeout: 30000
      readTimeout: 60000
      queryTimeout: 120000

big-data:
  mongodb:
    implementation: org.opensilex.nosql.mongodb.MongoDBService
    config:
      host: "mongodb"
      port: 27017
      database: "opensilex"
      authentication:
        implementation: org.opensilex.nosql.mongodb.auth.password.PasswordMongoAuthentication
        config:
          login: "opensilex"
          password: "${MONGO_APP_PASSWORD}"
          authDB: "admin"

file-system:
  fs:
    config:
      defaultFS: "local"
      connections:
        local:
          implementation: org.opensilex.fs.local.LocalFileSystemConnection
          config:
            basePath: "/home/opensilex/data/files"

security:
  email:
    config:
      enable: false
  openID:
    enable: true
    scopes: ["openid", "userid", "profile", "email", "userinfo-name", "userinfo-mail"]
    userIdClaim: "sub"
    userNameClaim: "name"
    userEmailClaim: "https://n.feide.no/claims/eduPersonPrincipalName"
    userFirstNameClaim: "given_name"
    userLastNameClaim: "family_name"
    providerURI: "https://auth.dataporten.no"
    redirectURI: "http://__LB_IP__/app/openid"
    clientID: "${FEIDE_CLIENT_ID}"
    clientSecret: "${FEIDE_CLIENT_SECRET}"
    connectionTitle:
      en: "Login with Feide"
      no: "Logg inn med Feide"
