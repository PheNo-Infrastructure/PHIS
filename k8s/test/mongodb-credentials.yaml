# Generate keyfile with: openssl rand -base64 756 | tr -d '\n'
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: phis-test
type: Opaque
stringData:
  root-password: REPLACE_WITH_MONGO_ROOT_PASSWORD
  opensilex-password: REPLACE_WITH_MONGO_APP_PASSWORD
  keyfile: REPLACE_WITH_KEYFILE
