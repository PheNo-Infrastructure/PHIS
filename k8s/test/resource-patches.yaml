apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphdb
spec:
  template:
    spec:
      containers:
        - name: graphdb
          resources:
            requests:
              cpu: "100m"
              memory: "3Gi"
            limits:
              memory: "3Gi"
          env:
            - name: GDB_JAVA_OPTS
              value: >-
                -XX:MaxRAMPercentage=80 -Xms256m
                -Dgraphdb.home=/opt/graphdb/home
                -Dgraphdb.workbench.cors.enable=false
        - name: graphdb-proxy
          resources:
            requests:
              cpu: "10m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensilex
spec:
  template:
    spec:
      containers:
        - name: opensilex
          resources:
            requests:
              cpu: "100m"
              memory: "2Gi"
            limits:
              memory: "2Gi"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  template:
    spec:
      containers:
        - name: mongodb
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              memory: "1Gi"
