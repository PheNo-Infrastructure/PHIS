apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: "3.*.*"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    createNamespace: true
  values:
    admissionController:
      replicas: 1
      webhookConfiguration:
        failurePolicy: Fail
