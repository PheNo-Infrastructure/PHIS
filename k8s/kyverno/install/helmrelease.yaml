apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      # Pinned: 3.10 refuses to install while kyverno.io ClusterPolicy objects exist
      # (our PVC delete block). Migrate the policy before upgrading.
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    createNamespace: true
  values:
    admissionController:
      replicas: 1
      webhookConfiguration:
        failurePolicy: Fail
