apiVersion: batch/v1
kind: Job
metadata:
  name: opensilex-init
  namespace: phis
spec:
  # Auto-delete 24h after completion so FluxCD can re-create it on cluster reset.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: opensilex-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: opensilex-init
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              OPENSILEX_URL="http://opensilex:8666"
              ADMIN_EMAIL="admin@opensilex.org"

              echo "Waiting for OpenSILEX REST API..."
              until curl -sf -H "Host: phis.pheno.no" "$OPENSILEX_URL/rest/core/system/info" > /dev/null 2>&1; do
                echo "  Not ready, retrying in 15s..."
                sleep 15
              done
              echo "OpenSILEX is ready."

              echo "Authenticating as $ADMIN_EMAIL..."
              AUTH_RESPONSE=$(curl -sf -X POST "$OPENSILEX_URL/rest/security/authenticate" \
                -H "Host: phis.pheno.no" \
                -H "Content-Type: application/json" \
                -d "{\"identifier\":\"$ADMIN_EMAIL\",\"password\":\"$OPENSILEX_ADMIN_PASSWORD\"}") || true

              TOKEN=$(echo "$AUTH_RESPONSE" | sed -n 's/.*"token" *: *"\([^"]*\)".*/\1/p')

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Could not authenticate. Check opensilex-admin-password in Key Vault."
                exit 1
              fi
              echo "Authenticated."

              create_if_missing() {
                local endpoint="$1" name="$2" body="$3"
                local existing resp
                existing=$(curl -sf -G "$OPENSILEX_URL$endpoint" \
                  -H "Host: phis.pheno.no" \
                  -H "Authorization: Bearer $TOKEN" \
                  --data-urlencode "name=$name") || true
                if echo "$existing" | grep -q "\"name\":\"$name\""; then
                  echo "'$name' already exists."
                  return
                fi
                resp=$(curl -sf -X POST "$OPENSILEX_URL$endpoint" \
                  -H "Host: phis.pheno.no" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$body") || true
                if echo "$resp" | grep -q '"result"'; then
                  echo "'$name' created."
                else
                  echo "WARNING: Unexpected response for '$name': $resp"
                fi
              }

              # credentials:[]/user_profiles:[] — grant permissions via Admin UI after deploy
              create_if_missing /rest/security/profiles "Default profile" \
                '{"name":"Default profile","description":"Default permissions for Feide/OpenID users","credentials":[]}'
              create_if_missing /rest/security/groups "Users" \
                '{"name":"Users","description":"Default group for Feide/OpenID users","user_profiles":[]}'
              create_if_missing /rest/security/profiles "Researcher profile" \
                '{"name":"Researcher profile","description":"Full access profile for invited researchers","credentials":[]}'
              create_if_missing /rest/security/groups "Researchers" \
                '{"name":"Researchers","description":"Invited researchers with full access","user_profiles":[]}'

              echo "Init complete."
          env:
            - name: OPENSILEX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensilex-credentials
                  key: admin-password
