apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: "4.*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    createNamespace: true
  values:
    controller:
      service:
        # Use the static IP previously assigned to the production VM.
        # The IP was moved to MC_phis-rg_phis-cluster_norwayeast so AKS can claim it.
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-ipv4: "172.211.86.191"
        externalTrafficPolicy: Local
