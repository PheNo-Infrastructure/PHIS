apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: "4.*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    createNamespace: true
  values:
    controller:
      service:
        # Use the static IP previously assigned to the production VM.
        # The IP was moved to MC_phis-rg_phis-cluster_norwayeast so AKS can claim it.
        # azure-pip-name + azure-pip-resource-group bypass the IP-address search and
        # give the cloud controller an exact resource reference, avoiding case-mismatch
        # issues that occur when the controller uppercases the resource group name.
        annotations:
          service.beta.kubernetes.io/azure-pip-name: "phis-debian12-TEST-ip"
          service.beta.kubernetes.io/azure-pip-resource-group: "MC_phis-rg_phis-cluster_norwayeast"
        externalTrafficPolicy: Local
