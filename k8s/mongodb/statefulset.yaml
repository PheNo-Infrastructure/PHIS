apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: phis
spec:
  serviceName: mongodb    # must match the headless Service name above
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          command:
            - mongod
            - --replSet
            - opensilex
            - --port
            - "27017"
            - --bind_ip_all
          ports:
            - containerPort: 27017
          # readinessProbe: K8s equivalent of Docker Compose healthcheck.
          # Traffic is only sent to the pod once this passes.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: mongodb-config
              mountPath: /data/configdb
  # volumeClaimTemplates: StatefulSet-specific feature.
  # Each pod gets its OWN PVC generated from this template (named
  # mongodb-data-mongodb-0, mongodb-config-mongodb-0, etc.).
  # The PVCs survive pod deletion — data persists across restarts.
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: mongodb-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
