apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: phis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: mongodb-credentials   # must match secretKeyRef.name in statefulset.yaml
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: mongodb-root-password
    - secretKey: opensilex-password
      remoteRef:
        key: mongodb-opensilex-password
    - secretKey: keyfile
      remoteRef:
        key: mongodb-keyfile
