apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-manager
  namespace: phis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-manager
  namespace: phis
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-manager
  namespace: phis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-manager
subjects:
  - kind: ServiceAccount
    name: snapshot-manager
    namespace: phis
