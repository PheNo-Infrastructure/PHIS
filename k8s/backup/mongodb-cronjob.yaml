apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: phis
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: mongodb-backup
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 999
          containers:
            - name: mongodump
              image: mongo:6.0
              command:
                - sh
                - -c
                - |
                  set -e
                  FILENAME="/backup/$(date +%Y%m%d-%H%M).gz"
                  mongodump \
                    --uri="mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/opensilex?authSource=admin&directConnection=true" \
                    --gzip \
                    --archive="$FILENAME"
                  echo "Backup written: $FILENAME"
                  find /backup -name "*.gz" -mtime +30 -delete
                  echo "Old backups pruned (>30 days)."
              env:
                - name: MONGO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: root-password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mongodb-backup-pvc
