---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-stack
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/kyverno/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for the Kyverno HelmRelease to be Ready before marking this
  # Kustomization as Ready. This ensures Kyverno CRDs (ClusterPolicy etc.)
  # are registered before kyverno-policy tries to apply them.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: flux-system
