---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/cert-manager/config
  prune: true
  dependsOn:
    - name: cert-manager-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
