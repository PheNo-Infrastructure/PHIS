---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stack
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Substitutes ${ESO_IDENTITY_CLIENT_ID} and ${KEY_VAULT_URI} in
  # serviceaccount.yaml and clustersecretstore.yaml.
  # The ConfigMap is created imperatively by 04-bootstrap.ps1 — it is not in
  # git because its values are only known after terraform apply.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: phis-tf-outputs
        optional: false
