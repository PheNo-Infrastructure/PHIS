---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stack
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/external-secrets/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for the ESO HelmRelease to be Ready before marking this kustomization
  # as Ready. This ensures the ESO CRDs are registered before the config phase
  # (external-secrets-config) tries to apply ClusterSecretStore.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: flux-system
