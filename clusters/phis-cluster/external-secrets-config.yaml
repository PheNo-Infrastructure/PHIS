---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/external-secrets/config
  prune: true
  # Depends on external-secrets-stack being Ready, which only happens after
  # the ESO HelmRelease is healthy (CRDs registered). This prevents
  # ClusterSecretStore from being applied before ESO CRDs exist.
  dependsOn:
    - name: external-secrets-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Substitutes ${ESO_IDENTITY_CLIENT_ID} and ${KEY_VAULT_URI}.
  # ConfigMap created by 04-bootstrap.ps1 — not in git.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: phis-tf-outputs
        optional: false
