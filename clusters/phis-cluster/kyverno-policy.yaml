---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policy
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/kyverno/policy
  prune: true
  # Depends on kyverno-stack being Ready (HelmRelease healthy, CRDs registered).
  # This prevents ClusterPolicy from being applied before the Kyverno webhook is running.
  dependsOn:
    - name: kyverno-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
