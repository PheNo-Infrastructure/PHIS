# Flux Kustomization — tells Flux to watch k8s/monitoring/install/ in Git
# and apply everything there to the cluster. Flux reconciles every 5 minutes,
# so any change you push will be live within ~5 minutes automatically.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-stack
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/monitoring/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: flux-system
