name: Graph Explorer (portal)

# Pull requests: tests only. Push to main (or a manual run on main): tests, then build the image in ACR,
# roll it out to the portal and check it; a failed check rolls back.
# Tests: one job per test file, in parallel (a new file is picked up automatically). Changes that only touch docs or
# the hand-applied k8s files run nothing.
on:
  pull_request:
    paths: ['graph-explorer/**', '.github/workflows/graph-explorer.yml', '!graph-explorer/docs/**', '!graph-explorer/k8s/**']
  push:
    branches: [main]
    paths: ['graph-explorer/**', '.github/workflows/graph-explorer.yml', '!graph-explorer/docs/**', '!graph-explorer/k8s/**']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Redeploy without running the tests again (they ran when the commit was merged)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: graph-explorer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push replaces a PR's test run, but never interrupts a deploy

jobs:
  files:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        # Everything except the live smoke test, which needs PHIS credentials.
        run: |
          cd graph-explorer
          files=$(ls test/*.test.ts | grep -v live-smoke | sed 's/.*/"&"/' | paste -sd, -)
          echo "list=[$files]" >> "$GITHUB_OUTPUT"

  test:
    needs: files
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.files.outputs.list) }}
    name: test ${{ matrix.file }}
    defaults:
      run:
        working-directory: graph-explorer
    env:
      # There is no PHIS in CI: the server talks to a fake one (test/fake-phis.mts, started below) that answers empty lists.
      PHIS_HOST: http://localhost:4999
      PHIS_USER: ci
      PHIS_PASS: ci
      NO_LIVE_PHIS: '1' # the tests that need a real PHIS skip themselves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graph-explorer/package-lock.json
      - run: npm ci
      - name: Install Chromium (about 5 min of apt), only for test files that use a browser
        run: if grep -q 'from "playwright"' "${{ matrix.file }}"; then npx playwright install --with-deps chromium; fi
      - name: Run the file (7 min limit per attempt, 3 attempts); two browser tests flake under load, every failed attempt is said out loud
        run: |
          node --experimental-strip-types test/fake-phis.mts 4999 &
          sleep 1
          for attempt in 1 2 3; do
            if timeout 420 node --experimental-strip-types --test "${{ matrix.file }}"; then exit 0; fi
            echo "::warning::${{ matrix.file }} failed attempt $attempt"
          done
          exit 1

  deploy:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.skip_tests)) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: phisacr
      IMAGE: phisacr.azurecr.io/graph-explorer
      PORTAL_URL: https://phis.pheno.no/portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The CI identity has AcrPush on phisacr (enough to push an image, not to start an ACR build task), so the image
      # is built on the runner and pushed, tagged with the commit and as latest.
      - name: Build and push the image
        run: |
          # `az acr login` needs a refresh token, which a federated (OIDC) login does not have, so the registry's own token
          # exchange is called directly: the ARM access token (the identity holds AcrPush on phisacr) for an ACR token.
          ARM=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$ARM"
          STATUS=$(curl -s -o acr.json -w %{http_code} -X POST "https://${REGISTRY}.azurecr.io/oauth2/exchange"             -d grant_type=access_token -d "service=${REGISTRY}.azurecr.io" -d "tenant=${{ secrets.AZURE_TENANT_ID }}"             --data-urlencode "access_token=${ARM}")
          if [ "$STATUS" != 200 ]; then echo "::error::the registry answered $STATUS to the token exchange"; cat acr.json; echo; exit 1; fi
          ACR_TOKEN=$(jq -r .refresh_token acr.json)
          echo "::add-mask::$ACR_TOKEN"
          echo "$ACR_TOKEN" | docker login "${REGISTRY}.azurecr.io" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" graph-explorer
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4
        with:
          resource-group: phis-rg
          cluster-name: phis-cluster

      - name: Roll out
        id: rollout
        run: |
          kubectl set image deployment/graph-explorer "graph-explorer=${IMAGE}:${GITHUB_SHA}" -n graph-explorer
          kubectl rollout status deployment/graph-explorer -n graph-explorer --timeout=180s

      - name: Check the live portal
        run: |
          set -e
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PORTAL_URL/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PORTAL_URL/api/instance")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$PORTAL_URL/api/experiment-delete?id=x&name=x")" = 403

      - name: Roll back if the rollout or the checks failed
        # Only once the rollout has started: a failure before it (build, push) changed nothing to roll back.
        if: failure() && steps.rollout.outcome != 'skipped'
        run: kubectl rollout undo deployment/graph-explorer -n graph-explorer
