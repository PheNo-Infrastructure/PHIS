name: Build Patched OpenSILEX

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image tag to push to GHCR (e.g. 1.5.0.1)'
        required: true
        default: '1.5.0.1'
      opensilex_tag:
        description: 'Upstream OpenSILEX git tag to build from (e.g. 1.5.0)'
        required: true
        default: '1.5.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opensilex-phis

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout PHIS repo
        uses: actions/checkout@v4

      - name: Clone opensilex-docker-compose
        run: git clone --depth 1 https://github.com/OpenSILEX/opensilex-docker-compose.git build-context

      - name: Copy patches into build context
        run: cp -r tools/patches build-context/patches

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched image
        uses: docker/build-push-action@v5
        with:
          context: build-context
          file: tools/patches/opensilex-build-step.docker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ inputs.image_version }}
          build-args: |
            OPENSILEX_RELEASE_TAG=${{ inputs.opensilex_tag }}
            IMAGE_VERSION=${{ inputs.image_version }}
            INTERNAL_DATA_DIRECTORY=data
          cache-from: type=gha
          cache-to: type=gha,mode=max
