name: OpenSILEX Testing Suite

on:
  workflow_dispatch:

jobs:
  tier2-api-tests:
    name: Tier 2 - Comprehensive API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements.txt
      
      - name: Run Tier 2 API tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
          OPENSILEX_TEST_PREFIX: 'ci_test_'
          OPENSILEX_CLEANUP_TEST_DATA: 'true'
          OPENSILEX_API_TIMEOUT: '30'
        run: |
          cd tools/testing/tier2/api-tests
          python -m pytest --html=report.html --self-contained-html -v --tb=short --maxfail=5
      
      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-api-test-report-${{ github.run_number }}
          path: tools/testing/tier2/api-tests/report.html
          retention-days: 30

  tier3-performance:
    name: Tier 3 - Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tier2-api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tier 3 dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Run API performance benchmarks
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/performance-tests
          python -m pytest test_api_benchmarks.py -v --tb=short

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmarks-${{ github.run_number }}
          path: tools/testing/tier3/performance-tests/
          retention-days: 90

  tier3-security:
    name: Tier 3 - Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tier2-api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tier 3 dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Run authorization tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/security-tests
          python -m pytest test_authorization.py -v --tb=short

      - name: Run JWT security tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/security-tests
          python -m pytest test_jwt_security.py -v --tb=short

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results-${{ github.run_number }}
          path: tools/testing/tier3/security-tests/
          retention-days: 30

  tier3-database-integrity:
    name: Tier 3 - Database Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tier2-api-tests
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/testing/requirements-tier3.txt

      - name: Set up SSH key for server access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.OPENSILEX_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connectivity
        env:
          OPENSILEX_SERVER: ${{ secrets.OPENSILEX_SERVER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no azureuser@${OPENSILEX_SERVER} "echo 'SSH connection successful'"

      - name: Run MongoDB integrity checks
        env:
          OPENSILEX_SERVER: ${{ secrets.OPENSILEX_SERVER }}
          OPENSILEX_DEPLOY_DIR: '~/opensilex-docker-compose'
        run: |
          cd tools/testing/tier3/database-tests
          bash test-mongodb-integrity.sh

      - name: Run RDF4J integrity checks
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/database-tests
          bash test-rdf4j-integrity.sh

      - name: Run cross-database consistency tests
        env:
          OPENSILEX_API_URL: ${{ secrets.OPENSILEX_API_URL }}
          OPENSILEX_ADMIN_EMAIL: 'admin@opensilex.org'
          OPENSILEX_ADMIN_PASSWORD: ${{ secrets.OPENSILEX_ADMIN_PASSWORD }}
        run: |
          cd tools/testing/tier3/database-tests
          python -m pytest test_cross_db_consistency.py -v --tb=short

      - name: Upload integrity test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-integrity-results-${{ github.run_number }}
          path: tools/testing/tier3/database-tests/
          retention-days: 30

  test-summary:
    name: Test Summary & Notifications
    runs-on: ubuntu-latest
    needs: [tier2-api-tests, tier3-performance, tier3-security, tier3-database-integrity]
    if: always()

    steps:
      - name: Check overall test status
        run: |
          echo "=========================================="
          echo "OpenSILEX Testing Summary"
          echo "=========================================="
          echo ""
          echo "All testing stages completed"
          echo "Review artifacts for detailed results"
          echo ""
          echo "Job results:"
          echo "  - Tier 2 API Tests: ${{ needs.tier2-api-tests.result }}"
          echo "  - Tier 3 Performance: ${{ needs.tier3-performance.result }}"
          echo "  - Tier 3 Security: ${{ needs.tier3-security.result }}"
          echo "  - Tier 3 Database: ${{ needs.tier3-database-integrity.result }}"

      - name: Create issue on scheduled test failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const tier2Result = '${{ needs.tier2-api-tests.result }}';
            const tier3PerfResult = '${{ needs.tier3-performance.result }}';
            const tier3SecResult = '${{ needs.tier3-security.result }}';
            const tier3DbResult = '${{ needs.tier3-database-integrity.result }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled Test Failure - ${date}`,
              body: `The scheduled OpenSILEX test run has failed.

            ## Test Results

            - Tier 2 API Tests: ${tier2Result}
            - Tier 3 Performance: ${tier3PerfResult}
            - Tier 3 Security: ${tier3SecResult}
            - Tier 3 Database: ${tier3DbResult}

            ## Action Required

            Please investigate the test failures and ensure the OpenSILEX deployment is functioning correctly.

            **Workflow run:** ${runUrl}

            **Server:** ${{ secrets.OPENSILEX_SERVER }}
            `,
              labels: ['testing', 'automated', 'health-check']
            });

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [tier2-api-tests, tier3-performance, tier3-security]
    # Only deploy on push events (not scheduled runs) and only if core tests pass
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/debian-11-production' &&
      needs.tier2-api-tests.result == 'success' &&
      needs.tier3-performance.result == 'success' &&
      needs.tier3-security.result == 'success'

    # Require manual approval for production deployments
    environment:
      name: production
      url: https://phis.pheno.no/sandbox/app/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.OPENSILEX_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy updated code to server
        env:
          SERVER: ${{ secrets.OPENSILEX_SERVER }}
        run: |
          echo "=========================================="
          echo "Deploying to Production Server"
          echo "=========================================="

          # Upload deployment scripts and configs
          scp -i ~/.ssh/id_ed25519 -r \
            tools/docker-deployment \
            deploy-environment.ps1 \
            azureuser@${SERVER}:/tmp/phis-deploy/

          # Note: We don't upload tools/config/* (contains secrets, already on server)

          echo "[OK] Uploaded deployment files"

      - name: Apply patches and theme
        env:
          SERVER: ${{ secrets.OPENSILEX_SERVER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 azureuser@${SERVER} << 'ENDSSH'
            set -e

            echo "=========================================="
            echo "Applying Production Updates"
            echo "=========================================="

            cd ~/opensilex-docker-compose

            # Apply patches (if source code changed)
            if [ -f "/tmp/phis-deploy/tools/docker-deployment/03-apply-patches.ps1" ]; then
              echo "[1/2] Applying security patches..."
              pwsh /tmp/phis-deploy/tools/docker-deployment/03-apply-patches.ps1 \
                -Server localhost \
                -ApiKeysFile ~/phis-config/api-keys-production.conf || echo "Patches already applied or not needed"
            fi

            # Apply theme (if theme files changed)
            if [ -f "/tmp/phis-deploy/tools/docker-deployment/04-apply-theme.ps1" ]; then
              echo "[2/2] Applying PheNo theme..."
              pwsh /tmp/phis-deploy/tools/docker-deployment/04-apply-theme.ps1 \
                -Server localhost || echo "Theme already applied or not needed"
            fi

            # Verify OpenSILEX is running
            docker compose ps opensilex

            echo "=========================================="
            echo "Production Deployment Complete"
            echo "=========================================="
          ENDSSH

      - name: Verify deployment
        env:
          API_URL: ${{ secrets.OPENSILEX_API_URL }}
        run: |
          echo "Verifying production API is responsive..."
          sleep 10  # Give service time to restart if needed

          response=$(curl -s -o /dev/null -w "%{http_code}" ${API_URL}/security/authentication)

          if [ "$response" -eq 200 ]; then
            echo "✅ Production API is healthy (HTTP $response)"
          else
            echo "❌ Production API returned HTTP $response"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "=========================================="
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Production URL: https://phis.pheno.no/sandbox/app/"
          echo "API Endpoint: https://phis.pheno.no/sandbox/rest"
          echo ""
          echo "Deployed changes from: ${{ github.sha }}"
          echo "=========================================="
